<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — configuración</title>
<link rel="stylesheet" href="styles.css">
<style>
.set h1{margin-bottom:4px}
.set .lead{color:var(--text-2);font-size:14px;margin-bottom:18px}
.grp{border:1px solid var(--border);border-radius:14px;margin:0 0 16px;overflow:hidden;background:var(--surface)}
.grp>h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.grp>h2 .gi{font-size:17px}
.grp .body{padding:14px 16px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .lbl{flex:1;min-width:160px}
.row .lbl .k{font-size:14px}
.row .lbl .d{color:var(--text-2);font-size:12.5px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;border-left:1px solid var(--border);padding:7px 13px;font-size:13px;background:var(--surface)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:#fff}
.val{color:var(--text-2);font-size:13px;min-width:74px;text-align:right}
input[type=range]{accent-color:var(--accent)}
.eqbands{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.eqbands .b{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.eqbands .b input{writing-mode:vertical-lr;direction:rtl;width:22px;height:90px}
.eqbands .b .f{font-size:11px;color:var(--text-2)}
.eqbands .b .g{font-size:11px;color:var(--text-2)}
.pre{display:flex;gap:7px;flex-wrap:wrap}
.pre button{font-size:12.5px;padding:5px 11px;border-radius:999px}
.stat{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat .s{font-size:13px}
.stat .s b{font-size:18px;font-family:var(--serif);font-weight:600}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--text-2);word-break:break-all}
.tag{display:inline-block;font-size:11px;background:var(--surface-2);color:var(--text-2);border-radius:999px;padding:2px 9px;margin-left:6px}
.soon{color:var(--muted);font-size:13px;font-style:italic}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw .t{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;transition:background .15s;pointer-events:none}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked+.t{background:var(--accent-bg);border-color:var(--accent)}
.sw input:checked+.t::after{transform:translateX(18px);background:var(--accent)}
</style>
</head>
<body>
<div class="wrap set">
  <h1>Configuración</h1>
  <div class="lead">Lo que se puede cambiar aquí se aplica al instante. Lo marcado como <i>próximamente</i> aún no está cableado.</div>
  <div id="app">cargando…</div>
</div>

<script src="player.js" defer></script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

window.addEventListener('DOMContentLoaded', async () => {
  const P = window.player;
  let info = {}; try { info = await fetch('/api/settings').then(r => r.json()); } catch (e) {}
  const S = (P && P.getSettings) ? P.getSettings() : { xfade: 0, rgMode: 'track', radio: false, eqOn: false, eqGains: [0,0,0,0,0,0,0], eqFreqs: ['60','150','400','1k','2.4k','6k','15k'], presets: [], zone: {}, nativeMode: false };
  const app = document.getElementById('app');

  const lib = info.library || {}, watch = info.watch || {}, scr = info.scrobble || {}, nat = info.native || {}, ap = info.app || {};
  const theme = (window.escunav && escunav.getTheme) ? escunav.getTheme() : 'auto';
  const zoneName = S.nativeMode ? ((S.zone && S.zone.name) || 'Este equipo') + ' · WASAPI nativo' : S.upnpMode ? (S.upnpName || 'Dispositivo de red') + ' · UPnP/DLNA' : ((S.zone && S.zone.label) || (S.zone && S.zone.name) || 'Este equipo (navegador)');

  const rgSeg = m => `<div class="seg" id="rgseg">${['track','album','off'].map(k => `<button data-rg="${k}" class="${S.rgMode===k?'on':''}">${k==='track'?'Por pista':k==='album'?'Por álbum':'Desactivado'}</button>`).join('')}</div>`;
  const themeSeg = `<div class="seg" id="thseg">${['auto','light','dark'].map(k => `<button data-th="${k}" class="${theme===k?'on':''}">${k==='auto'?'Automático':k==='light'?'Claro':'Oscuro'}</button>`).join('')}</div>`;
  const presets = (S.presets||[]).map(p => `<button data-pre="${p}">${esc(p)}</button>`).join('');
  const bands = S.eqGains.map((g,i) => `<div class="b"><span class="g" id="eqg${i}">${g>0?'+':''}${g}</span><input class="eqband" type="range" min="-12" max="12" step="1" value="${g}" data-i="${i}"><span class="f">${esc(S.eqFreqs[i]||'')}</span></div>`).join('');

  app.innerHTML = `
  <div class="grp"><h2><span class="gi">${window.icon('library',18)}</span> Biblioteca</h2><div class="body">
    <div class="row"><div class="stat">
      <span class="s"><b>${lib.albums||0}</b> álbumes</span><span class="s"><b>${lib.artists||0}</b> artistas</span>
      <span class="s"><b>${lib.tracks||0}</b> pistas</span><span class="s"><b>${lib.files||0}</b> ficheros</span>
      <span class="s"><b>${lib.genres||0}</b> géneros</span><span class="s"><b>${lib.covers||0}</b> carátulas</span>
    </div></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:8px">Carpetas de música vigiladas <span id="watchlive"></span></div>
      <div id="cfgfolders" class="d">cargando…</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="newfolder" placeholder="C:\\Users\\tú\\Music" style="flex:1;min-width:200px"><button id="browsefolder">Explorar…</button><button id="addfolder">Añadir carpeta</button></div>
      <div id="cfgmsg" style="margin-top:8px;font-size:12.5px;display:none"></div>
      <div class="d" style="margin-top:6px">Se vigilan en vivo (añadir/quitar ficheros reescanea solo; las carpetas de red se sondean cada ~30 s). Metadatos, carátulas, letras y análisis se amplían con las herramientas de <span class="mono">data-layer/</span>.</div></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:8px">Fuente Obsidian <span class="d" style="font-weight:400">(opcional; tus notas mandan)</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="obsvault" placeholder="ruta del vault" style="flex:1;min-width:200px"><button id="browseobs">Explorar…</button><input id="obsfolder" placeholder="carpeta de álbumes" style="width:160px"><button id="saveobs">Guardar</button></div></div>
    <div class="row"><div class="lbl"><div class="k">Reescanear la biblioteca ahora</div><div class="d" id="rescanstatus">vuelve a escanear las carpetas y la fuente Obsidian</div></div><button id="rescanbtn">Reescanear ahora</button></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('backup',18)}</span> Copia de seguridad</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Crear una copia ahora</div><div class="d">Guarda una instantánea de toda tu biblioteca (tiers, valoraciones, etiquetas, historial, emisoras, presets…). Se conservan las <b>12</b> más recientes; además se crea una automática al arrancar si la última es antigua.</div></div><button id="bknow">Crear copia</button></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:8px">Copias guardadas</div>
      <div id="bklist" class="d">cargando…</div>
      <div id="bkmsg" style="font-size:12.5px;margin-top:8px;display:none"></div></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('zone',18)}</span> Audio — salida</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Zona de salida actual</div><div class="d">${esc(zoneName)}</div></div>
      <button id="chooseout">Elegir salida / zona…</button></div>
    <div class="row"><div class="lbl"><div class="k">Motor nativo (WASAPI)</div><div class="d">${nat.available?(nat.built?'compilado y disponible · resample sinc Kaiser, dither TPDF, EQ propio':'disponible pero sin compilar (ejecuta <span class="mono">engine/build.ps1</span>)'):'no disponible en esta build'}</div></div></div>
    <div class="row"><div class="lbl"><div class="k">Salida de red (UPnP/DLNA, p. ej. Eversolo)</div><div class="d">descubre renderers de la LAN y les envía la música (el aparato la descarga de /api/stream); elígelo en «Elegir salida / zona»</div></div>
      <button id="chooseout2">Elegir salida…</button></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('play',18)}</span> Reproducción</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Crossfade</div><div class="d">solapa el final de una pista con el inicio de la siguiente</div></div>
      <input id="xf" type="range" min="0" max="12" step="0.5" value="${S.xfade}" style="width:160px"><span class="val" id="xfval"></span></div>
    <div class="row"><div class="lbl"><div class="k">Normalización de volumen (ReplayGain)</div><div class="d">por pista (−18 LUFS) · por álbum (conserva la dinámica del disco) · desactivada</div></div>${rgSeg()}</div>
    <div class="row"><div class="lbl"><div class="k">Radio / autoplay</div><div class="d">extiende la cola automáticamente al terminar</div></div>
      <label class="sw"><input type="checkbox" id="radio" ${S.radio?'checked':''}><span class="t"></span></label></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('eq',18)}</span> Ecualizador</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Ecualizador de 7 bandas</div><div class="d">se aplica a la salida del navegador y, si está activo, al motor nativo</div></div>
      <label class="sw"><input type="checkbox" id="eqon" ${S.eqOn?'checked':''}><span class="t"></span></label></div>
    <div class="row" style="display:block"><div class="pre" id="pre">${presets}</div>
      <div class="eqbands" id="eqbands">${bands}</div></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('refresh',18)}</span> Servicios y scrobbling</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Scrobbling</div><div class="d">${(scr.enabled&&scr.enabled.length)?'activo: '+scr.enabled.map(esc).join(', ')+(scr.pending?` · ${scr.pending} en cola`:''):'desactivado (crea <span class="mono">app/scrobble.json</span> a partir de <span class="mono">scrobble.example.json</span>)'}</div></div></div>
    <div class="row"><div class="lbl"><div class="k">Spotify — ¿tengo este disco en mi biblioteca?</div><div class="d" id="spotrow">comparando tus discos locales con tus álbumes guardados en Spotify…</div></div><span id="spotbtns"></span></div>
    <div class="row"><div class="lbl"><div class="k">Tidal / Qobuz</div><div class="d soon">próximamente — ver <span class="mono">docs/ajustes-vs-roon.md</span></div></div></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('theme-auto',18)}</span> Interfaz</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Tema</div><div class="d">automático sigue al sistema; el fondo claro es blanco por diseño</div></div>${themeSeg}</div>
    <div class="row"><div class="lbl"><div class="k">Menú lateral</div><div class="d">fijo a la izquierda en escritorio, barra superior en móvil</div></div><span class="val">activo</span></div>
  </div></div>

  <div class="grp"><h2><span class="gi">${window.icon('settings',18)}</span> Avanzado</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Versión</div></div><span class="val">escucharrr ${esc(ap.version||'0.1')}</span></div>
    <div class="row"><div class="lbl"><div class="k">Servidor</div></div><span class="val">puerto ${esc(String(ap.port||''))}</span></div>
    <div class="row"><div class="lbl"><div class="k">Base de datos</div><div class="d mono">${esc(ap.db||'')}</div></div></div>
    <div class="row"><div class="lbl"><div class="k">Perfiles y acceso · Atajos de teclado</div><div class="d soon">próximamente</div></div></div>
  </div></div>`;

  // ── cableado (reusa la lógica del player) ──
  const setXfLabel = v => { const l = document.getElementById('xfval'); if (l) l.textContent = (+v === 0) ? 'desactivado' : (+v).toFixed(1).replace('.0','') + ' s'; };
  setXfLabel(S.xfade);
  const xf = document.getElementById('xf');
  if (xf) xf.addEventListener('input', e => { const v = parseFloat(e.target.value); setXfLabel(v); if (P && P.setXfade) P.setXfade(v); });

  document.getElementById('rgseg').addEventListener('click', e => { const b = e.target.closest('[data-rg]'); if (!b) return; if (P && P.setRgMode) P.setRgMode(b.dataset.rg); [...e.currentTarget.children].forEach(c => c.classList.toggle('on', c === b)); });
  document.getElementById('thseg').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (!b) return; if (window.escunav) escunav.setTheme(b.dataset.th); [...e.currentTarget.children].forEach(c => c.classList.toggle('on', c === b)); });

  const radio = document.getElementById('radio'); if (radio) radio.addEventListener('change', e => { if (P && P.setRadio) P.setRadio(e.target.checked); });
  const eqon = document.getElementById('eqon'); if (eqon) eqon.addEventListener('change', e => { if (P && P.setEqEnabled) P.setEqEnabled(e.target.checked); });

  document.getElementById('pre').addEventListener('click', e => { const b = e.target.closest('[data-pre]'); if (!b || !P || !P.setPreset) return; P.setPreset(b.dataset.pre); refreshEq(); });
  document.getElementById('eqbands').addEventListener('input', e => { const s = e.target.closest('.eqband'); if (!s || !P || !P.setEqBand) return; const i = +s.dataset.i, v = parseInt(s.value, 10); P.setEqBand(i, v); const g = document.getElementById('eqg'+i); if (g) g.textContent = (v>0?'+':'') + v; });
  function refreshEq() { if (!P || !P.getSettings) return; const s = P.getSettings(); const on = document.getElementById('eqon'); if (on) on.checked = s.eqOn; s.eqGains.forEach((v,i) => { const sl = document.querySelector('.eqband[data-i="'+i+'"]'); if (sl) sl.value = v; const g = document.getElementById('eqg'+i); if (g) g.textContent = (v>0?'+':'') + v; }); }

  ['chooseout', 'chooseout2'].forEach(id => { const co = document.getElementById(id); if (co) co.addEventListener('click', () => { if (P && P.openOutput) P.openOutput(); }); });

  // Spotify: comparar la biblioteca local con tus álbumes guardados
  function renderSpotify(sp) {
    const row = document.getElementById('spotrow'), btns = document.getElementById('spotbtns'); if (!row) return;
    sp = sp || {};
    if (!sp.configured) { row.innerHTML = 'Crea <span class="mono">app/spotify.json</span> (a partir de <span class="mono">spotify.example.json</span>) con una app de <span class="mono">developer.spotify.com</span> y su Redirect URI.'; btns.innerHTML = ''; return; }
    if (!sp.authorized) { row.textContent = 'Conecta tu cuenta para traer tus álbumes guardados (solo lectura, no reproduce nada).'; btns.innerHTML = '<button id="spotconn">Conectar Spotify</button>'; document.getElementById('spotconn').onclick = () => location.href = '/api/spotify/auth'; return; }
    row.innerHTML = 'Conectado. <b>' + (sp.matched || 0) + '</b> de tus discos locales están en tu Spotify (se indica en cada álbum).';
    btns.innerHTML = '<button id="spotsync">Sincronizar</button>';
    document.getElementById('spotsync').onclick = async () => { const b = document.getElementById('spotsync'); b.disabled = true; b.textContent = 'Sincronizando…'; try { const r = await fetch('/api/spotify/sync', { method: 'POST' }).then(x => x.json()); if (r.ok) row.innerHTML = 'Sincronizado: <b>' + r.matched + '</b> de tus discos están en Spotify (de ' + r.saved + ' guardados).'; else row.textContent = 'Error: ' + (r.error || ''); } catch (e) { row.textContent = 'Error de red.'; } b.disabled = false; b.textContent = 'Sincronizar'; };
  }
  renderSpotify(info.spotify);
  const sq = new URLSearchParams(location.search).get('spotify');
  if (sq === 'ok') { const r = document.getElementById('spotrow'); if (r) r.innerHTML = '¡Conectado! Sincronizando tu biblioteca…'; setTimeout(() => fetch('/api/spotify/status').then(x => x.json()).then(renderSpotify).catch(() => {}), 2500); }
  else if (sq === 'error') { const r = document.getElementById('spotrow'); if (r) r.textContent = 'No se pudo conectar con Spotify. Revisa app/spotify.json y la Redirect URI.'; }

  // ── Biblioteca editable: carpetas vigiladas + Obsidian + reescaneo ──
  const CFG = { folders: [], obsidian: null };
  function renderFolders() {
    const box = document.getElementById('cfgfolders'); if (!box) return;
    const f = CFG.folders || [];
    box.innerHTML = f.length ? f.map((p, i) => `<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span class="mono" style="flex:1;word-break:break-all">${esc(p)}</span><button class="rmfolder" data-i="${i}" title="Quitar carpeta" style="padding:5px 8px;display:inline-flex;align-items:center">${window.icon('close',14)}</button></div>`).join('') : '<span style="color:var(--text-2)">Ninguna todavía. Añade una carpeta abajo.</span>';
  }
  function applyWatchLive(active) { const w = document.getElementById('watchlive'); if (w) w.innerHTML = (active && CFG.folders.length) ? '<span class="tag">en vivo</span>' : ''; }
  // feedback visible: nada de fallos en silencio (si el servidor está caído o da error, se ve)
  function cfgMsg(text, ok) { const m = document.getElementById('cfgmsg'); if (!m) return; m.textContent = text || ''; m.style.display = text ? 'block' : 'none'; m.style.color = ok ? 'var(--accent)' : '#c0392b'; clearTimeout(cfgMsg._t); if (ok && text) cfgMsg._t = setTimeout(() => { m.style.display = 'none'; }, 2500); }
  async function saveFolders() {
    try {
      const r = await fetch('/api/config/folders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folders: CFG.folders }) }).then(x => x.json());
      if (r.ok) { CFG.folders = r.folders || []; renderFolders(); applyWatchLive(r.active); cfgMsg('Carpetas guardadas.', true); }
      else { cfgMsg('No se pudo guardar: ' + (r.error || 'error del servidor'), false); await loadConfig(); }
    } catch (e) { cfgMsg('No se pudo contactar con el servidor (¿está en marcha?). No se guardó nada.', false); }
  }
  async function loadConfig() {
    let c = null; try { c = await fetch('/api/config').then(x => x.json()); } catch (e) {}
    if (!c || !c.ok) return;
    CFG.folders = c.folders || []; CFG.obsidian = c.obsidian || null;
    renderFolders(); applyWatchLive(c.active);
    const v = document.getElementById('obsvault'), af = document.getElementById('obsfolder');
    if (v && c.obsidian) v.value = c.obsidian.vault || ''; if (af && c.obsidian) af.value = c.obsidian.albumsFolder || '';
  }
  loadConfig();
  document.getElementById('cfgfolders').addEventListener('click', e => { const b = e.target.closest('.rmfolder'); if (b) { CFG.folders.splice(+b.dataset.i, 1); saveFolders(); } });
  document.getElementById('addfolder').addEventListener('click', () => { const inp = document.getElementById('newfolder'); const p = (inp.value || '').trim(); if (!p) return; CFG.folders.push(p); inp.value = ''; saveFolders(); });
  document.getElementById('newfolder').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('addfolder').click(); });
  // selector NATIVO de carpeta de Windows (el servidor abre el diálogo del Explorador)
  async function browse(opts, btn) { const lbl = btn.textContent; btn.disabled = true; btn.textContent = 'Abriendo…'; try { const r = await fetch('/api/config/browse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(opts) }).then(x => x.json()); if (!r.ok) { alert(r.error || 'No se pudo abrir el selector.'); return null; } return r.cancelled ? null : (r.path || null); } catch (e) { alert('No se pudo abrir el selector de carpeta.'); return null; } finally { btn.disabled = false; btn.textContent = lbl; } }
  document.getElementById('browsefolder').addEventListener('click', async e => { const p = await browse({ desc: 'Elige una carpeta de música para vigilar', init: CFG.folders[CFG.folders.length - 1] || '' }, e.currentTarget); if (p && !CFG.folders.includes(p)) { CFG.folders.push(p); saveFolders(); } });
  document.getElementById('browseobs').addEventListener('click', async e => { const inp = document.getElementById('obsvault'); const p = await browse({ desc: 'Elige la carpeta del vault de Obsidian', init: inp.value || '' }, e.currentTarget); if (p) inp.value = p; });
  document.getElementById('saveobs').addEventListener('click', async () => { const vault = (document.getElementById('obsvault').value || '').trim(); const albumsFolder = (document.getElementById('obsfolder').value || '').trim(); const b = document.getElementById('saveobs'); b.disabled = true; b.textContent = 'Guardando…'; try { const r = await fetch('/api/config/obsidian', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vault, albumsFolder }) }).then(x => x.json()); if (r.ok) { CFG.obsidian = r.obsidian; cfgMsg('Fuente Obsidian guardada.', true); } else cfgMsg('No se pudo guardar Obsidian: ' + (r.error || 'error'), false); } catch (e) { cfgMsg('No se pudo contactar con el servidor. No se guardó.', false); } b.disabled = false; b.textContent = 'Guardar'; });
  document.getElementById('rescanbtn').addEventListener('click', async () => { const b = document.getElementById('rescanbtn'), st = document.getElementById('rescanstatus'); b.disabled = true; b.textContent = 'Reescaneando…'; st.textContent = 'reescaneando… (puede tardar)'; try { const r = await fetch('/api/config/rescan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ what: ['music', 'vault'] }) }).then(x => x.json()); if (r.ok) { const m = (r.music || []).map(x => x.result).filter(Boolean).join(' · '); st.textContent = 'Listo. ' + (m || '') + (r.vault ? ' · ' + r.vault : ''); } else st.textContent = 'Error: ' + (r.error || ''); } catch (e) { st.textContent = 'Error de red.'; } b.disabled = false; b.textContent = 'Reescanear ahora'; });

  // ── copia de seguridad: crear / listar / descargar / restaurar / borrar ──
  let BACKUPS = [];
  function bkMsg(t, ok) { const m = document.getElementById('bkmsg'); if (!m) return; m.textContent = t || ''; m.style.display = t ? 'block' : 'none'; m.style.color = ok ? 'var(--accent)' : '#c0392b'; clearTimeout(bkMsg._t); if (ok && t) bkMsg._t = setTimeout(() => { m.style.display = 'none'; }, 3500); }
  function fmtBk(f) { const m = /escucharrr-(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})/.exec(f); if (!m) return f; return `${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]}`; }
  function renderBackups() {
    const box = document.getElementById('bklist'); if (!box) return;
    if (!BACKUPS.length) { box.innerHTML = '<span style="color:var(--text-2)">Aún no hay copias. Crea la primera con el botón de arriba.</span>'; return; }
    box.innerHTML = BACKUPS.map(b => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
      <span class="mono" style="flex:1">${fmtBk(b.file)} <span style="color:var(--muted)">· ${Math.max(1,Math.round(b.size/1024))} KB</span></span>
      <a href="/api/backup/download?f=${encodeURIComponent(b.file)}" title="Descargar" style="color:var(--text-2);display:inline-flex;padding:4px">${window.icon('download',16)}</a>
      <button class="bkrestore" data-f="${esc(b.file)}" style="font-size:12px;padding:4px 10px">Restaurar</button>
      <span class="bkdel" data-f="${esc(b.file)}" title="Borrar" style="cursor:pointer;color:var(--text-2);display:inline-flex;padding:4px">${window.icon('trash',16)}</span>
    </div>`).join('');
  }
  function loadBackups() { fetch('/api/backup/list').then(r => r.json()).then(j => { if (j.ok) { BACKUPS = j.backups || []; renderBackups(); } }).catch(() => { const box = document.getElementById('bklist'); if (box) box.textContent = 'No se pudo cargar.'; }); }
  loadBackups();
  document.getElementById('bknow').addEventListener('click', async () => { const b = document.getElementById('bknow'); b.disabled = true; b.textContent = 'Creando…'; try { const r = await fetch('/api/backup/now', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(x => x.json()); if (r.ok) { BACKUPS = r.backups || []; renderBackups(); bkMsg('Copia creada: ' + fmtBk(r.file), true); } else bkMsg('No se pudo crear: ' + (r.error || ''), false); } catch (e) { bkMsg('No se pudo contactar con el servidor.', false); } b.disabled = false; b.textContent = 'Crear copia'; });
  document.getElementById('bklist').addEventListener('click', async e => {
    const rb = e.target.closest('.bkrestore');
    if (rb) { if (!confirm('¿Restaurar esta copia? Se reemplazará tu biblioteca actual (se guarda una copia de seguridad del estado actual antes de restaurar).')) return; rb.disabled = true; rb.textContent = 'Restaurando…'; try { const r = await fetch('/api/backup/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: rb.dataset.f }) }).then(x => x.json()); if (r.ok) { BACKUPS = r.backups || []; renderBackups(); bkMsg('Restaurado. La biblioteca se ha recargado.', true); } else bkMsg('No se pudo restaurar: ' + (r.error || ''), false); } catch (e2) { bkMsg('No se pudo contactar con el servidor.', false); } return; }
    const db = e.target.closest('.bkdel');
    if (db) { if (!confirm('¿Borrar esta copia?')) return; try { const r = await fetch('/api/backup/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: db.dataset.f }) }).then(x => x.json()); if (r.ok) { BACKUPS = r.backups || []; renderBackups(); } } catch (e2) {} }
  });
});
</script>
</body>
</html>
