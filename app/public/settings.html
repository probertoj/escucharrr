<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>escucharrr — configuración</title>
<link rel="stylesheet" href="styles.css">
<style>
.set h1{margin-bottom:4px}
.set .lead{color:var(--text-2);font-size:14px;margin-bottom:18px}
.grp{border:1px solid var(--border);border-radius:14px;margin:0 0 16px;overflow:hidden;background:var(--surface)}
.grp>h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.grp>h2 .gi{font-size:17px}
.grp .body{padding:14px 16px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .lbl{flex:1;min-width:160px}
.row .lbl .k{font-size:14px}
.row .lbl .d{color:var(--text-2);font-size:12.5px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;border-left:1px solid var(--border);padding:7px 13px;font-size:13px;background:var(--surface)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:#fff}
.val{color:var(--text-2);font-size:13px;min-width:74px;text-align:right}
input[type=range]{accent-color:var(--accent)}
.eqbands{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.eqbands .b{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.eqbands .b input{writing-mode:vertical-lr;direction:rtl;width:22px;height:90px}
.eqbands .b .f{font-size:11px;color:var(--text-2)}
.eqbands .b .g{font-size:11px;color:var(--text-2)}
.pre{display:flex;gap:7px;flex-wrap:wrap}
.pre button{font-size:12.5px;padding:5px 11px;border-radius:999px}
.stat{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat .s{font-size:13px}
.stat .s b{font-size:18px;font-family:var(--serif);font-weight:600}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--text-2);word-break:break-all}
.tag{display:inline-block;font-size:11px;background:var(--surface-2);color:var(--text-2);border-radius:999px;padding:2px 9px;margin-left:6px}
.soon{color:var(--muted);font-size:13px;font-style:italic}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw .t{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;transition:background .15s;pointer-events:none}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked+.t{background:var(--accent-bg);border-color:var(--accent)}
.sw input:checked+.t::after{transform:translateX(18px);background:var(--accent)}
/* Settings estilo Roon: nav de categorías a la izquierda + panel de contenido a la derecha */
.setlayout{display:flex;gap:24px;align-items:flex-start}
.setnav{position:sticky;top:16px;flex:none;width:214px;display:flex;flex-direction:column;gap:2px}
.setnav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-radius:10px;font-size:14.5px;color:var(--text);cursor:pointer;font-family:inherit}
.setnav button .ni{display:inline-flex;color:var(--text-2);flex:none}
.setnav button:hover{background:var(--surface-2)}
.setnav button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.setnav button.on .ni{color:var(--accent)}
.setpanel{flex:1;min-width:0}
.setpanel .grp{display:none;margin:0}
.setpanel .grp.on{display:block;animation:setfade .18s ease}
@keyframes setfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes scanpulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@media(max-width:820px){
  .setlayout{flex-direction:column;gap:12px;align-items:stretch}   /* stretch: hijos al ancho del móvil (con flex-start crecían al ancho de su contenido y desbordaban la página) */
  .setnav{position:static;width:auto;max-width:100%;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .setnav button{width:auto;white-space:nowrap;padding:8px 13px;border:1px solid var(--border)}
  .setnav button .ni{display:none}
}
</style>
</head>
<body>
<div class="wrap set">
  <h1>Configuración</h1>
  <div class="lead">Lo que se puede cambiar aquí se aplica al instante. Lo marcado como <i>próximamente</i> todavía no está disponible.</div>
  <div id="app">cargando…</div>
</div>

<script src="player.js" defer></script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

window.addEventListener('DOMContentLoaded', async () => {
  const P = window.player;
  let info = {}; try { info = await fetch('/api/settings').then(r => r.json()); } catch (e) {}
  const S = (P && P.getSettings) ? P.getSettings() : { xfade: 0, rgMode: 'track', radio: false, eqOn: false, eqGains: [0,0,0,0,0,0,0], eqFreqs: ['60','150','400','1k','2.4k','6k','15k'], presets: [], zone: {}, nativeMode: false };
  const bg = (P && P.getBgMode) ? P.getBgMode() : false;
  const app = document.getElementById('app');

  const lib = info.library || {}, watch = info.watch || {}, scr = info.scrobble || {}, nat = info.native || {}, ap = info.app || {};
  const theme = (window.escunav && escunav.getTheme) ? escunav.getTheme() : 'auto';
  const zoneName = S.nativeMode ? ((S.zone && S.zone.name) || 'Este equipo') + ' · WASAPI nativo' : S.upnpMode ? (S.upnpName || 'Dispositivo de red') + ' · UPnP/DLNA' : ((S.zone && S.zone.label) || (S.zone && S.zone.name) || 'Este equipo (navegador)');

  const rgSeg = m => `<div class="seg" id="rgseg">${['track','album','off'].map(k => `<button data-rg="${k}" class="${S.rgMode===k?'on':''}">${k==='track'?'Por pista':k==='album'?'Por álbum':'Desactivado'}</button>`).join('')}</div>`;
  const themeSeg = `<div class="seg" id="thseg">${['auto','light','dark'].map(k => `<button data-th="${k}" class="${theme===k?'on':''}">${k==='auto'?'Automático':k==='light'?'Claro':'Oscuro'}</button>`).join('')}</div>`;
  const presets = (S.presets||[]).map(p => `<button data-pre="${p}">${esc(p)}</button>`).join('');
  const bands = S.eqGains.map((g,i) => `<div class="b"><span class="g" id="eqg${i}">${g>0?'+':''}${g}</span><input class="eqband" type="range" min="-12" max="12" step="1" value="${g}" data-i="${i}"><span class="f">${esc(S.eqFreqs[i]||'')}</span></div>`).join('');

  app.innerHTML = `
  <div class="grp" data-cat="biblioteca"><h2><span class="gi">${window.icon('library',18)}</span> Biblioteca</h2><div class="body">
    <div class="row"><div class="stat">
      <span class="s"><b>${lib.albums||0}</b> álbumes</span><span class="s"><b>${lib.artists||0}</b> artistas</span>
      <span class="s"><b>${lib.tracks||0}</b> pistas</span><span class="s"><b>${lib.files||0}</b> ficheros</span>
      <span class="s"><b>${lib.genres||0}</b> géneros</span><span class="s"><b>${lib.covers||0}</b> carátulas</span>
    </div></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:8px">Carpetas de música vigiladas <span id="watchlive"></span></div>
      <div id="cfgfolders" class="d">cargando…</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="newfolder" placeholder="Escribe la ruta (p. ej. /music) o pulsa Explorar…" style="flex:1;min-width:220px"><button id="browsefolder">Explorar…</button><button id="addfolder">Añadir carpeta</button></div>
      <div class="d" style="margin-top:5px;font-size:12px">En Docker/NAS suele ser <span class="mono">/music</span>; en Windows, <span class="mono">C:\\Users\\tú\\Music</span>. Puedes <b>escribir la ruta</b> y pulsar «Añadir carpeta», o navegar con «Explorar…».</div>
      <div id="cfgmsg" style="margin-top:8px;font-size:12.5px;display:none"></div>
      <div class="d" style="margin-top:6px">Se vigilan en vivo (añadir/quitar ficheros reescanea solo). Las carpetas de red se sondean por nombres de carpetas y ficheros, sin leer cada fichero, con una pausa que se adapta a lo que tarde el NAS; un cambio de etiquetas sin renombrar no se detecta: usa «Reescanear ahora». Metadatos, carátulas, letras y análisis se amplían con las herramientas de <span class="mono">data-layer/</span>.</div>
      <div id="pollinfo" class="d" style="margin-top:4px;font-size:12px;display:none"></div></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:8px">Fuente Obsidian <span class="d" style="font-weight:400">(opcional; tus notas mandan)</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="obsvault" placeholder="ruta del vault" style="flex:1;min-width:200px"><button id="browseobs">Explorar…</button><input id="obsfolder" placeholder="carpeta de álbumes" style="width:150px"><input id="obsbiosfolder" placeholder="carpeta de biografías" style="width:170px"><button id="saveobs">Guardar</button></div>
      <div class="d" style="margin-top:6px;font-size:12px">Los discos se guardan en la <b>carpeta de álbumes</b> y las biografías de artista en la <b>carpeta de biografías</b>, respetando la estructura de tu vault. La de biografías admite una ruta <b>absoluta</b> si está fuera del vault (p. ej. una carpeta hermana como <span class="mono">…\\00. Índices</span>).</div></div>
    <div class="row"><div class="lbl"><div class="k">Reescanear la biblioteca ahora</div><div class="d" id="rescanstatus">vuelve a escanear las carpetas y la fuente Obsidian</div></div><button id="rescanbtn">Reescanear ahora</button></div>
    <div class="row" id="scanliverow" style="display:none"><div class="lbl" style="width:100%"><div class="k" style="display:flex;align-items:center;gap:8px"><span class="scanspin" style="width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:scanpulse 1s ease-in-out infinite"></span>Escaneando la biblioteca</div><div class="d" id="scanlive">…</div><div style="height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:7px;max-width:420px"><div id="scanbar" style="height:100%;width:0;background:var(--accent);transition:width .4s ease"></div></div></div></div>
    <div class="row"><div class="lbl"><div class="k">Reparar renombrados / movimientos</div><div class="d" id="repairstatus">si renombraste o moviste carpetas en tu disco, re-vincula los ficheros a su ruta nueva por identidad de contenido (sin re-escanear todo) y funde duplicados. Solo lee el disco: no mueve ni renombra nada tuyo.</div></div><button id="repairbtn">Reparar ahora</button></div>
    <div class="row"><div class="lbl"><div class="k">Identificar los «no identificados»</div><div class="d" id="idallstatus">reintenta identificar con MusicBrainz todos los álbumes sin identificar de golpe (por nº de pistas y duraciones). Útil tras corregir nombres o artistas: no hay que ir uno a uno con la lupa. Va en segundo plano; solo aplica las coincidencias fiables.</div></div><button id="idallbtn">Identificar todos</button></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:6px">Ficheros saltados en el último escaneo <span id="skipcount" style="color:var(--muted);font-weight:400"></span></div><div id="skiplist" class="d" style="max-height:220px;overflow:auto;font-size:12px;line-height:1.5">cargando…</div></div>
    <div class="row" style="display:block"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="k" style="flex:1">Artistas duplicados <span id="adupcount" style="color:var(--muted);font-weight:400"></span></div><button id="adupmergeall" style="flex:none;display:none">Unir todos</button></div><div class="d" style="margin-bottom:8px">Mismo artista con varias fichas (p. ej. «The X» y «X», o con y sin tilde). Únelos: sus álbumes y créditos pasan al que más álbumes tiene y las demás fichas se borran. <b>Unir todos</b> hace el lote de golpe (deshacible de una vez). Puedes <b>deshacerlo</b> desde «Fusiones hechas».</div><div id="aduplist" class="d" style="max-height:300px;overflow:auto;font-size:12.5px;line-height:1.5">cargando…</div></div>
    <div class="row" style="display:block"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="k" style="flex:1">Copias duplicadas del mismo álbum <span id="rcopcount" style="color:var(--muted);font-weight:400"></span></div><button id="rcopall" style="flex:none;display:none"></button><button id="rcopdropsel" style="flex:none;display:none">Quitar seleccionadas</button></div><div class="d" style="margin-bottom:8px">Por defecto, copias en <b>carpetas de conflicto de sync «… [N]»</b> (basura de sincronización): vienen <b>marcadas</b> para quitar. Con «Ver todas» se muestran también las demás copias del mismo álbum (sin marcar: pueden ser versiones legítimas). Quitar una copia la saca de la biblioteca <b>sin tocar el disco</b> (el escáner no la vuelve a añadir) y es <b>restaurable</b>. Revisa antes de quitar.</div><div id="rcoplist" class="d" style="max-height:320px;overflow:auto;font-size:12.5px;line-height:1.5">cargando…</div></div>
    <div class="row" style="display:block"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="k" style="flex:1">Copias quitadas <span id="rcopremcount" style="color:var(--muted);font-weight:400"></span></div><button id="rcoprestoreall" style="flex:none;display:none">Restaurar todas</button></div><div class="d" style="margin-bottom:8px">Copias que quitaste de la biblioteca. <b>Restaurar</b> las vuelve a añadir en el próximo escaneo (el disco nunca se tocó).</div><div id="rcopremlist" class="d" style="max-height:220px;overflow:auto;font-size:12.5px;line-height:1.5">cargando…</div></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:6px">Fusiones hechas <span id="mergecount" style="color:var(--muted);font-weight:400"></span></div><div class="d" style="margin-bottom:8px">Uniones de artista/álbum y tracklists fundidas. Puedes <b>deshacer cualquiera cuando quieras</b>, no solo justo después.</div><div id="mergelist" class="d" style="max-height:260px;overflow:auto;font-size:12.5px;line-height:1.5">cargando…</div></div>
  </div></div>

  <div class="grp" data-cat="backups"><h2><span class="gi">${window.icon('backup',18)}</span> Copia de seguridad</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Crear una copia ahora</div><div class="d">Guarda una instantánea de toda tu biblioteca (tiers, valoraciones, etiquetas, historial, emisoras, presets…). Se conservan las <b>12</b> más recientes; además se crea una automática al arrancar si la última es antigua.</div></div><button id="bknow">Crear copia</button></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:8px">Copias guardadas</div>
      <div id="bklist" class="d">cargando…</div>
      <div id="bkmsg" style="font-size:12.5px;margin-top:8px;display:none"></div></div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:6px">Llevar tu capa de usuario a otra instalación (sync)</div>
      <div class="d" style="margin-bottom:10px">Exporta <b>lo que tú has puesto</b> (valoraciones, tiers, favoritos, etiquetas, ediciones, listas, historial, emisoras y presets) a un fichero e impórtalo en otra instalación de escucharrr. Se reancla por <b>MBID y clave normalizada</b>, no por IDs internos: lo que no case con esa biblioteca se salta y se informa. No exporta tus ficheros ni el catálogo (eso sale de escanear).</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button id="syncexport">Exportar a fichero…</button>
        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px">Elegir fichero a importar…<input id="syncfile" type="file" accept="application/json,.json" style="display:none"></label>
      </div>
      <div id="syncbox" style="margin-top:10px;display:none"></div>
      <div id="syncmsg" style="font-size:12.5px;margin-top:8px;display:none"></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="k" style="margin-bottom:6px">…o traerla directamente de otro dispositivo en tu red</div>
        <div class="d" style="margin-bottom:10px">Si tienes escucharrr corriendo en otro equipo de tu red, pon aquí su dirección y <b>trae su capa de usuario</b> sin pasar por fichero. Previsualiza primero para ver qué casará con esta biblioteca.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input id="syncpullurl" type="text" placeholder="http://192.168.1.50:7733" style="flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text)">
          <button id="syncpullprev">Previsualizar</button>
        </div>
        <div id="syncpullbox" style="margin-top:10px;display:none"></div>
        <div id="syncpullmsg" style="font-size:12.5px;margin-top:8px;display:none"></div>
      </div></div>
  </div></div>

  <div class="grp" data-cat="audio"><h2><span class="gi">${window.icon('zone',18)}</span> Audio — salida</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Zona de salida actual</div><div class="d">${esc(zoneName)}</div></div>
      <button id="chooseout">Elegir salida / zona…</button></div>
    <div class="row"><div class="lbl"><div class="k">Motor nativo (WASAPI)</div><div class="d">${nat.available?(nat.built?'disponible en este equipo':'no disponible en este equipo'):'no disponible en esta versión'}</div></div></div>
    <div class="row"><div class="lbl"><div class="k">ffmpeg</div><div class="d" id="ffmpegstat">comprobando…</div></div></div>
    <div class="row"><div class="lbl"><div class="k">Salida de red (UPnP/DLNA, p. ej. Eversolo)</div><div class="d">descubre dispositivos de tu red y les envía la música; elígelo en «Elegir salida / zona»</div></div>
      <button id="chooseout2">Elegir salida…</button></div>
  </div></div>

  <div class="grp" data-cat="remoto"><h2><span class="gi">${window.icon('zonegroup',18)}</span> Otras pantallas</h2><div class="body">
    <div class="row" style="display:block"><div class="k" style="margin-bottom:4px">Abrir escucharrr en otro dispositivo</div>
      <div class="d" style="margin-bottom:10px">Este equipo es el <b>núcleo</b>: tiene tu biblioteca y tus ficheros. Desde el móvil, el portátil o la tele (en la misma Wi-Fi) abre una de estas direcciones en el navegador y tendrás la app entera, reproduciendo <b>en streaming</b> desde aquí. Mantén este equipo encendido.</div>
      <div id="netlist" class="d">cargando…</div>
      <div id="netmsg" style="font-size:12.5px;margin-top:8px;color:var(--text-2)"></div>
    </div>
    <div class="row" style="display:block"><div class="k" style="margin-bottom:4px">Fuera de casa</div>
      <div class="d">Para usarlo desde fuera de tu red, instala <b>Tailscale</b> (o WireGuard) en este equipo y en el dispositivo: te da una IP privada <span class="mono">100.x.x.x</span> que funciona esté donde esté, sin abrir puertos. Esa dirección aparece arriba marcada como «Tailscale» cuando está activa. <b>No reenvíes el puerto a internet abierto</b> (la app no pide contraseña); Tailscale lo mantiene dentro de tu red privada.</div>
    </div>
  </div></div>

  <div class="grp" data-cat="reproduccion"><h2><span class="gi">${window.icon('play',18)}</span> Reproducción</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Reproducción en segundo plano</div><div class="d">sigue sonando con la pantalla apagada o la app minimizada (imprescindible en iPhone). A cambio desactiva visualizador, ecualizador, crossfade y zonas, que dependen de Web Audio. Al cambiarlo se recarga la página.</div></div>
      <label class="sw"><input type="checkbox" id="bgplay" ${bg?'checked':''}><span class="t"></span></label></div>
    <div class="row"><div class="lbl"><div class="k">Crossfade</div><div class="d">solapa el final de una pista con el inicio de la siguiente</div></div>
      <input id="xf" type="range" min="0" max="12" step="0.5" value="${S.xfade}" style="width:160px"><span class="val" id="xfval"></span></div>
    <div class="row"><div class="lbl"><div class="k">Normalización de volumen (ReplayGain)</div><div class="d">por pista (−18 LUFS) · por álbum (conserva la dinámica del disco) · desactivada</div></div>${rgSeg()}</div>
    <div class="row"><div class="lbl"><div class="k">Radio / autoplay</div><div class="d">extiende la cola automáticamente al terminar</div></div>
      <label class="sw"><input type="checkbox" id="radio" ${S.radio?'checked':''}><span class="t"></span></label></div>
  </div></div>

  <div class="grp" data-cat="dsp"><h2><span class="gi">${window.icon('eq',18)}</span> Ecualizador</h2><div class="body">
    <div class="row"><div class="lbl"><div class="k">Ecualizador de 7 bandas</div><div class="d">se aplica a la salida del navegador y, si está activo, al motor nativo</div></div>
      <label class="sw"><input type="checkbox" id="eqon" ${S.eqOn?'checked':''}><span class="t"></span></label></div>
    <div class="row"><div class="lbl"><div class="k">Corrección por auriculares</div><div class="d">curva orientativa hacia un timbre neutro para modelos conocidos (Audeze, Sennheiser…). Ajusta las bandas a tu gusto después.</div></div>
      <select id="hpsel"><option value="">— elige modelo —</option></select></div>
    <div class="row" style="display:block"><div class="pre" id="pre">${presets}</div>
      <div class="eqbands" id="eqbands">${bands}</div></div>

  (function categorize() {
    const cats = [
      ['general', 'Interfaz', 'theme-auto'],
      ['biblioteca', 'Biblioteca', 'library'],
      ['audio', 'Audio', 'zone'],
      ['remoto', 'Otras pantallas', 'zonegroup'],
      ['reproduccion', 'Reproducción', 'play'],
      ['dsp', 'Ecualizador', 'eq'],
      ['servicios', 'Servicios', 'refresh'],
      ['backups', 'Copias de seguridad', 'backup'],
      ['about', 'Acerca de', 'settings'],
    ];
    const layout = document.createElement('div'); layout.className = 'setlayout';
    const nav = document.createElement('nav'); nav.className = 'setnav'; nav.setAttribute('aria-label', 'Secciones de configuración');
    const panel = document.createElement('div'); panel.className = 'setpanel';
    layout.appendChild(nav); layout.appendChild(panel);
    for (const [cat, label, icon] of cats) {
      const grp = app.querySelector('.grp[data-cat="' + cat + '"]');
      if (grp) panel.appendChild(grp);                    // mueve cada grupo al panel en el orden de categoría
      const b = document.createElement('button'); b.type = 'button'; b.dataset.cat = cat;
      b.innerHTML = '<span class="ni">' + window.icon(icon, 18) + '</span>' + esc(label);
      nav.appendChild(b);
    }
    app.innerHTML = ''; app.appendChild(layout);
    function activate(cat) {
      if (!cats.some(c => c[0] === cat)) cat = cats[0][0];
      nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
      panel.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', g.dataset.cat === cat));
      try { localStorage.setItem('set.cat', cat); } catch (e) {}
      if (location.hash.slice(1) !== cat) { try { history.replaceState(null, '', '#' + cat); } catch (e) {} }
    }
    nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) activate(b.dataset.cat); });
    let start = location.hash.slice(1); if (!start) { try { start = localStorage.getItem('set.cat') || ''; } catch (e) {} }
    activate(start || cats[0][0]);
  })();

    ['AKG K701', [4,2,0,0,1,-1,-1]], ['Grado SR80', [3,2,0,0,0,-2,-2]],
    ['Sony WH-1000XM', [-3,-2,0,1,1,1,0]], ['Apple AirPods Max', [-1,0,0,0,1,1,0]],

  function wireServices(s) {

      box.innerHTML = items.map(it => {
        const label = (it.real_dir || it.dir || '').split(/[\\/]/).filter(Boolean).pop() || it.dir;
        return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border)"><span style="flex:1;min-width:0;word-break:break-all">${esc(label)}${it.title ? ` <span style="color:var(--muted)">· ${esc(it.title)}</span>` : ''}</span><button class="rcoprestore" data-dir="${esc(it.dir)}" style="flex:none">Restaurar</button></div>`;
      }).join('');
    }).catch(() => { box.textContent = 'No se pudo cargar.'; });
  }
  loadRemovedCopies();
  document.getElementById('rcopremlist').addEventListener('click', async e => {
    const b = e.target.closest('.rcoprestore'); if (!b) return;
    b.disabled = true; b.textContent = '…';
    try {
      const r = await fetch('/api/album/restore-copy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dir: b.dataset.dir }) }).then(x => x.json());
      if (r.ok) { loadRemovedCopies(); loadRedundantCopies(); } else { b.disabled = false; b.textContent = 'Restaurar'; alert('No se pudo: ' + (r.error || '')); }
    } catch (e2) { b.disabled = false; b.textContent = 'Restaurar'; alert('No se pudo contactar con el servidor.'); }
  });
  document.getElementById('rcoprestoreall').addEventListener('click', async e => {
    if (!confirm('¿Restaurar todas las copias quitadas? Reaparecerán en el próximo escaneo.')) return;
    const b = e.target; b.disabled = true; b.textContent = 'Restaurando…';
    try {
      const r = await fetch('/api/library/restore-all-copies', { method: 'POST' }).then(x => x.json());
      if (r.ok) { loadRemovedCopies(); loadRedundantCopies(); } else alert('No se pudo: ' + (r.error || ''));
    } catch (e2) { alert('No se pudo contactar con el servidor.'); }
    b.disabled = false; b.textContent = 'Restaurar todas';
  });
  // Otras pantallas (Modelo A): direcciones LAN/Tailscale por las que abrir esta instancia desde otro dispositivo.
  function loadNet() {
    const box = document.getElementById('netlist'), msg = document.getElementById('netmsg'); if (!box) return;
    fetch('/api/netinfo').then(r => r.json()).then(j => {
      const addrs = (j && j.addrs) || [];
      if (!addrs.length) { box.innerHTML = '<span style="color:var(--text-2)">No se detectó ninguna dirección de red. Conéctate a una Wi-Fi/LAN y, si hace falta, permite el puerto ' + (j.port || '') + ' en el cortafuegos.</span>'; return; }
      box.innerHTML = addrs.map(a => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)">
        <a href="${esc(a.url)}" target="_blank" rel="noopener" class="mono" style="flex:1;min-width:0;color:var(--accent);overflow:hidden;text-overflow:ellipsis">${esc(a.url)}</a>
        ${a.kind === 'tailscale' ? '<span style="flex:none;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:2px 8px">TAILSCALE</span>' : ''}
        <button class="netcopy" data-u="${esc(a.url)}" style="flex:none;padding:4px 10px;font-size:12px">Copiar</button></div>`).join('');
      if (msg) msg.textContent = 'Host: ' + (j.hostname || '?') + ' · puerto ' + (j.port || '?') + '. La primera vez, Windows puede pedir permitir el acceso de red.';
    }).catch(() => { box.textContent = 'No se pudo cargar.'; });
  }
  loadNet();
  document.getElementById('netlist').addEventListener('click', async e => {
    const b = e.target.closest('.netcopy'); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.u); b.textContent = '¡Copiado!'; setTimeout(() => { b.textContent = 'Copiar'; }, 1500); } catch (x) {}
  });
  document.getElementById('mergelist').addEventListener('click', async e => {
    const b = e.target.closest('.unmerge'); if (!b) return;
    if (!confirm('¿Deshacer esta fusión? Se restaurarán las entidades originales tal cual estaban.')) return;
    b.disabled = true; b.textContent = 'Deshaciendo…';
    try { const r = await fetch('/api/merge/undo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: parseInt(b.dataset.id, 10) }) }).then(x => x.json());
      if (r.ok) loadMerges(); else { b.disabled = false; b.textContent = 'Deshacer'; alert('No se pudo deshacer: ' + (r.error || '')); }
    } catch (e2) { b.disabled = false; b.textContent = 'Deshacer'; alert('No se pudo contactar con el servidor.'); }
  });
  // Sync (Modelo A): exportar/importar la capa de usuario (reanclada por MBID/clave), con vista previa.
  document.getElementById('syncexport').addEventListener('click', () => { location.href = '/api/sync/export'; });
  (function () {
    const fi = document.getElementById('syncfile'), box = document.getElementById('syncbox'), msg = document.getElementById('syncmsg');
    let parsed = null;
    const sm = (t, ok) => { msg.style.display = 'block'; msg.style.color = ok ? 'var(--accent)' : '#c0392b'; msg.textContent = t; };
    fi.addEventListener('change', async () => {
      const f = fi.files && fi.files[0]; if (!f) return;
      msg.style.display = 'none'; box.style.display = 'none'; parsed = null;
      let text; try { text = await f.text(); parsed = JSON.parse(text); } catch (e) { sm('No se pudo leer el fichero (¿es un JSON válido?).', false); return; }
      if (!parsed || parsed.format !== 'escucharrr-user-layer') { sm('Ese fichero no es un export de capa de usuario de escucharrr.', false); return; }
      let pv; try { pv = await fetch('/api/sync/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: parsed }) }).then(r => r.json()); } catch (e) { sm('No se pudo contactar con el servidor.', false); return; }
      if (!pv.ok) { sm(pv.error || 'Error.', false); return; }
      const rows = Object.keys(pv.match).map(k => `<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0"><span>${esc(k)}</span><span style="color:var(--text-2)">${pv.match[k] || 0} casan${pv.miss[k] ? ` · <span style="color:#c0392b">${pv.miss[k]} sin casar</span>` : ''}</span></div>`).join('');
      box.style.display = 'block';
      box.innerHTML = `<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px">
        <div style="font-weight:600;margin-bottom:6px">Vista previa — qué casa con esta biblioteca</div>
        <div style="font-size:12.5px;line-height:1.5">${rows || 'Nada que importar.'}</div>
        <div style="margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px"><input type="radio" name="syncmode" value="fill" checked> Rellenar (no pisa lo que ya tienes)</label>
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px"><input type="radio" name="syncmode" value="overwrite"> Sobrescribir (la importación gana)</label>
          <button id="syncgo" class="btn-accent" style="padding:7px 14px">Importar</button>
        </div></div>`;
      document.getElementById('syncgo').onclick = async () => {
        const mode = (box.querySelector('input[name=syncmode]:checked') || {}).value || 'fill';
        const b = document.getElementById('syncgo'); b.disabled = true; b.textContent = 'Importando…';
        try { const r = await fetch('/api/sync/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: parsed, mode }) }).then(x => x.json());
          if (r.ok) { const ap = Object.entries(r.applied || {}).map(([k, v]) => k + ' ' + v).join(', ') || 'nada'; const sk = Object.values(r.skipped || {}).reduce((s, v) => s + v, 0); sm('Importado (' + r.mode + '): ' + ap + (sk ? ('. Saltadas ' + sk + ' (no casaban o ya existían).') : '.'), true); box.style.display = 'none'; fi.value = ''; }
          else { sm(r.error || 'No se pudo importar.', false); b.disabled = false; b.textContent = 'Importar'; }
        } catch (e) { sm('No se pudo contactar con el servidor.', false); b.disabled = false; b.textContent = 'Importar'; }
      };
    });
  })();
  // Sync fase 2: traer la capa de usuario de otra instancia por la red (previsualizar → elegir modo → traer).
  (function () {
    const urlI = document.getElementById('syncpullurl'), prevBtn = document.getElementById('syncpullprev');
    const box = document.getElementById('syncpullbox'), msg = document.getElementById('syncpullmsg');
    if (!prevBtn) return;
    const pm = (t, ok) => { msg.style.display = 'block'; msg.style.color = ok ? 'var(--accent)' : '#c0392b'; msg.textContent = t; };
    prevBtn.addEventListener('click', async () => {
      const url = (urlI.value || '').trim(); box.style.display = 'none'; msg.style.display = 'none';
      if (!url) { pm('Pon la dirección del otro dispositivo (p. ej. http://192.168.1.50:7733).', false); return; }
      prevBtn.disabled = true; prevBtn.textContent = 'Conectando…';
      let pv; try { pv = await fetch('/api/sync/pull-preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) }).then(r => r.json()); }
      catch (e) { pm('No se pudo contactar con el servidor.', false); prevBtn.disabled = false; prevBtn.textContent = 'Previsualizar'; return; }
      prevBtn.disabled = false; prevBtn.textContent = 'Previsualizar';
      if (!pv.ok) { pm(pv.error || 'No se pudo traer.', false); return; }
      const rowsHtml = Object.keys(pv.match || {}).map(k => { const m = pv.match[k] || 0, x = (pv.miss || {})[k] || 0; return '<div>' + k + ': <b>' + m + '</b> casan' + (x ? (' · ' + x + ' no') : '') + '</div>'; }).join('');
      box.style.display = 'block';
      box.innerHTML = `<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px">
        <div style="font-size:12.5px;margin-bottom:8px">De <b>${esc(pv.source || url)}</b> (generado ${pv.generated_at ? new Date(pv.generated_at).toLocaleString() : '—'}):</div>
        <div style="font-size:12.5px;line-height:1.6;margin-bottom:10px">${rowsHtml || 'Nada que traer.'}</div>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px"><input type="radio" name="pullmode" value="fill" checked> Rellenar (no pisa lo tuyo)</label>
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px"><input type="radio" name="pullmode" value="overwrite"> Sobrescribir (lo traído gana)</label>
          <button id="syncpullgo" class="btn-accent" style="padding:7px 14px">Traer ahora</button>
        </div></div>`;
      document.getElementById('syncpullgo').onclick = async () => {
        const mode = (box.querySelector('input[name=pullmode]:checked') || {}).value || 'fill';
        const b = document.getElementById('syncpullgo'); b.disabled = true; b.textContent = 'Trayendo…';
        try { const r = await fetch('/api/sync/pull', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, mode }) }).then(x => x.json());
          if (r.ok) { const ap = Object.entries(r.applied || {}).map(([k, v]) => k + ' ' + v).join(', ') || 'nada'; const sk = Object.values(r.skipped || {}).reduce((s, v) => s + v, 0); pm('Traído (' + r.mode + '): ' + ap + (sk ? ('. Saltadas ' + sk + ' (no casaban o ya existían).') : '.'), true); box.style.display = 'none'; }
          else { pm(r.error || 'No se pudo traer.', false); b.disabled = false; b.textContent = 'Traer ahora'; }
        } catch (e) { pm('No se pudo contactar con el servidor.', false); b.disabled = false; b.textContent = 'Traer ahora'; }
      };
    });
  })();
  document.getElementById('bknow').addEventListener('click', async () => { const b = document.getElementById('bknow'); b.disabled = true; b.textContent = 'Creando…'; try { const r = await fetch('/api/backup/now', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(x => x.json()); if (r.ok) { BACKUPS = r.backups || []; renderBackups(); bkMsg('Copia creada: ' + fmtBk(r.file), true); } else bkMsg('No se pudo crear: ' + (r.error || ''), false); } catch (e) { bkMsg('No se pudo contactar con el servidor.', false); } b.disabled = false; b.textContent = 'Crear copia'; });
  document.getElementById('bklist').addEventListener('click', async e => {
    const rb = e.target.closest('.bkrestore');
    if (rb) { if (!confirm('¿Restaurar esta copia? Se reemplazará tu biblioteca actual (se guarda una copia de seguridad del estado actual antes de restaurar).')) return; rb.disabled = true; rb.textContent = 'Restaurando…'; try { const r = await fetch('/api/backup/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: rb.dataset.f }) }).then(x => x.json()); if (r.ok) { BACKUPS = r.backups || []; renderBackups(); bkMsg('Restaurado. La biblioteca se ha recargado.', true); } else bkMsg('No se pudo restaurar: ' + (r.error || ''), false); } catch (e2) { bkMsg('No se pudo contactar con el servidor.', false); } return; }
    const db = e.target.closest('.bkdel');
    if (db) { if (!confirm('¿Borrar esta copia?')) return; try { const r = await fetch('/api/backup/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: db.dataset.f }) }).then(x => x.json()); if (r.ok) { BACKUPS = r.backups || []; renderBackups(); } } catch (e2) {} }
  });
});
</script>
</body>
</html>
