<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>escucharrr — compositores</title>
<link rel="stylesheet" href="styles.css">
<style>
.crow{display:flex;align-items:baseline;gap:12px;padding:10px 8px;margin:0 -8px;border-radius:9px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.crow:hover{background:var(--surface-2)}
.crow .ar{flex:none;width:14px;color:var(--muted)}
.crow .nm{flex:1;min-width:0;font-size:15px}
.crow .ct{flex:none;color:var(--text-2);font-size:12.5px}
.cbody{display:none;padding:2px 0 10px 22px;border-bottom:1px solid var(--border)}
.cbody.on{display:block}
.wk{padding:6px 0;border-bottom:1px solid var(--border)}
.wk:last-child{border-bottom:none}
.wk .wt{font-size:14px}
.wk .wtype{color:var(--muted);font-size:12px;margin-left:8px}
.wk .albs{margin-top:3px;font-size:12.5px;color:var(--text-2)}
.wk .albs a{color:var(--accent);text-decoration:none}
.wk .albs a:hover{text-decoration:underline}
.empty{color:var(--text-2);margin-top:20px;line-height:1.6}
.perfhdr{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 7px}
.perfchips{display:flex;flex-wrap:wrap;gap:7px}
.pchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:4px 10px;border-radius:999px;text-decoration:none}
.pchip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pchip .pn{color:var(--muted);font-variant-numeric:tabular-nums}
.pchip:hover .pn{color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>Compositores</h1>
  <div class="count" id="count">cargando…</div>
  <div class="search" style="max-width:460px"><input id="q" type="search" placeholder="Filtrar compositores…" autocomplete="off"></div>
  <div id="list"></div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let COMP=[]; const CACHE={};
function render(f){f=(f||'').toLowerCase().trim();
  const l=f?COMP.filter(c=>(c.name||'').toLowerCase().includes(f)):COMP;
  document.getElementById('count').textContent=l.length+' compositor'+(l.length===1?'':'es')+(f?(' de '+COMP.length):'');
  const list=document.getElementById('list');
  if(!COMP.length){list.innerHTML='<div class="empty">Aún no hay compositores en tu biblioteca. Aparecen aquí cuando los metadatos de tus ficheros acreditan la composición de las obras.</div>';return;}
  list.innerHTML=l.map(c=>`<div class="crow" data-id="${c.id}"><span class="ar">▸</span><span class="nm">${esc(c.name)}</span><span class="ct">${c.nworks} obra${c.nworks===1?'':'s'}${c.nalbums?(' · '+c.nalbums+' álbum'+(c.nalbums===1?'':'es')):''}</span></div><div class="cbody" id="cb-${c.id}"></div>`).join('');
}
async function toggle(id){
  const body=document.getElementById('cb-'+id), row=document.querySelector('.crow[data-id="'+id+'"]'), arr=row.querySelector('.ar');
  const open=body.classList.contains('on');
  if(open){body.classList.remove('on');arr.textContent='▸';return;}
  arr.textContent='▾'; body.classList.add('on');
  if(!CACHE[id]){ body.innerHTML='<div style="color:var(--muted);padding:6px 0">cargando…</div>';
    try{ CACHE[id]=await fetch('/api/composer?id='+id).then(r=>r.json()); }catch(e){ body.innerHTML='<div style="color:var(--muted)">no se pudo cargar</div>'; return; } }
  const d=CACHE[id];
  const worksHtml=(d.works||[]).map(w=>`<div class="wk"><span class="wt">${esc(w.title)}</span>${w.type?`<span class="wtype">${esc(w.type)}</span>`:''}${(w.albums&&w.albums.length)?`<div class="albs">${w.albums.map(a=>`<a href="album.html?id=${a.id}">${esc(a.title)}</a>`).join(' · ')}</div>`:''}</div>`).join('')||'<div style="color:var(--muted);padding:6px 0">sin obras</div>';
  // Intérpretes de su música (Roon: performing music of): quién toca sus obras, enlazando a su ficha.
  const perf=d.performers||[];
  const perfHtml=perf.length?`<div class="perfhdr">Interpretan su música</div><div class="perfchips">${perf.map(p=>`<a class="pchip" href="artist.html?id=${p.id}">${esc(p.name)}<span class="pn">${p.nrec}</span></a>`).join('')}</div>`:'';
  body.innerHTML=worksHtml+perfHtml;
}
fetch('/api/composers').then(r=>r.json()).then(j=>{COMP=j.items||[];render();}).catch(e=>document.getElementById('count').textContent='error: '+e.message);
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
document.getElementById('list').addEventListener('click',e=>{const r=e.target.closest('.crow');if(r&&r.dataset.id)toggle(+r.dataset.id);});
</script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script src="player.js" defer></script>
</body>
</html>
