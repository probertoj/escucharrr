<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — álbum</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:14px"><a href="/" style="color:var(--accent);display:inline-flex;align-items:center;gap:5px"><span data-icon="arrow-left" data-s="15"></span>Biblioteca</a></div>
  <div id="app">cargando…</div>
</div>

<script>
const TC={excel:['#0F6E56','#E1F5EE'],si:['#639922','#EAF3DE'],ok:['#BA7517','#FAEEDA'],meh:['#5F5E5A','#F1EFE8'],no:['#A32D2D','#FCEBEB']};
const TN={excel:'Excel',si:'Sí',ok:'Ok',meh:'Meh',no:'No'};
const PAIRS=[['#0F6E56','#1D9E75'],['#534AB7','#7F77DD'],['#185FA5','#378ADD'],['#854F0B','#BA7517'],['#72243E','#D4537E'],['#5F5E5A','#888780'],['#3B6D11','#639922'],['#993C1D','#D85A30']];
function cover(id){return `<img src="/api/cover?rg=${id}" alt="" loading="lazy" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block">`;}
const mmss=ms=>ms?`${Math.floor(ms/60000)}:${String(Math.round(ms%60000/1000)).padStart(2,'0')}`:'';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const id=+new URLSearchParams(location.search).get('id');
const TORD=['excel','si','ok','meh','no'];
let rawAbout='';   // markdown crudo de la reseña EDITABLE (tuya/Obsidian) para el editor
let reviews=[], reviewIdx=0;   // todas las fuentes de reseña + la seleccionada (selector estilo Roon)
let albumTracks=[];   // pistas del álbum (para "reproducir disco")
const mdRender=s=>window.mdToHtml?window.mdToHtml(s):esc(s);
const provRefOf=ref=>!ref?'':(/^https?:/.test(ref)?' · <a href="'+esc(ref)+'" target="_blank" rel="noopener" style="color:var(--text-2)">'+esc(ref.replace(/^https?:\/\/(www\.)?/,''))+'</a>':' · '+esc(ref));
function showReview(i){const r=reviews[i];if(!r)return;reviewIdx=i;
  const at=document.querySelector('#app .abouttext');if(at)at.innerHTML=mdRender(r.text);
  const pv=document.getElementById('aboutprov');if(pv)pv.innerHTML='desde '+esc(r.source)+provRefOf(r.ref);
  document.querySelectorAll('#app .revsrc').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  applyCollapse();}
// Plega las reseñas largas (estilo Roon toggle_review): si el texto supera cierta altura,
// se muestra recortado con un degradado y un "Ver más".
function applyCollapse(){const box=document.getElementById('aboutbox');if(!box)return;const at=box.querySelector('.abouttext'),tog=box.querySelector('.revtoggle');if(!at||!tog)return;
  box.classList.remove('collapsed');tog.hidden=true;
  if(at.scrollHeight>280){box.classList.add('collapsed');tog.hidden=false;tog.textContent='Ver más';}}
function renderAlbum(a){
  if(!a||!a.id){app.innerHTML='No encontrado';return;}
  window.ALB=a;
  const tier=`<span class="tiered" style="display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center">${TORD.map(k=>`<span class="tchip" data-tier="${k}" title="${TN[k]}" style="cursor:pointer;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${a.tier_key===k?TC[k][0]:'var(--surface-2)'};color:${a.tier_key===k?TC[k][1]:'var(--text-2)'}">${TN[k]}</span>`).join('')}${a.tier_key?`<span class="tchip" data-tier="" title="Quitar tier" style="cursor:pointer;color:var(--text-2);padding:2px 6px">${window.icon('close',13)}</span>`:''}</span>`;
  const sv=a.album_stars?Math.round(+a.album_stars):0;
  const stars=`<span class="starsed" style="display:inline-flex;align-items:center;gap:1px">${[1,2,3,4,5].map(n=>`<span class="st" data-stars="${n}" title="Valorar ${n}" style="cursor:pointer;color:${n<=sv?'var(--accent)':'var(--muted)'};font-size:17px;line-height:1">★</span>`).join('')}${sv?`<span class="st" data-stars="0" title="Quitar valoración" style="cursor:pointer;color:var(--text-2);font-size:12px;margin-left:4px;display:inline-flex">${window.icon('close',12)}</span>`:''}</span>`;
  const favEd=`<span class="faved" data-fav="${a.is_favorite?0:1}" title="${a.is_favorite?'Quitar de favoritos':'Marcar como favorito'}" style="cursor:pointer;color:${a.is_favorite?'var(--accent)':'var(--text-2)'};font-size:18px;line-height:1">♥</span>`;
  const llEd=`<span class="llater" data-ll="${a.listen_later?0:1}" title="${a.listen_later?'Quitar de escuchar más tarde':'Escuchar más tarde'}" style="cursor:pointer;color:${a.listen_later?'var(--accent)':'var(--text-2)'};display:inline-flex;align-items:center;gap:4px;font-size:13px">${window.icon('lists',15)}${a.listen_later?'En «más tarde»':'Más tarde'}</span>`;
  const hideEd=`<span class="hided" data-hide="${a.hidden?0:1}" title="${a.hidden?'Volver a mostrar en la biblioteca':'Ocultar de la biblioteca (no se borra)'}" style="cursor:pointer;color:${a.hidden?'var(--accent)':'var(--text-2)'};display:inline-flex;align-items:center;gap:4px;font-size:13px">${window.icon(a.hidden?'check':'close',14)}${a.hidden?'Oculto':'Ocultar'}</span>`;
  const genres=(a.genres||[]).map(g=>`<a class="gchip" href="genre.html?name=${encodeURIComponent(g)}">${esc(g)}</a>`).join(' ');
  const artistLink=a.artist_id?`<a href="artist.html?id=${a.artist_id}" style="color:var(--accent)">${esc(a.artist)}</a>`:esc(a.artist);
  const provRef=s=>!s||!s.source_ref?'':(/^https?:/.test(s.source_ref)?` · <a href="${esc(s.source_ref)}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(s.source_ref.replace(/^https?:\/\/(www\.)?/,''))}</a>`:' · '+esc(s.source_ref));
  reviews=a.reviews||[]; reviewIdx=0;
  const editable=reviews.find(r=>r.editable); rawAbout=editable?editable.text:'';   // editar SIEMPRE la tuya
  const sel0=reviews[0];
  const srcSel=reviews.length>1?`<span class="revsrcs">${reviews.map((r,i)=>`<span class="revsrc${i===0?' on':''}" data-i="${i}">${esc(r.label)}</span>`).join('')}</span>`:'';
  const prov0=sel0?('desde '+esc(sel0.source)+provRefOf(sel0.ref)):'';
  const about=`<div class="about" id="aboutbox"><div class="prov" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${srcSel}<span id="aboutprov" style="color:var(--text-2)">${prov0}</span></span><span class="aboutedit" style="cursor:pointer;color:var(--accent);font-size:12px;white-space:nowrap">${rawAbout?'editar reseña':'añadir reseña'}</span></div><div class="abouttext">${sel0?mdRender(sel0.text):'<span style="color:var(--text-2)">Sin reseña. Escribe la tuya — tus datos mandan.</span>'}</div><div class="revtoggle" hidden></div></div>`;
  const editions=(a.editions||[]).map(e=>`${esc(e.format||'?')}${e.date?' · '+esc(e.date):''}${e.country?' · '+esc(e.country):''}`).join(' &nbsp;·&nbsp; ');
  const edLabel=(a.editions||[]).map(e=>e.label).find(Boolean)||null;       // sello discográfico (MusicBrainz)
  const edCountry=(a.editions||[]).map(e=>e.country).find(Boolean)||null;   // país de edición
  const edBarcode=(a.editions||[]).map(e=>e.barcode).find(Boolean)||null;   // código de barras (EAN/UPC)
  albumTracks=a.tracks||[];
  const multiDisc=(a.tracks||[]).some(t=>t.disc>1);
  const trackRow=(t,i)=>`<div class="track"><button class="play" data-idx="${i}" aria-label="Reproducir" title="Reproducir" style="border:none;background:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0 4px;display:inline-flex;align-items:center">${window.icon('play',14)}</button><span class="pos">${t.pos}</span><span style="flex:1;min-width:0">${esc(t.title)}${(t.artist&&a.artist&&t.artist!==a.artist)?`<div style="font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.artist_id?`<a href="artist.html?id=${t.artist_id}" style="color:var(--text-2)">${esc(t.artist)}</a>`:esc(t.artist)}</div>`:''}${(t.work||t.composers)?`<div style="font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.work_id?`<a href="work.html?id=${t.work_id}" style="color:var(--text-2)">${esc(t.work||'obra')}</a>`:esc(t.work||'')}${t.composers?` · ${esc(t.composers.replace(/,/g,', '))}`:''}</div>`:''}</span><span class="addtrk" data-tid="${t.trackId}" title="Añadir a una lista" style="cursor:pointer;color:var(--text-2);font-size:14px;padding:0 6px;display:inline-flex;align-items:center">${window.icon('plus',15)}</span><span class="dur">${mmss(t.length_ms)}</span></div>`;
  let tracks='';
  if((a.tracks||[]).length){ tracks='<div class="sec">Pistas</div>'; let cur=null;
    a.tracks.forEach((t,i)=>{ if(multiDisc && t.disc!==cur){ cur=t.disc; tracks+=`<div class="dischdr"><span class="dh">${window.icon('music',14)} Disco ${t.disc}</span><button class="playdisc" data-disc="${t.disc}" title="Reproducir este disco">${window.icon('play',12)} Reproducir disco</button></div>`; } tracks+=trackRow(t,i); }); }
  const INST={'bass':'bajo','electric bass':'bajo eléctrico','double bass':'contrabajo','guitar':'guitarra','acoustic guitar':'guitarra acústica','electric guitar':'guitarra eléctrica','drums':'batería','percussion':'percusión','piano':'piano','keyboards':'teclados','synthesizer':'sintetizador','organ':'órgano','cello':'violonchelo','violin':'violín','viola':'viola','trumpet':'trompeta','trombone':'trombón','saxophone':'saxofón','flute':'flauta','clarinet':'clarinete','harmonica':'armónica','accordion':'acordeón','vibraphone':'vibráfono'};
  const tInst=i=>i?(INST[i.toLowerCase()]||i.toLowerCase()):i;
  const clabel=c=>c.role==='instrumento'&&c.instrument?tInst(c.instrument):(c.role==='voz'&&c.instrument?'voz ('+tInst(c.instrument)+')':c.role);
  const credits=(a.credits||[]).length?`<div class="sec">Créditos</div><div class="credits">`+a.credits.map(c=>`<div class="c"><div class="role">${esc(clabel(c))}</div>${c.artists.map(esc).join(', ')}</div>`).join('')+`</div>`:'';
  // otras ediciones del mismo álbum en la biblioteca (deluxe/remaster/año/país…), estilo Roon
  const versions=(a.versions||[]).length?`<div class="sec">Otras versiones <span style="color:var(--muted);font-size:14px;font-weight:400;font-family:var(--sans)">${a.versions.length}</span></div><div class="versions">`+a.versions.map(v=>`<a class="verrow" href="album.html?id=${v.id}"><span class="vt">${esc(v.title)}</span><span class="vm">${[v.format,v.year].filter(Boolean).map(esc).join(' · ')}</span></a>`).join('')+`</div>`:'';
  // Más del artista (profundizar en su discografía) y artistas afines de tu biblioteca (profundizar en sonidos), estilo Roon.
  const artNm=esc(a.artist||'');
  const moreBy=(a.more_albums||[]).length?`<div class="sec">Más de ${a.artist_id?`<a href="artist.html?id=${a.artist_id}" style="color:inherit;text-decoration:none">${artNm}</a>`:artNm}</div><div class="shelf">`+a.more_albums.map(al=>`<a class="shcard" href="album.html?id=${al.id}" title="${esc(al.title)}"><div class="cv"><img src="/api/cover?rg=${al.id}" alt="" loading="lazy"></div><div class="nm">${esc(al.title)}</div><div class="yr">${al.year||''}</div></a>`).join('')+`</div>`:'';
  app.innerHTML=`
    <div class="hero">
      <div style="flex:none"><div class="cov"><img src="/api/cover?rg=${a.id}&p=${encodeURIComponent(a.cover_pref||'auto')}" alt="" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block"></div><div class="coverpref">${[['auto','Auto'],['file','Archivo'],['download','Descargada'],['none','Ninguna']].map(([v,l])=>`<span class="cpref${(a.cover_pref||'auto')===v?' on':''}" data-v="${v}" title="Fuente de la portada">${l}</span>`).join('')}</div></div>
      <div style="flex:1;min-width:240px">
        <div style="color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(a.primary_type||'álbum')} · ${a.year||'—'}${a.mbid_source==='liderarrr'?`<span title="MBID importado de Liderarrr (identificación de MusicBrainz ya hecha allí)" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:2px 9px">${window.icon('check',12)}identificado vía Liderarrr</span>`:''}</div>
        <h1 style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(a.title)}<button class="titleedit" title="Editar el título del álbum" aria-label="Editar título" style="flex:none;background:none;border:none;color:var(--text-2);cursor:pointer;padding:3px;display:inline-flex;align-items:center">${window.icon('edit',17)}</button></h1>
        ${(a.orig_title&&a.orig_title!==a.title)?`<div style="font-size:12px;color:var(--text-2);margin-top:-4px;margin-bottom:2px">Original: ${esc(a.orig_title)} · <a href="#" class="titlerevert" style="color:var(--accent)">revertir</a></div>`:''}
        <div style="font-size:15px">${artistLink}</div>
        ${(a.tracks||[]).length?`<div class="actions"><button class="btn-accent" id="playalbum" style="display:inline-flex;align-items:center;gap:6px">${window.icon('play',15)}Reproducir</button><button class="iconbtn" id="radioalbum" title="Radio: reproduce y extiende con pistas afines de tu biblioteca">${window.icon('radio',17)}</button><button class="iconbtn" id="mixalbum" title="Mezcla: una lista afín a este álbum">${window.icon('music',17)}</button><button class="iconbtn" id="queuealbum" title="Añadir a la cola">${window.icon('queue',17)}</button><button class="iconbtn" id="nextalbum" title="Reproducir a continuación">${window.icon('next',17)}</button><button class="iconbtn" id="addalbum" title="Añadir a una lista">${window.icon('plus',17)}</button><button class="iconbtn" id="identifyalbum" title="${a.mbid?'Ya identificado con MusicBrainz — reidentificar':'Identificar con MusicBrainz (por nº de pistas y duraciones)'}">${window.icon(a.mbid?'check':'search',17)}</button>${a.has_audio?`<button class="iconbtn" id="reanalyzealbum" ${a.reanalyzing?'disabled':''} title="Recalcula el loudness/ReplayGain y la barra de onda de este álbum">${window.icon('refresh',17)}</button>`:''}<span id="retoslot"></span></div>`:''}
        <div class="meta">
          <span><span class="k">Tier</span> ${tier}</span>
          <span><span class="k">Valoración</span> ${stars}</span>
          <span><span class="k">Favorito</span> ${favEd}</span>
          <span>${llEd}</span>
          <span>${hideEd}</span>
          ${a.format?`<span><span class="k">Formato</span> ${esc(a.format)}</span>`:''}
          ${edLabel?`<span><span class="k">Sello</span> ${esc(edLabel)}</span>`:''}
          ${edCountry?`<span><span class="k">País</span> ${esc(edCountry)}</span>`:''}
          ${edBarcode?`<span><span class="k">Barcode</span> ${esc(edBarcode)}</span>`:''}
          ${editions?`<span><span class="k">Ediciones</span> ${editions}</span>`:''}
        </div>
        <div>${genres}</div>
        ${a.spotify_enabled?`<div style="margin-top:9px;font-size:13px">${a.spotify_saved?`<span style="color:#1DB954;font-weight:600">● En tu biblioteca de Spotify</span>${a.spotify_url?` · <a href="${esc(a.spotify_url)}" target="_blank" rel="noopener" style="color:var(--text-2)">abrir</a>`:''}`:'<span style="color:var(--text-2)">○ No está en tu biblioteca de Spotify</span>'}</div>`:''}
        <div id="tagbox" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div>
      </div>
    </div>
    ${about}
    ${tracks}
    ${versions}
    ${moreBy}
    <div id="similarslot"></div>
    ${credits}`;
  renderTags(a.tags||[]);
  applyCollapse();
  maybeRetoBtn();
  maybeSimilar();
}
// Artistas similares (vía Last.fm) — carga perezosa: no bloquea la ficha y degrada con elegancia.
const _inits=n=>{const s=String(n||'').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('');return (s||'?').slice(0,2).toUpperCase();};
async function maybeSimilar(){
  const slot=document.getElementById('similarslot'); const a=window.ALB; if(!slot||!a) return;
  let r; try{ r=await fetch('/api/album/similar?rg='+a.id).then(x=>x.json()); }catch(e){ return; }
  if(!r||!r.ok) return;
  const arts=(r.artists||[]);
  if(!arts.length){
    // Sin Last.fm no hay fuente fiable de afinidad (el género local es demasiado grueso). Nudge discreto.
    if(r.configured===false) slot.innerHTML=`<div class="sec">Artistas similares</div><div style="color:var(--text-2);font-size:13.5px;background:var(--surface-2);border-radius:11px;padding:12px 15px">Conecta <b>Last.fm</b> en <a href="settings.html" style="color:var(--accent)">Ajustes → Servicios</a> (solo una API key gratuita) para ver artistas afines y profundizar en sonidos parecidos.</div>`;
    return;
  }
  slot.innerHTML=`<div class="sec">Artistas similares</div><div class="shelf">`+arts.map(s=>{
    const av=`<div class="cv">${esc(_inits(s.name))}</div>`;
    const sub=s.owned?'en tu biblioteca':'descubrir';
    return s.owned
      ? `<a class="shcard art" href="artist.html?id=${s.id}" title="${esc(s.name)}">${av}<div class="nm">${esc(s.name)}</div><div class="yr">${sub}</div></a>`
      : `<a class="shcard art notown" href="search.html?q=${encodeURIComponent(s.name)}" title="Buscar ${esc(s.name)}">${av}<div class="nm">${esc(s.name)}</div><div class="yr">${sub}</div></a>`;
  }).join('')+`</div>`;
}
function load(){fetch('/api/album?id='+id).then(r=>r.json()).then(renderAlbum).catch(e=>app.innerHTML='error: '+e.message);}

// ── «Añadir a reto» (solo si Liderarrr está conectado) — tira de su API de retos ──
let LIDOK=null;   // null=sin comprobar, true/false=estado de conexión (cacheado)
// matchKey de Liderarrr (compacto) para marcar los retos que ya contienen este disco
const _nn=s=>String(s||'').normalize('NFD').toLowerCase().replace(/[^a-z0-9]+/g,'');
const _EDIT=/(deluxe|expanded|remaster|anniversary|edition|reissue|re-?master|mono|stereo|bonus|special|version|explicit|flac|mp3|vinyl|\d{2,3}\s*bit|\d{2,3}(\.\d)?\s*khz|hi-?res|24-?96|16-?44)/i;
function _ct(t){ t=String(t||'').trim(); for(;;){ const m=t.match(/[\[(]([^\])]*)[)\]]\s*$/); if(!m||(!/\d{4}/.test(m[1])&&!_EDIT.test(m[1]))) break; t=t.slice(0,m.index).trim(); } return _nn(t.replace(/\s+[-–—]\s*\d{4}\s*$/,'')); }
const _mk=(a,t)=>_nn(a)+'::'+_ct(t);
async function maybeRetoBtn(){
  const slot=document.getElementById('retoslot'); if(!slot) return;
  if(LIDOK===null){ try{ const s=await fetch('/api/config/services').then(r=>r.json()); LIDOK=!!(s.liderarrr&&s.liderarrr.connected); }catch(e){ LIDOK=false; } }
  if(!LIDOK){ slot.innerHTML=''; return; }
  slot.innerHTML=`<button class="iconbtn" id="retoalbum" title="Añadir este disco a un reto de escucha (Liderarrr)">${window.icon('challenge',17)}</button>`;
}
async function openReto(){
  const a=window.ALB; if(!a) return;
  let wrap=document.getElementById('retowiz');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='retowiz'; wrap.setAttribute('style','position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px'); document.body.appendChild(wrap); }
  wrap.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:440px;width:100%;max-height:80vh;overflow:auto;padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-weight:600;font-size:16px">Añadir a un reto</span><span id="retoclose" style="cursor:pointer;color:var(--text-2);display:inline-flex">${window.icon('close',18)}</span></div>
    <div style="font-size:13px;color:var(--text-2);margin-bottom:12px">${esc(a.artist||'')} — ${esc(a.title||'')}</div>
    <div id="retolist" style="font-size:14px">cargando retos…</div>
    <div id="retomsg" style="font-size:12.5px;margin-top:8px;display:none"></div></div>`;
  document.getElementById('retoclose').onclick=()=>wrap.remove();
  wrap.onclick=e=>{ if(e.target===wrap) wrap.remove(); };
  const mk=_mk(a.artist,a.title);
  let list=[],mem={};
  try{ [list,mem]=await Promise.all([fetch('/api/liderarrr/challenges').then(r=>r.json()), fetch('/api/liderarrr/challenges/membership').then(r=>r.json())]); }catch(e){}
  const box=document.getElementById('retolist');
  if(!Array.isArray(list)){ box.innerHTML='No se pudieron cargar los retos de Liderarrr.'; return; }
  const inIt=(mem&&mem[mk])||[];
  box.innerHTML=list.map(c=>{ const has=inIt.some(x=>x.id===c.id);
    return `<div class="retopick" data-id="${c.id}" data-has="${has?1:0}" style="display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--border);cursor:${has?'default':'pointer'}">
      <span style="width:18px;display:inline-flex;color:var(--accent)">${has?window.icon('check',16):''}</span>
      <span style="flex:1">${esc(c.name)} <span style="color:var(--muted);font-size:12px">· ${c.owned}/${c.item_count}</span></span>
      ${has?'<span style="font-size:11px;color:var(--accent)">ya está</span>':`<span style="font-size:12px;color:var(--text-2)">añadir</span>`}</div>`;
  }).join('') + `<div style="margin-top:10px"><input id="retonew" placeholder="…o crea un reto nuevo con este disco" style="width:100%"><div style="display:flex;justify-content:flex-end;margin-top:6px"><button id="retocreate" style="padding:6px 12px">Crear y añadir</button></div></div>`;
  const addTo=async (cid,el)=>{ const msg=document.getElementById('retomsg');
    try{ const r=await fetch('/api/liderarrr/challenges/'+cid+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:(a.artist||'')+' - '+(a.title||'')})}).then(x=>x.json());
      if(r&&r.added!=null){ if(el){ el.dataset.has='1'; el.style.cursor='default'; el.querySelector('span').innerHTML=window.icon('check',16); el.lastElementChild.outerHTML='<span style="font-size:11px;color:var(--accent)">añadido</span>'; } msg.style.display='block'; msg.style.color='var(--accent)'; msg.textContent='Añadido al reto.'; }
      else { msg.style.display='block'; msg.style.color='#c0392b'; msg.textContent=(r&&r.error)||'No se pudo añadir.'; }
    }catch(e){ msg.style.display='block'; msg.style.color='#c0392b'; msg.textContent='Error de red.'; } };
  box.querySelectorAll('.retopick').forEach(el=>{ if(el.dataset.has==='1') return; el.onclick=()=>addTo(el.dataset.id,el); });
  document.getElementById('retocreate').onclick=async ()=>{ const nm=(document.getElementById('retonew').value||'').trim(); if(!nm) return;
    const msg=document.getElementById('retomsg');
    try{ const r=await fetch('/api/liderarrr/challenges',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,text:(a.artist||'')+' - '+(a.title||'')})}).then(x=>x.json());
      if(r&&r.id){ msg.style.display='block'; msg.style.color='var(--accent)'; msg.textContent='Reto «'+nm+'» creado con este disco.'; setTimeout(openReto,700); }
      else { msg.style.display='block'; msg.style.color='#c0392b'; msg.textContent=(r&&r.error)||'No se pudo crear.'; }
    }catch(e){ msg.style.display='block'; msg.style.color='#c0392b'; msg.textContent='Error de red.'; } };
}
document.addEventListener('click',e=>{ if(e.target.closest('#retoalbum')){ openReto(); } });
load();
document.addEventListener('escucharrr:changed',load);   // biblioteca en vivo

// ── tags de usuario (etiquetas libres, estilo Roon) ──
function renderTags(tags){
  const box=document.getElementById('tagbox'); if(!box) return;
  box.innerHTML=(tags||[]).map(t=>`<span class="gchip" style="display:inline-flex;align-items:center;gap:5px"><a href="tag.html?name=${encodeURIComponent(t)}" style="color:inherit">${esc(t)}</a><span class="txtag" data-tag="${esc(t)}" title="Quitar etiqueta" style="cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center">${window.icon('close',13)}</span></span>`).join('')
    +`<span class="chip" id="addtag" style="cursor:pointer">${window.icon('plus',13)} etiqueta</span>`;
}
async function tagPost(path,name){ try{ const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({album_id:id,name})}).then(x=>x.json()); if(r&&r.ok) renderTags(r.tags||[]); }catch(e){} }
document.addEventListener('click',e=>{
  const add=e.target.closest('#addtag'); if(add){ const n=prompt('Etiqueta (p. ej. «domingo», «lluvia», «para el coche»):'); if(n&&n.trim()) tagPost('/api/tag/add', n.trim()); return; }
  const rm=e.target.closest('.txtag'); if(rm){ tagPost('/api/tag/remove', rm.dataset.tag); return; }
});

// ── edición/corrección de metadatos ("tus datos mandan": tu valor gana al externo) ──
function editField(field,value){ return fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_type:'release_group',subject_id:id,field,value})}).then(r=>r.json()); }
document.addEventListener('click',e=>{
  const tc=e.target.closest('#app .tchip'); if(tc){ editField('tier',tc.dataset.tier).then(r=>{ if(r.ok){toast(tc.dataset.tier?'Tier actualizado':'Tier quitado');load();}else toast(r.error||'error'); }); return; }
  const sc=e.target.closest('#app .st'); if(sc){ const v=+sc.dataset.stars; editField('stars',v).then(r=>{ if(r.ok){toast(v?'Valoración guardada':'Valoración quitada');load();}else toast(r.error||'error'); }); return; }
  const fc=e.target.closest('#app .faved'); if(fc){ const on=fc.dataset.fav==='1'; editField('favorite',on).then(r=>{ if(r.ok){toast(on?'Añadido a favoritos':'Quitado de favoritos');load();}else toast(r.error||'error'); }); return; }
  const ll=e.target.closest('#app .llater'); if(ll){ const on=ll.dataset.ll==='1'; editField('listen_later',on).then(r=>{ if(r.ok){toast(on?'En «escuchar más tarde»':'Quitado de «más tarde»');load();}else toast(r.error||'error'); }); return; }
  const hd=e.target.closest('#app .hided'); if(hd){ const on=hd.dataset.hide==='1'; editField('hidden',on).then(r=>{ if(r.ok){toast(on?'Álbum ocultado de la biblioteca':'Álbum visible de nuevo');load();}else toast(r.error||'error'); }); return; }
  const cp=e.target.closest('#app .cpref'); if(cp){ editField('cover_pref',cp.dataset.v).then(r=>{ if(r.ok){toast('Portada: '+cp.textContent);load();}else toast(r.error||'error'); }); return; }
  const rt=e.target.closest('#app .revtoggle'); if(rt){ const box=document.getElementById('aboutbox'); const col=box.classList.toggle('collapsed'); rt.textContent=col?'Ver más':'Ver menos'; return; }
  const rs=e.target.closest('#app .revsrc'); if(rs){ showReview(+rs.dataset.i); return; }
  const ae=e.target.closest('#app .aboutedit'); if(ae){ openAboutEditor(); return; }
  const te=e.target.closest('#app .titleedit'); if(te){ openTitleEditor(); return; }
  const tv=e.target.closest('#app .titlerevert'); if(tv){ e.preventDefault(); editField('title','').then(r=>{ if(r.ok){toast('Título restaurado');load();}else toast(r.error||'error'); }); return; }
});
function openTitleEditor(){
  const a=window.ALB; if(!a)return;
  if(document.getElementById('titledlg'))return;
  const ov=document.createElement('div'); ov.id='titledlg'; ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:120';
  ov.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:min(440px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.4)">
    <div style="font-weight:600;font-size:15px;margin-bottom:10px;display:inline-flex;align-items:center;gap:7px">${window.icon('edit',16)}Editar título del álbum</div>
    <input id="titlein" type="text" value="${esc(a.title||'')}" style="width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);box-sizing:border-box">
    <div style="font-size:12px;color:var(--text-2);margin-top:8px">No toca las etiquetas de tus ficheros ni el escaneo: solo cambia cómo se muestra y se empareja aquí.${(a.orig_title&&a.orig_title!==a.title)?` Original: <b style="color:var(--text)">${esc(a.orig_title)}</b>.`:''}</div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button id="titlecancel" style="padding:7px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text)">Cancelar</button>
      <button id="titlesave" class="btn-accent" style="padding:7px 16px">Guardar</button>
    </div></div>`;
  document.body.appendChild(ov);
  const inp=document.getElementById('titlein'); inp.focus(); inp.select();
  const close=()=>ov.remove();
  ov.addEventListener('click',ev=>{ if(ev.target===ov)close(); });
  const save=()=>{ const v=inp.value.trim(); if(!v){toast('El título no puede estar vacío');return;} editField('title',v).then(r=>{ if(r.ok){toast('Título actualizado');close();load();}else toast(r.error||'error'); }); };
  document.getElementById('titlecancel').onclick=close;
  document.getElementById('titlesave').onclick=save;
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();save();} else if(ev.key==='Escape'){ev.preventDefault();close();} });
}
function openAboutEditor(){
  const box=document.getElementById('aboutbox'); if(!box||box.querySelector('textarea'))return;
  const existing=rawAbout;   // el markdown original, no el texto ya renderizado
  const tx=document.createElement('div'); tx.style.marginTop='8px';
  tx.innerHTML=`<textarea id="aboutta" style="width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);box-sizing:border-box" placeholder="Markdown: # títulos, **negrita**, - listas…"></textarea><div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="aboutsave" class="btn-accent" style="padding:6px 14px">Guardar</button><button id="aboutobs" title="Escribe la reseña en el fichero .md del vault de Obsidian (conserva el frontmatter)" style="padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer">Guardar en Obsidian</button><button id="aboutcancel" style="padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer">Cancelar</button></div>`;
  box.appendChild(tx);
  const ta=document.getElementById('aboutta'); ta.value=existing; ta.focus();
  document.getElementById('aboutcancel').onclick=()=>tx.remove();
  document.getElementById('aboutsave').onclick=()=>{ const v=ta.value; editField('about',v).then(r=>{ if(r.ok){toast(v.trim()?'Reseña guardada':'Reseña quitada');load();}else toast(r.error||'error'); }); };
  document.getElementById('aboutobs').onclick=()=>{ const v=ta.value; if(!v.trim()){toast('Escribe algo primero');return;}
    fetch('/api/obsidian/write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_type:'release_group',subject_id:id,field:'about',value:v})}).then(r=>r.json()).then(r=>{ if(r.ok){toast((r.created?'Nota creada: ':'Guardado en ')+r.path);load();}else toast(r.error||'error'); }).catch(e=>toast('error: '+e.message)); };
}

// ── Wizard de IDENTIFICACIÓN (estilo Roon): empareja el álbum con MusicBrainz por nº de pistas
// + perfil de duraciones (no por búsqueda de texto). GET /api/identify, luego /api/identify/apply. ──
document.addEventListener('click',e=>{ if(e.target.closest('#identifyalbum')){ openIdentify(); } });

// ── Reanalizar: recalcula loudness/ReplayGain + waveform SOLO de este álbum (Roon edit_album_reanalyze) ──
document.addEventListener('click',e=>{
  const rb=e.target.closest('#reanalyzealbum'); if(!rb||rb.disabled) return;
  rb.disabled=true; rb.style.cursor='default'; rb.style.opacity='.65'; rb.innerHTML=window.icon('refresh',15)+'Analizando…';
  fetch('/api/album/reanalyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rg:id})})
    .then(r=>r.json()).then(r=>{ if(r&&r.ok){ toast(r.already?'Ya se está analizando este álbum…':'Reanalizando loudness y onda en segundo plano…'); }
      else { toast((r&&r.error)||'No se pudo reanalizar'); load(); } })
    .catch(ex=>{ toast('error: '+ex.message); load(); });
});
function idClose(){ const m=document.getElementById('idwiz'); if(m) m.remove(); }
function openIdentify(){
  idClose();
  const m=document.createElement('div'); m.id='idwiz';
  m.setAttribute('style','position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto');
  m.innerHTML=`<div id="idcard" style="width:100%;max-width:640px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:7px">${window.icon('search',16)}Identificar álbum</div>
      <span id="idx" title="Cerrar" style="cursor:pointer;color:var(--text-2);display:inline-flex">${window.icon('close',17)}</span>
    </div>
    <div id="idbody" style="padding:16px"><div style="color:var(--text-2);font-size:13px">Buscando candidatos en MusicBrainz… (puede tardar unos segundos)</div></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',ev=>{ if(ev.target===m||ev.target.closest('#idx')) idClose(); });
  fetch('/api/identify?rg='+id).then(r=>r.json()).then(renderIdentify).catch(e=>{ const b=document.getElementById('idbody'); if(b) b.innerHTML='<div style="color:var(--no,#A32D2D)">Error: '+esc(e.message)+'</div>'; });
}
function renderIdentify(r){
  const b=document.getElementById('idbody'); if(!b) return;
  if(!r||!r.ok){ b.innerHTML='<div style="color:#A32D2D">No se pudo consultar: '+esc((r&&r.error)||'error')+'</div>'; return; }
  const p=r.profile||{}, cands=r.candidates||[];
  const prof=`<div style="font-size:13px;color:var(--text-2);margin-bottom:12px">Tu álbum: <b style="color:var(--text)">${esc(p.title||'')}</b> — ${esc(p.artist||'')} · ${p.trackCount||0} pistas${p.barcode?' · barcode '+esc(p.barcode):''}</div>`;
  if(!cands.length){ b.innerHTML=prof+'<div style="color:var(--text-2)">Sin candidatos en MusicBrainz. Prueba a corregir artista/título en los tags.</div>'; return; }
  const chip=(label)=>`<span style="font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 7px;color:var(--text-2)">${label}</span>`;
  const rows=cands.map((c,i)=>{
    const pts=[]; if(c.parts){ if(c.parts.barcode) pts.push(chip('barcode ✓')); if(c.parts.trackCount) pts.push(chip('nº pistas ✓')); pts.push(chip('dur '+Math.round((c.parts.dur||0)*100)+'%')); }
    const best=i===0?'border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))':'';
    const pct=Math.max(0,Math.min(100,Math.round((c.score||0)*100)));
    return `<div class="idcand" style="display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;${best}">
      <div style="width:42px;text-align:center;flex:none"><div style="font-weight:700;font-size:15px">${pct}</div><div style="font-size:9px;color:var(--text-2)">puntos</div></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title||'(sin título)')}</div>
        <div style="font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.artist||'')} · ${esc(c.date||'?')}${c.country?' '+esc(c.country):''} · ${c.trackCount||0} pistas</div>
        <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${pts.join('')}</div>
      </div>
      <button class="iduse" data-mbid="${esc(c.mbid)}" style="flex:none;cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:13px">Usar</button>
    </div>`;
  }).join('');
  b.innerHTML=prof+rows+'<div style="font-size:11px;color:var(--text-2);margin-top:4px">Al elegir una edición se fija el MBID y se traen sus metadatos (créditos, fechas, portada…), como en Roon.</div>';
  b.querySelectorAll('.iduse').forEach(btn=>btn.addEventListener('click',()=>applyIdentify(btn.dataset.mbid,btn)));
}
function applyIdentify(mbid,btn){
  if(!mbid) return; btn.disabled=true; btn.textContent='Aplicando…';
  fetch('/api/identify/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rg:id,release_mbid:mbid})})
    .then(r=>r.json()).then(r=>{ if(r.ok){ idClose(); toast(r.enriching?'Identificado · enriqueciendo metadatos…':'Álbum identificado'); load(); } else { btn.disabled=false; btn.textContent='Usar'; toast(r.error||'error'); } })
    .catch(e=>{ btn.disabled=false; btn.textContent='Usar'; toast('error: '+e.message); });
}

// Reproducir: encola el álbum y arranca (el player registra la escucha)
document.addEventListener('click',e=>{
  const pd=e.target.closest('#app .playdisc'); if(pd){const d=+pd.dataset.disc;const idx=albumTracks.findIndex(t=>t.disc===d);if(idx>=0)player.playAlbum(id,idx);return;}
  const b=e.target.closest('.play'); if(b){player.playAlbum(id, +b.dataset.idx); return;}
  if(e.target.closest('#playalbum')){player.playAlbum(id, 0);return;}
  if(e.target.closest('#radioalbum')){player.radioFrom(id);return;}
  if(e.target.closest('#mixalbum')){player.playMix('album',id);return;}
  if(e.target.closest('#queuealbum')||e.target.closest('#nextalbum')){ const a=window.ALB; if(!a)return; const tr=(a.tracks||[]).filter(t=>t.playable!==0).map(t=>({trackId:t.trackId,recording_id:t.recording_id,title:t.title,artist:a.artist,albumId:a.id,length_ms:t.length_ms,playable:t.playable!==0,gain_db:t.gain_db,peak_dbfs:t.peak_dbfs,album_gain_db:t.album_gain_db,album_peak_dbfs:t.album_peak_dbfs})); if(!tr.length)return; if(e.target.closest('#nextalbum'))player.addNext(tr); else player.enqueue(tr); if(window.toast)toast(e.target.closest('#nextalbum')?'Se reproducirá a continuación':'Añadido a la cola'); return; }
  const aa=e.target.closest('#addalbum'); if(aa){pickPlaylist(aa,plid=>addTo(plid,{album_id:id},'Álbum añadido'));return;}
  const at=e.target.closest('.addtrk'); if(at){pickPlaylist(at,plid=>addTo(plid,{track_ids:[+at.dataset.tid]},'Pista añadida'));return;}
});

// ── añadir a lista: popover de selección + toast ──
function addTo(plid,payload,okMsg){fetch('/api/playlist/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:plid,...payload})}).then(r=>r.json()).then(j=>toast(j.ok?okMsg:(j.error||'error'))).catch(()=>toast('error'));}
let pop=null;
function closePop(){if(pop){pop.remove();pop=null;document.removeEventListener('click',onDoc,true);}}
function onDoc(e){if(pop&&!e.target.closest('#plpop')&&!e.target.closest('.addtrk')&&!e.target.closest('#addalbum'))closePop();}
function pickPlaylist(anchor,onPick){
  closePop();
  fetch('/api/playlists').then(r=>r.json()).then(j=>{
    const pls=j.items||[];
    pop=document.createElement('div');pop.id='plpop';
    pop.setAttribute('style','position:absolute;z-index:70;min-width:200px;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;font-size:13px');
    pop.innerHTML=`<div style="padding:6px 8px;color:var(--text-2);font-size:11px">Añadir a…</div>`+
      pls.map(p=>`<div class="plopt" data-id="${p.id}" style="padding:7px 10px;border-radius:7px;cursor:pointer">${esc(p.name)} <span style="color:var(--text-2)">· ${p.n}</span></div>`).join('')+
      `<div class="plnew" style="padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--accent);border-top:1px solid var(--border);margin-top:4px;display:inline-flex;align-items:center;gap:5px">${window.icon('plus',13)}Nueva lista…</div>`;
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect();
    pop.style.top=(window.scrollY+r.bottom+6)+'px';
    pop.style.left=(window.scrollX+Math.min(r.left,window.innerWidth-300))+'px';
    pop.querySelectorAll('.plopt').forEach(o=>o.addEventListener('click',()=>{const pid=+o.dataset.id;closePop();onPick(pid);}));
    pop.querySelector('.plnew').addEventListener('click',()=>{const n=prompt('Nombre de la nueva lista:');if(n&&n.trim()){fetch('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})}).then(x=>x.json()).then(j=>{closePop();if(j.ok)onPick(j.id);});}else closePop();});
    setTimeout(()=>document.addEventListener('click',onDoc,true),0);
    pop.querySelectorAll('.plopt,.plnew').forEach(o=>{o.addEventListener('mouseenter',()=>o.style.background='var(--surface-2)');o.addEventListener('mouseleave',()=>o.style.background='');});
  });
}
let toastT=null;
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('style','position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .15s');document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1800);}
</script>
