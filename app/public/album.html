<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>escucharrr — álbum</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:14px"><a href="/" style="color:var(--accent);display:inline-flex;align-items:center;gap:5px"><span data-icon="arrow-left" data-s="15"></span>Biblioteca</a></div>
  <div id="app">cargando…</div>
</div>

<script>
const TC={excel:['#0F6E56','#E1F5EE'],si:['#639922','#EAF3DE'],ok:['#BA7517','#FAEEDA'],meh:['#5F5E5A','#F1EFE8'],no:['#A32D2D','#FCEBEB']};
const TN={excel:'Excel',si:'Sí',ok:'Ok',meh:'Meh',no:'No'};
const PAIRS=[['#0F6E56','#1D9E75'],['#534AB7','#7F77DD'],['#185FA5','#378ADD'],['#854F0B','#BA7517'],['#72243E','#D4537E'],['#5F5E5A','#888780'],['#3B6D11','#639922'],['#993C1D','#D85A30']];
function cover(id){return `<img src="/api/cover?rg=${id}" alt="" loading="lazy" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block">`;}
const mmss=ms=>ms?`${Math.floor(ms/60000)}:${String(Math.round(ms%60000/1000)).padStart(2,'0')}`:'';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const id=+new URLSearchParams(location.search).get('id');
let curRel=+new URLSearchParams(location.search).get('rel')||null;   // copia (release) seleccionada; si no, la primaria
const TORD=['excel','si','ok','meh','no'];
let rawAbout='';   // markdown crudo de la reseña EDITABLE (tuya/Obsidian) para el editor
let reviews=[], reviewIdx=0;   // todas las fuentes de reseña + la seleccionada (selector estilo Roon)
let albumTracks=[];   // pistas del álbum (para "reproducir disco")
let TRKSEL=false; const TRKSET=new Set();   // multi-selección de pistas (poner varias en un disco de golpe)
const mdRender=s=>window.mdToHtml?window.mdToHtml(s):esc(s);
const provRefOf=ref=>!ref?'':(/^https?:/.test(ref)?' · <a href="'+esc(ref)+'" target="_blank" rel="noopener" style="color:var(--text-2)">'+esc(ref.replace(/^https?:\/\/(www\.)?/,''))+'</a>':' · '+esc(ref));
function showReview(i){const r=reviews[i];if(!r)return;reviewIdx=i;
  const at=document.querySelector('#app .abouttext');if(at)at.innerHTML=mdRender(r.text);
  const pv=document.getElementById('aboutprov');if(pv)pv.innerHTML='desde '+esc(r.source)+provRefOf(r.ref);
  document.querySelectorAll('#app .revsrc').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  applyCollapse();}
// Plega las reseñas largas (estilo Roon toggle_review): si el texto supera cierta altura,
// se muestra recortado con un degradado y un "Ver más".
function applyCollapse(){const box=document.getElementById('aboutbox');if(!box)return;const at=box.querySelector('.abouttext'),tog=box.querySelector('.revtoggle');if(!at||!tog)return;
  box.classList.remove('collapsed');tog.hidden=true;
  if(at.scrollHeight>280){box.classList.add('collapsed');tog.hidden=false;tog.textContent='Ver más';}}
function renderAlbum(a){
  if(!a||!a.id){app.innerHTML='No encontrado';return;}
  window.ALB=a;
  const tier=`<span class="tiered" style="display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center">${TORD.map(k=>`<span class="tchip" data-tier="${k}" title="${TN[k]}" style="cursor:pointer;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${a.tier_key===k?TC[k][0]:'var(--surface-2)'};color:${a.tier_key===k?TC[k][1]:'var(--text-2)'}">${TN[k]}</span>`).join('')}${a.tier_key?`<span class="tchip" data-tier="" title="Quitar tier" style="cursor:pointer;color:var(--text-2);padding:2px 6px">${window.icon('close',13)}</span>`:''}</span>`;
  const sv=a.album_stars?Math.round(+a.album_stars):0;
  const stars=`<span class="starsed" style="display:inline-flex;align-items:center;gap:1px">${[1,2,3,4,5].map(n=>`<span class="st" data-stars="${n}" title="Valorar ${n}" style="cursor:pointer;color:${n<=sv?'var(--accent)':'var(--muted)'};font-size:17px;line-height:1">★</span>`).join('')}${sv?`<span class="st" data-stars="0" title="Quitar valoración" style="cursor:pointer;color:var(--text-2);font-size:12px;margin-left:4px;display:inline-flex">${window.icon('close',12)}</span>`:''}</span>`;
  const favEd=`<span class="faved" data-fav="${a.is_favorite?0:1}" title="${a.is_favorite?'Quitar de favoritos':'Marcar como favorito'}" style="cursor:pointer;color:${a.is_favorite?'var(--accent)':'var(--text-2)'};font-size:18px;line-height:1">♥</span>`;
  const llEd=`<span class="llater" data-ll="${a.listen_later?0:1}" title="${a.listen_later?'Quitar de escuchar más tarde':'Escuchar más tarde'}" style="cursor:pointer;color:${a.listen_later?'var(--accent)':'var(--text-2)'};display:inline-flex;align-items:center;gap:4px;font-size:13px">${window.icon('lists',15)}${a.listen_later?'En «más tarde»':'Más tarde'}</span>`;
  const hideEd=`<span class="hided" data-hide="${a.hidden?0:1}" title="${a.hidden?'Volver a mostrar en la biblioteca':'Ocultar de la biblioteca (no se borra)'}" style="cursor:pointer;color:${a.hidden?'var(--accent)':'var(--text-2)'};display:inline-flex;align-items:center;gap:4px;font-size:13px">${window.icon(a.hidden?'check':'close',14)}${a.hidden?'Oculto':'Ocultar'}</span>`;
  const genres=(a.genres||[]).map(g=>`<a class="gchip" href="genre.html?name=${encodeURIComponent(g)}">${esc(g)}</a>`).join(' ');
  const artistLink=a.artist_id?`<a href="artist.html?id=${a.artist_id}" style="color:var(--accent)">${esc(a.artist)}</a>`:esc(a.artist);
  const provRef=s=>!s||!s.source_ref?'':(/^https?:/.test(s.source_ref)?` · <a href="${esc(s.source_ref)}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(s.source_ref.replace(/^https?:\/\/(www\.)?/,''))}</a>`:' · '+esc(s.source_ref));
  reviews=a.reviews||[]; reviewIdx=0;
  const editable=reviews.find(r=>r.editable); rawAbout=editable?editable.text:'';   // editar SIEMPRE la tuya
  const sel0=reviews[0];
  const srcSel=reviews.length>1?`<span class="revsrcs">${reviews.map((r,i)=>`<span class="revsrc${i===0?' on':''}" data-i="${i}">${esc(r.label)}</span>`).join('')}</span>`:'';
  const prov0=sel0?('desde '+esc(sel0.source)+provRefOf(sel0.ref)):'';
  const about=`<div class="about" id="aboutbox"><div class="prov" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${srcSel}<span id="aboutprov" style="color:var(--text-2)">${prov0}</span></span><span class="aboutedit" style="cursor:pointer;color:var(--accent);font-size:12px;white-space:nowrap">${rawAbout?'editar reseña':'añadir reseña'}</span></div><div class="abouttext">${sel0?mdRender(sel0.text):'<span style="color:var(--text-2)">Sin reseña. Escribe la tuya — tus datos mandan.</span>'}</div><div class="revtoggle" hidden></div></div>`;
  const editions=(a.editions||[]).map(e=>`${esc(e.format||'?')}${e.date?' · '+esc(e.date):''}${e.country?' · '+esc(e.country):''}`).join(' &nbsp;·&nbsp; ');
  const edLabel=(a.editions||[]).map(e=>e.label).find(Boolean)||null;       // sello discográfico (MusicBrainz)
  const edCountry=(a.editions||[]).map(e=>e.country).find(Boolean)||null;   // país de edición
  const edBarcode=(a.editions||[]).map(e=>e.barcode).find(Boolean)||null;   // código de barras (EAN/UPC)
  albumTracks=a.tracks||[];
  // Enlaces externos del álbum. Record Club: abre el disco DIRECTO por su MBID de release-group
  // (record.club/import/<mbid>), como hace Liderarrr; cae a búsqueda solo si no está identificado.
  // Discogs/RateYourMusic/Last.fm: por nombre (no exponen id estable para esto).
  const _albQ=[a.artist,a.title].filter(Boolean).join(' ');
  const _lfmUrl=(a.artist&&a.title)?`https://www.last.fm/music/${encodeURIComponent(a.artist)}/${encodeURIComponent(a.title)}`:null;
  const _mbUrl=a.mbid?`https://musicbrainz.org/release-group/${a.mbid}`:null;
  const _dcUrl=_albQ?`https://www.discogs.com/search/?q=${encodeURIComponent(_albQ)}&type=master`:null;
  const _rymUrl=_albQ?`https://rateyourmusic.com/search?searchterm=${encodeURIComponent(_albQ)}&searchtype=l`:null;
  const _rcUrl=a.mbid?`https://record.club/import/${a.mbid}`:(_albQ?`https://record.club/search?q=${encodeURIComponent(_albQ)}`:null);
  const _lnk=(u,t)=>u?`<a href="${u}" target="_blank" rel="noopener" style="color:var(--accent)">${t}</a>`:'';
  // ¿Tiene DÍA concreto de lanzamiento? (first_release = YYYY-MM-DD). Si no, y está identificado, invitamos a
  // contribuirlo a MusicBrainz (donde viven las fechas) — así «En este día» mejora para todos. Las fechas se
  // editan en una EDICIÓN concreta del release-group; el enlace lleva a su página de MusicBrainz.
  const _hasDay = !!(a.first_release && String(a.first_release).length >= 10);
  const _dayNote = !_hasDay
    ? `<div id="daynote" style="font-size:12.5px;color:var(--text-2);margin-top:6px">
         <div style="display:inline-flex;align-items:flex-start;gap:6px">${window.icon('calendar',14)}<span>Sin día de lanzamiento concreto.${a.mbid?` ¿Lo sabes? <a href="https://musicbrainz.org/release-group/${a.mbid}" target="_blank" rel="noopener" style="color:var(--accent)">Añádelo en MusicBrainz</a> y lo tendrás aquí al reidentificar.`:''}</span></div>
         <div id="spdate" style="margin-top:4px"></div>
       </div>`
    : '';
  const extLinks=(_lfmUrl||_mbUrl||_dcUrl||_rymUrl||_rcUrl)?`<div style="margin-top:9px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span class="k" style="opacity:.7">Enlaces</span>${_lnk(_mbUrl,'MusicBrainz')}${_lnk(_dcUrl,'Discogs')}${_lnk(_rcUrl,'Record Club')}${_lnk(_lfmUrl,'Last.fm')}${_lnk(_rymUrl,'RateYourMusic')}</div>`:'';
  const multiDisc=(a.tracks||[]).some(t=>t.disc>1);
  const trackRow=(t,i)=>`<div class="track${TRKSET.has(t.trackId)?' trkon':''}" data-tid="${t.trackId}"><span class="trkmark">${TRKSET.has(t.trackId)?'✓':''}</span><button class="play" data-idx="${i}" aria-label="Reproducir" title="Reproducir" style="border:none;background:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0 4px;display:inline-flex;align-items:center">${window.icon('play',14)}</button><span class="pos">${t.pos}</span><span style="flex:1;min-width:0">${esc(t.title)}${(t.artist&&a.artist&&t.artist!==a.artist)?`<div style="font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.artist_id?`<a href="artist.html?id=${t.artist_id}" style="color:var(--text-2)">${esc(t.artist)}</a>`:esc(t.artist)}</div>`:''}${(t.work||t.composers)?`<div style="font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.work_id?`<a href="work.html?id=${t.work_id}" style="color:var(--text-2)">${esc(t.work||'obra')}</a>`:esc(t.work||'')}${t.composers?` · ${esc(t.composers.replace(/,/g,', '))}`:''}</div>`:''}</span><span class="edittrk" data-idx="${i}" title="Editar pista (nº, título, artista)" style="cursor:pointer;color:var(--text-2);font-size:14px;padding:0 6px;display:inline-flex;align-items:center;opacity:.6">${window.icon('edit',14)}</span><span class="addtrk" data-tid="${t.trackId}" title="Añadir a una lista" style="cursor:pointer;color:var(--text-2);font-size:14px;padding:0 6px;display:inline-flex;align-items:center">${window.icon('plus',15)}</span><span class="dur">${mmss(t.length_ms)}</span></div>`;
  let tracks='';
  // duración total del álbum (Roon: album_length): «N pistas · 47 min» o «… · 1 h 12 min»
  const _totMs=(a.tracks||[]).reduce((s,t)=>s+(t.length_ms||0),0);
  const _durLbl=(ms=>{if(!ms)return '';const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;})(_totMs);
  const _nt=(a.tracks||[]).length;
  // Salto rápido entre discos (estilo Roon): chips «Disco N» que llevan a cada disco del tracklist.
  const _discList=multiDisc?[...new Set((a.tracks||[]).map(t=>t.disc))].sort((x,y)=>x-y):[];
  const _discNav=_discList.length>1?`<div class="discnav">${_discList.map(d=>`<button class="discchip" data-disc="${d}">Disco ${d}</button>`).join('')}</div>`:'';
  if((a.tracks||[]).length){ tracks=`<div class="sec">Pistas <span style="font-size:13px;font-weight:400;color:var(--text-2)">· ${_nt} pista${_nt===1?'':'s'}${_durLbl?' · '+_durLbl:''}</span><span id="trkseltog" style="font-size:12px;font-weight:400;color:var(--accent);cursor:pointer;margin-left:8px">Seleccionar</span></div>${_discNav}`; let cur=null;
    a.tracks.forEach((t,i)=>{ if(multiDisc && t.disc!==cur){ cur=t.disc; tracks+=`<div class="dischdr" id="disc${t.disc}"><span class="dh">${window.icon('music',14)} Disco ${t.disc}</span><button class="playdisc" data-disc="${t.disc}" title="Reproducir este disco">${window.icon('play',12)} Reproducir disco</button></div>`; } tracks+=trackRow(t,i); }); }
  const INST={'bass':'bajo','electric bass':'bajo eléctrico','double bass':'contrabajo','guitar':'guitarra','acoustic guitar':'guitarra acústica','electric guitar':'guitarra eléctrica','drums':'batería','percussion':'percusión','piano':'piano','keyboards':'teclados','synthesizer':'sintetizador','organ':'órgano','cello':'violonchelo','violin':'violín','viola':'viola','trumpet':'trompeta','trombone':'trombón','saxophone':'saxofón','flute':'flauta','clarinet':'clarinete','harmonica':'armónica','accordion':'acordeón','vibraphone':'vibráfono'};
  const tInst=i=>i?(INST[i.toLowerCase()]||i.toLowerCase()):i;
  const clabel=c=>c.role==='instrumento'&&c.instrument?tInst(c.instrument):(c.role==='voz'&&c.instrument?'voz ('+tInst(c.instrument)+')':c.role);
  // Créditos agrupados como Roon: Intérpretes / Composición / Producción / Edición (+ Otros para lo no clasificado).
  const CGROUP={instrumento:'perf',voz:'perf','interpretación':'perf',conductor:'perf','performing orchestra':'perf',orchestrator:'perf',arreglos:'perf','vocal arranger':'perf','instrument arranger':'perf',
    'composición':'comp',escritura:'comp',letra:'comp',
    'producción':'prod','ingeniería':'prod',mezcla:'prod','grabación':'prod','masterización':'prod',remixer:'prod',editor:'prod',programming:'prod',
    'phonographic copyright':'rel','samples from artist':'rel'};
  const CORDER=[['perf','Intérpretes'],['comp','Composición'],['prod','Producción'],['rel','Edición'],['other','Otros créditos']];
  let credits='';
  if((a.credits||[]).length){ const by={};
    a.credits.forEach(c=>{const g=CGROUP[c.role]||'other';(by[g]=by[g]||[]).push(c);});
    credits='<div class="sec">Créditos</div>'+CORDER.filter(([k])=>by[k]&&by[k].length).map(([k,lbl])=>
      `<div class="cgrp-h">${lbl}</div><div class="credits">`+by[k].map(c=>`<div class="c"><div class="role">${esc(clabel(c))}</div>${c.artists.map(esc).join(', ')}</div>`).join('')+`</div>`).join('');
  }
  // otras ediciones del mismo álbum en la biblioteca (deluxe/remaster/año/país…), estilo Roon
  // Versiones (estilo Roon): copias del mismo lanzamiento en tu biblioteca, con la «Principal» marcada.
  const pbadge=`<span class="pbadge">Principal</span>`;
  const curTracks=(a.tracks||[]).length;
  // "Hacer principal": si la copia mostrada NO es la primaria y hay más de una copia física, ofrecer fijarla.
  const makePrim=(!a.is_primary && a.copy_count>1 && a.release_id)?`<button class="makeprimary" data-rel="${a.release_id}" title="Fijar esta copia como la principal del álbum" style="margin-left:8px;background:none;border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:1px 9px;font-size:11px;cursor:pointer">Hacer principal</button>`:'';
  // Enlace de cada versión: una COPIA de este álbum abre ?id&rel=; una versión hermana (otro álbum) abre ?id=.
  const verHref=v=>v.copy?`album.html?id=${v.id}&rel=${v.rel}`:`album.html?id=${v.id}`;
  const versions=(a.version_count>1)?`<div class="sec">Versiones <span style="color:var(--muted);font-size:14px;font-weight:400;font-family:var(--sans)">${a.version_count} en tu biblioteca</span></div><div class="versions">`
    +`<div class="verrow cur"><span class="vt">Esta copia${a.is_primary?' '+pbadge:''}${makePrim}</span><span class="vm">${[a.format,curTracks?curTracks+' pistas':''].filter(Boolean).map(esc).join(' · ')}</span></div>`
    +a.versions.map(v=>{ const inner=`<span class="vt">${esc(v.title)}${v.primary?' '+pbadge:''}</span><span class="vm">${[v.format,v.tracks?v.tracks+' pistas':'',v.year].filter(Boolean).map(esc).join(' · ')}</span>`;
        // copia física del MISMO álbum → solo enlace; versión hermana (otro release_group) → enlace + «Combinar» para fundirla aquí
        const verbtn=(cls,label,tip)=>`<button class="${cls}" data-id="${v.id}" data-title="${esc(v.title)}" title="${tip}" style="flex:none;font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--text-2);cursor:pointer">${label}</button>`;
        return v.copy ? `<a class="verrow" href="${verHref(v)}">${inner}</a>`
          : `<div class="verrow"><a href="${verHref(v)}" style="flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:14px;color:inherit;text-decoration:none">${inner}</a><div style="flex:none;display:flex;gap:6px">${verbtn('verfold','Fundir','Unir en UN solo álbum: sus pistas pasan a este tracklist (por discos). Para el mismo disco partido.')}${verbtn('verfuse','Combinar','Tratarlas como ediciones distintas del mismo álbum (se mantienen las dos como versiones).')}</div></div>`;
      }).join('')
    +`</div>`:'';
  // Más del artista (profundizar en su discografía) y artistas afines de tu biblioteca (profundizar en sonidos), estilo Roon.
  const artNm=esc(a.artist||'');
  const moreBy=(a.more_albums||[]).length?`<div class="sec">Más de ${a.artist_id?`<a href="artist.html?id=${a.artist_id}" style="color:inherit;text-decoration:none">${artNm}</a>`:artNm}</div><div class="shelf">`+a.more_albums.map(al=>`<a class="shcard" href="album.html?id=${al.id}" title="${esc(al.title)}"><div class="cv"><img src="/api/cover?rg=${al.id}" alt="" loading="lazy"></div><div class="nm">${esc(al.title)}</div><div class="yr">${al.year||''}</div></a>`).join('')+`</div>`:'';
  // "También de" (Roon also_from): más del mismo sello en tu biblioteca
  const moreLabel=(a.also_from_label||[]).length?`<div class="sec">También de ${esc(a.label_name||'este sello')} <span style="font-size:13px;font-weight:400;color:var(--text-2)">· sello</span></div><div class="shelf">`+a.also_from_label.map(al=>`<a class="shcard" href="album.html?id=${al.id}" title="${esc(al.title)} — ${esc(al.artist||'')}"><div class="cv"><img src="/api/cover?rg=${al.id}" alt="" loading="lazy"></div><div class="nm">${esc(al.title)}</div><div class="yr">${esc(al.artist||'')}${al.year?' · '+al.year:''}</div></a>`).join('')+`</div>`:'';
  app.innerHTML=`
    <div class="hero">
      <div style="flex:none"><div class="cov"><img src="/api/cover?rg=${a.id}&p=${encodeURIComponent(a.cover_pref||'auto')}" alt="" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block"></div><div class="coverpref">${[['auto','Auto'],['file','Archivo'],['download','Descargada'],['none','Ninguna']].map(([v,l])=>`<span class="cpref${(a.cover_pref||'auto')===v?' on':''}" data-v="${v}" title="Fuente de la portada">${l}</span>`).join('')}<span class="setcover" title="Elegir portada desde una URL o un archivo" style="cursor:pointer;color:var(--accent)">Cambiar…</span></div></div>
      <div style="flex:1;min-width:240px">
        <div style="color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(a.primary_type||'álbum')} · ${a.year||'—'}${a.mbid_source==='liderarrr'?`<span title="MBID importado de Liderarrr (identificación de MusicBrainz ya hecha allí)" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:2px 9px">${window.icon('check',12)}identificado vía Liderarrr</span>`:''}</div>
        ${_dayNote}
        <h1 style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(a.title)}<button class="titleedit" title="Editar el título del álbum" aria-label="Editar título" style="flex:none;background:none;border:none;color:var(--text-2);cursor:pointer;padding:3px;display:inline-flex;align-items:center">${window.icon('edit',17)}</button></h1>
        ${(a.orig_title&&a.orig_title!==a.title)?`<div style="font-size:12px;color:var(--text-2);margin-top:-4px;margin-bottom:2px">Original: ${esc(a.orig_title)} · <a href="#" class="titlerevert" style="color:var(--accent)">revertir</a></div>`:''}
        <div style="font-size:15px;display:inline-flex;align-items:center;gap:6px">${artistLink}<button class="artistedit" title="Corregir el artista del álbum (no toca los tags de tus ficheros)" aria-label="Editar artista" style="flex:none;background:none;border:none;color:var(--text-2);cursor:pointer;padding:2px;display:inline-flex;align-items:center">${window.icon('edit',14)}</button></div>

// no cambia nada). Si aporta día/mes, la mostramos con un enlace para revisarla y aportarla a MusicBrainz.
const _MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function _fmtSpDate(d,prec){
  const m=String(d||'').match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/); if(!m) return d;
  const y=m[1], mo=m[2]?_MESES[+m[2]-1]:null, da=m[3]?+m[3]:null;
  if(prec==='day'&&da&&mo) return `${da} de ${mo} de ${y}`;
  if(prec==='month'&&mo) return `${mo} de ${y}`;
  return y;
}
async function maybeDateSuggest(){
  const slot=document.getElementById('spdate'); const a=window.ALB; if(!slot||!a) return;
  let r; try{ r=await fetch('/api/datesuggest?id='+a.id).then(x=>x.json()); }catch(e){ return; }
  if(!r||!r.ok||!r.suggestion||!r.suggestion.date) return;
  const s=r.suggestion; if(s.precision!=='day'&&s.precision!=='month') return;   // el año solo no aporta nada
  const pretty=_fmtSpDate(s.date,s.precision);
  const src=s.url?`<a href="${s.url}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(s.source||'')}</a>`:esc(s.source||'');
  const mb=a.mbid?` · <a href="https://musicbrainz.org/release-group/${a.mbid}" target="_blank" rel="noopener" style="color:var(--accent)">Revisar y añadir en MusicBrainz</a>`:'';
  slot.innerHTML=`<span>${src} indica <b style="color:var(--text)">${pretty}</b>${mb}</span>`;
}

const _inits=n=>{const s=String(n||'').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('');return (s||'?').slice(0,2).toUpperCase();};

let LIDOK=null;   // null=sin comprobar, true/false=estado de conexión (cacheado)
// matchKey de Liderarrr (compacto) para marcar los retos que ya contienen este disco
const _nn=s=>String(s||'').normalize('NFD').toLowerCase().replace(/[^a-z0-9]+/g,'');
const _EDIT=/(deluxe|expanded|remaster|anniversary|edition|reissue|re-?master|mono|stereo|bonus|special|version|explicit|flac|mp3|vinyl|\d{2,3}\s*bit|\d{2,3}(\.\d)?\s*khz|hi-?res|24-?96|16-?44)/i;
function _ct(t){ t=String(t||'').trim(); for(;;){ const m=t.match(/[\[(]([^\])]*)[)\]]\s*$/); if(!m||(!/\d{4}/.test(m[1])&&!_EDIT.test(m[1]))) break; t=t.slice(0,m.index).trim(); } return _nn(t.replace(/\s+[-–—]\s*\d{4}\s*$/,'')); }
const _mk=(a,t)=>_nn(a)+'::'+_ct(t);

function renderIdentify(r){

  const p=r.profile||{}, cands=r.candidates||[];
  const prof=`<div style="font-size:13px;color:var(--text-2);margin-bottom:12px">Tu álbum: <b style="color:var(--text)">${esc(p.title||'')}</b> — ${esc(p.artist||'')} · ${p.trackCount||0} pistas${p.barcode?' · barcode '+esc(p.barcode):''}</div>`;
  const linkRow=`<div style="display:flex;gap:8px;align-items:center;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <input id="mblinkinp" placeholder="¿Lo sabes tú? Pega el release-group de MusicBrainz (URL o MBID)" style="flex:1;min-width:0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:13px">
      <button id="mblinkbtn" style="flex:none;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--text)">Enlazar</button></div>`;
  if(!cands.length){ b.innerHTML=prof+linkRow+'<div style="color:var(--text-2)">Sin candidatos automáticos. Pega arriba el release-group de MusicBrainz a mano, o corrige artista/título en los tags.</div>'; wireMbLink(); return; }
  const chip=(label)=>`<span style="font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 7px;color:var(--text-2)">${label}</span>`;
  const rows=cands.map((c,i)=>{
    const pts=[]; if(c.parts){ if(c.parts.barcode) pts.push(chip('barcode ✓')); if(c.parts.trackCount) pts.push(chip('nº pistas ✓')); pts.push(chip('dur '+Math.round((c.parts.dur||0)*100)+'%')); }
    const best=i===0?'border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))':'';
    const pct=Math.max(0,Math.min(100,Math.round((c.score||0)*100)));

        <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${pts.join('')}</div>

    </div>`;
  }).join('');
  b.innerHTML=prof+linkRow+rows+'<div style="font-size:11px;color:var(--text-2);margin-top:4px">Al elegir una edición se fija el MBID y se traen sus metadatos (créditos, fechas, portada…), como en Roon.</div>';
  b.querySelectorAll('.iduse').forEach(btn=>btn.addEventListener('click',()=>applyIdentify(btn.dataset.mbid,btn)));
  wireMbLink();

    <div style="display:flex;gap:10px">
      <div style="width:64px"><label style="font-size:12px;color:var(--text-2)">Disco</label><input id="trkdisc" type="number" min="1" value="${esc(t.disc)}" style="width:100%;font:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);box-sizing:border-box">${(t.orig_disc!=null&&String(t.orig_disc)!==String(t.disc))?orig(t.orig_disc):''}</div>
      <div style="width:64px"><label style="font-size:12px;color:var(--text-2)">Nº</label><input id="trkno" type="number" min="1" value="${esc(t.pos)}" style="width:100%;font:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);box-sizing:border-box">${(t.orig_pos!=null&&String(t.orig_pos)!==String(t.pos))?orig(t.orig_pos):''}</div>
      <div style="flex:1"><label style="font-size:12px;color:var(--text-2)">Título</label><input id="trktitle" type="text" value="${esc(t.title||'')}" style="width:100%;font:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);box-sizing:border-box">${(t.orig_title&&t.orig_title!==t.title)?orig(t.orig_title):''}</div>
    </div>
    <div style="margin-top:10px"><label style="font-size:12px;color:var(--text-2)">Artista de la canción</label><input id="trkartist" type="text" value="${esc(t.artist||'')}" placeholder="${esc(aa)}" style="width:100%;font:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);box-sizing:border-box">${(t.orig_artist&&t.orig_artist!==t.artist)?orig(t.orig_artist):''}
      <div style="font-size:11px;color:var(--text-2);margin-top:3px">Artista del álbum: <b style="color:var(--text)">${esc(aa||'—')}</b>. En colaboraciones, aquí va quien canta esta pista.</div></div>
    <div style="font-size:12px;color:var(--text-2);margin-top:10px">No toca las etiquetas de tus ficheros: solo cambia cómo se muestra aquí. Vacía un campo para restaurar su valor original.</div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button id="trkcancel" style="padding:7px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text)">Cancelar</button>
      <button id="trksave" class="btn-accent" style="padding:7px 16px">Guardar</button>
    </div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',ev=>{ if(ev.target===ov)close(); });
  document.getElementById('trkcancel').onclick=close;
  const save=async()=>{
    const di=document.getElementById('trkdisc').value.trim(), no=document.getElementById('trkno').value.trim(), ti=document.getElementById('trktitle').value.trim(), ar=document.getElementById('trkartist').value.trim();
    const jobs=[];
    if(String(di)!==String(t.disc)) jobs.push(editTrack(t.trackId,'disc_no',di));
    if(String(no)!==String(t.pos)) jobs.push(editTrack(t.trackId,'track_no',no));
    if(ti!==(t.title||'')) jobs.push(editTrack(t.trackId,'title',ti));
    if(ar!==(t.artist||'')) jobs.push(editTrack(t.trackId,'track_artist',ar));
    if(!jobs.length){ close(); return; }
    try{ const rs=await Promise.all(jobs); if(rs.every(r=>r&&r.ok)){ toast('Pista actualizada'); close(); load(); } else toast(((rs.find(r=>!r||!r.ok))||{}).error||'error'); }catch(e){ toast('error: '+e.message); }
  };
  document.getElementById('trksave').onclick=save;
  ov.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();save();} else if(ev.key==='Escape'){ev.preventDefault();close();} });
  const f=document.getElementById('trktitle'); if(f){f.focus();f.select();}
}

// ── añadir a lista: popover de selección + toast ──
function addTo(plid,payload,okMsg){fetch('/api/playlist/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:plid,...payload})}).then(r=>r.json()).then(j=>toast(j.ok?okMsg:(j.error||'error'))).catch(()=>toast('error'));}
let pop=null;
function closePop(){if(pop){pop.remove();pop=null;document.removeEventListener('click',onDoc,true);}}
function onDoc(e){if(pop&&!e.target.closest('#plpop')&&!e.target.closest('.addtrk')&&!e.target.closest('#addalbum'))closePop();}
function pickPlaylist(anchor,onPick){
  closePop();
  fetch('/api/playlists').then(r=>r.json()).then(j=>{
    const pls=j.items||[];
    pop=document.createElement('div');pop.id='plpop';
    pop.setAttribute('style','position:absolute;z-index:70;min-width:200px;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;font-size:13px');
    pop.innerHTML=`<div style="padding:6px 8px;color:var(--text-2);font-size:11px">Añadir a…</div>`+
      pls.map(p=>`<div class="plopt" data-id="${p.id}" style="padding:7px 10px;border-radius:7px;cursor:pointer">${esc(p.name)} <span style="color:var(--text-2)">· ${p.n}</span></div>`).join('')+
      `<div class="plnew" style="padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--accent);border-top:1px solid var(--border);margin-top:4px;display:inline-flex;align-items:center;gap:5px">${window.icon('plus',13)}Nueva lista…</div>`;
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect();
    pop.style.top=(window.scrollY+r.bottom+6)+'px';
    pop.style.left=(window.scrollX+Math.min(r.left,window.innerWidth-300))+'px';
    pop.querySelectorAll('.plopt').forEach(o=>o.addEventListener('click',()=>{const pid=+o.dataset.id;closePop();onPick(pid);}));
    pop.querySelector('.plnew').addEventListener('click',()=>{const n=prompt('Nombre de la nueva lista:');if(n&&n.trim()){fetch('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})}).then(x=>x.json()).then(j=>{closePop();if(j.ok)onPick(j.id);});}else closePop();});
    setTimeout(()=>document.addEventListener('click',onDoc,true),0);
    pop.querySelectorAll('.plopt,.plnew').forEach(o=>{o.addEventListener('mouseenter',()=>o.style.background='var(--surface-2)');o.addEventListener('mouseleave',()=>o.style.background='');});
  });
}
let toastT=null;
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('style','position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .15s');document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1800);}
function undoToast(msg, undoId){ if(!undoId){ toast(msg); return; }
  let t=document.getElementById('undotoast'); if(t)t.remove(); t=document.createElement('div'); t.id='undotoast';
  t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:130;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center';
  t.innerHTML='<span>'+msg+'</span><a href="#" id="undolink" style="color:#9ecbff;font-weight:600;text-decoration:none">Deshacer</a>'; document.body.appendChild(t);
  const close=()=>t.remove(); const to=setTimeout(close,9000);
  t.querySelector('#undolink').onclick=async(e)=>{ e.preventDefault(); clearTimeout(to); try{ const r=await fetch('/api/merge/undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:undoId})}).then(x=>x.json()); close(); toast(r.ok?'Deshecho':(r.error||'error')); load(); }catch(err){ toast('error'); } }; }

// ── Portada manual: elegir desde una URL o examinar un archivo (como Plex) ──
function openCoverPicker(){
  if(document.getElementById('covdlg'))return;
  const ov=document.createElement('div'); ov.id='covdlg'; ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:120';
  ov.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:min(460px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.4)">
    <div style="font-weight:600;font-size:15px;margin-bottom:12px;display:inline-flex;align-items:center;gap:7px">${window.icon('edit',16)}Cambiar portada</div>
    <label style="font-size:12px;color:var(--text-2)">Desde una URL (como en Plex)</label>
    <div style="display:flex;gap:8px;margin-top:4px"><input id="covurl" type="url" placeholder="https://…/portada.jpg" style="flex:1;font:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text)"><button id="covurlgo" class="btn-accent" style="padding:7px 14px">Usar</button></div>
    <div style="margin-top:14px"><label style="font-size:12px;color:var(--text-2)">…o examinar un archivo</label><br><input id="covfile" type="file" accept="image/*" style="margin-top:4px"></div>
    <div style="font-size:12px;color:var(--text-2);margin-top:12px">La portada se guarda en la app (no toca tus ficheros) y no la pisa la descarga automática.</div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:space-between;align-items:center">
      <button id="covclear" style="padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text-2)">Quitar portada puesta</button>
      <button id="covcancel" style="padding:7px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text)">Cerrar</button>
    </div><div id="covmsg2" style="font-size:12.5px;margin-top:8px;color:var(--text-2)"></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove(); ov.addEventListener('click',ev=>{ if(ev.target===ov)close(); });
  document.getElementById('covcancel').onclick=close;
  const msg=document.getElementById('covmsg2'), post=async(body)=>{ msg.textContent='Guardando…'; try{ const r=await fetch('/api/album/cover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({rg:id},body))}).then(x=>x.json()); if(r.ok){ toast('Portada actualizada'); close(); load(); } else { msg.style.color='#c0392b'; msg.textContent=r.error||'error'; } }catch(e){ msg.style.color='#c0392b'; msg.textContent='error: '+e.message; } };
  document.getElementById('covurlgo').onclick=()=>{ const u=document.getElementById('covurl').value.trim(); if(!u){msg.textContent='Pon una URL';return;} post({url:u}); };
  document.getElementById('covclear').onclick=()=>post({clear:true});
  document.getElementById('covfile').onchange=(ev)=>{ const f=ev.target.files[0]; if(!f)return; if(f.size>15*1024*1024){msg.style.color='#c0392b';msg.textContent='Archivo demasiado grande (máx. 15 MB)';return;} const rd=new FileReader(); rd.onload=()=>post({dataUrl:rd.result}); rd.readAsDataURL(f); };
}

// ── multi-selección de pistas: poner varias en un disco de golpe (Serge) ──
function trkRepaint(){ document.body.classList.toggle('trksel',TRKSEL); const tog=document.getElementById('trkseltog'); if(tog)tog.textContent=TRKSEL?'Hecho':'Seleccionar'; const n=TRKSET.size; document.getElementById('trkbar').classList.toggle('on',TRKSEL&&n>0); document.getElementById('trkcount').textContent=n+' pista'+(n===1?'':'s'); document.querySelectorAll('#app .track').forEach(el=>{ const on=TRKSET.has(+el.dataset.tid); el.classList.toggle('trkon',on); const m=el.querySelector('.trkmark'); if(m)m.textContent=on?'✓':''; }); }
document.addEventListener('click',e=>{
  if(e.target.closest('#trkseltog')){ e.preventDefault(); e.stopPropagation(); TRKSEL=!TRKSEL; if(!TRKSEL)TRKSET.clear(); trkRepaint(); return; }
  if(TRKSEL){ const row=e.target.closest('#app .track'); if(row&&row.dataset.tid){ e.preventDefault(); e.stopPropagation(); const id=+row.dataset.tid; if(TRKSET.has(id))TRKSET.delete(id); else TRKSET.add(id); trkRepaint(); } }
},true);
document.getElementById('trkselclear').onclick=()=>{ TRKSET.clear(); trkRepaint(); };
document.getElementById('trkselexit').onclick=()=>{ TRKSEL=false; TRKSET.clear(); trkRepaint(); };
document.getElementById('trkapplydisc').onclick=async()=>{ const d=document.getElementById('trkdiscin').value.trim(); if(!d){toast('Pon un nº de disco');return;} const ids=[...TRKSET]; if(!ids.length)return; for(const id of ids){ try{ await editTrack(id,'disc_no',d); }catch(e){} } toast(ids.length+' pistas → disco '+d); TRKSET.clear(); TRKSEL=false; trkRepaint(); load(); };
</script>
