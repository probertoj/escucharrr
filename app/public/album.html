<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — álbum</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:14px"><a href="/" style="color:var(--accent);display:inline-flex;align-items:center;gap:5px"><span data-icon="arrow-left" data-s="15"></span>Biblioteca</a></div>
  <div id="app">cargando…</div>
</div>

<script>
const TC={excel:['#0F6E56','#E1F5EE'],si:['#639922','#EAF3DE'],ok:['#BA7517','#FAEEDA'],meh:['#5F5E5A','#F1EFE8'],no:['#A32D2D','#FCEBEB']};
const TN={excel:'Excel',si:'Sí',ok:'Ok',meh:'Meh',no:'No'};
const PAIRS=[['#0F6E56','#1D9E75'],['#534AB7','#7F77DD'],['#185FA5','#378ADD'],['#854F0B','#BA7517'],['#72243E','#D4537E'],['#5F5E5A','#888780'],['#3B6D11','#639922'],['#993C1D','#D85A30']];
function cover(id){return `<img src="/api/cover?rg=${id}" alt="" loading="lazy" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block">`;}
const mmss=ms=>ms?`${Math.floor(ms/60000)}:${String(Math.round(ms%60000/1000)).padStart(2,'0')}`:'';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const id=+new URLSearchParams(location.search).get('id');
const TORD=['excel','si','ok','meh','no'];
function renderAlbum(a){
  if(!a||!a.id){app.innerHTML='No encontrado';return;}
  const tier=`<span class="tiered" style="display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center">${TORD.map(k=>`<span class="tchip" data-tier="${k}" title="${TN[k]}" style="cursor:pointer;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${a.tier_key===k?TC[k][0]:'var(--surface-2)'};color:${a.tier_key===k?TC[k][1]:'var(--text-2)'}">${TN[k]}</span>`).join('')}${a.tier_key?`<span class="tchip" data-tier="" title="Quitar tier" style="cursor:pointer;color:var(--text-2);padding:2px 6px">${window.icon('close',13)}</span>`:''}</span>`;
  const sv=a.album_stars?Math.round(+a.album_stars):0;
  const stars=`<span class="starsed" style="display:inline-flex;align-items:center;gap:1px">${[1,2,3,4,5].map(n=>`<span class="st" data-stars="${n}" title="Valorar ${n}" style="cursor:pointer;color:${n<=sv?'var(--accent)':'var(--muted)'};font-size:17px;line-height:1">★</span>`).join('')}${sv?`<span class="st" data-stars="0" title="Quitar valoración" style="cursor:pointer;color:var(--text-2);font-size:12px;margin-left:4px;display:inline-flex">${window.icon('close',12)}</span>`:''}</span>`;
  const favEd=`<span class="faved" data-fav="${a.is_favorite?0:1}" title="${a.is_favorite?'Quitar de favoritos':'Marcar como favorito'}" style="cursor:pointer;color:${a.is_favorite?'var(--accent)':'var(--text-2)'};font-size:18px;line-height:1">♥</span>`;
  const llEd=`<span class="llater" data-ll="${a.listen_later?0:1}" title="${a.listen_later?'Quitar de escuchar más tarde':'Escuchar más tarde'}" style="cursor:pointer;color:${a.listen_later?'var(--accent)':'var(--text-2)'};display:inline-flex;align-items:center;gap:4px;font-size:13px">${window.icon('lists',15)}${a.listen_later?'En «más tarde»':'Más tarde'}</span>`;
  const genres=(a.genres||[]).map(g=>`<a class="gchip" href="genre.html?name=${encodeURIComponent(g)}">${esc(g)}</a>`).join(' ');
  const artistLink=a.artist_id?`<a href="artist.html?id=${a.artist_id}" style="color:var(--accent)">${esc(a.artist)}</a>`:esc(a.artist);
  const provRef=s=>!s||!s.source_ref?'':(/^https?:/.test(s.source_ref)?` · <a href="${esc(s.source_ref)}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(s.source_ref.replace(/^https?:\/\/(www\.)?/,''))}</a>`:' · '+esc(s.source_ref));
  const aprov=a.about&&a.about_source?('desde '+esc(a.about_source.source)+provRef(a.about_source)):'';
  const about=`<div class="about" id="aboutbox"><div class="prov" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${aprov}</span><span class="aboutedit" style="cursor:pointer;color:var(--accent);font-size:12px;white-space:nowrap">${a.about?'editar reseña':'añadir reseña'}</span></div><div class="abouttext">${a.about?esc(a.about):'<span style="color:var(--text-2)">Sin reseña. Escribe la tuya — tus datos mandan.</span>'}</div></div>`;
  const editions=(a.editions||[]).map(e=>`${esc(e.format||'?')}${e.date?' · '+esc(e.date):''}`).join(' &nbsp;·&nbsp; ');
  const tracks=(a.tracks||[]).length?`<div class="sec">Pistas</div>`+a.tracks.map((t,i)=>`<div class="track"><button class="play" data-idx="${i}" aria-label="Reproducir" title="Reproducir" style="border:none;background:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0 4px;display:inline-flex;align-items:center">${window.icon('play',14)}</button><span class="pos">${t.pos}</span><span style="flex:1;min-width:0">${esc(t.title)}${(t.work||t.composers)?`<div style="font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.work_id?`<a href="work.html?id=${t.work_id}" style="color:var(--text-2)">${esc(t.work||'obra')}</a>`:esc(t.work||'')}${t.composers?` · ${esc(t.composers.replace(/,/g,', '))}`:''}</div>`:''}</span><span class="addtrk" data-tid="${t.trackId}" title="Añadir a una lista" style="cursor:pointer;color:var(--text-2);font-size:14px;padding:0 6px;display:inline-flex;align-items:center">${window.icon('plus',15)}</span><span class="dur">${mmss(t.length_ms)}</span></div>`).join(''):'';
  const INST={'bass':'bajo','electric bass':'bajo eléctrico','double bass':'contrabajo','guitar':'guitarra','acoustic guitar':'guitarra acústica','electric guitar':'guitarra eléctrica','drums':'batería','percussion':'percusión','piano':'piano','keyboards':'teclados','synthesizer':'sintetizador','organ':'órgano','cello':'violonchelo','violin':'violín','viola':'viola','trumpet':'trompeta','trombone':'trombón','saxophone':'saxofón','flute':'flauta','clarinet':'clarinete','harmonica':'armónica','accordion':'acordeón','vibraphone':'vibráfono'};
  const tInst=i=>i?(INST[i.toLowerCase()]||i.toLowerCase()):i;
  const clabel=c=>c.role==='instrumento'&&c.instrument?tInst(c.instrument):(c.role==='voz'&&c.instrument?'voz ('+tInst(c.instrument)+')':c.role);
  const credits=(a.credits||[]).length?`<div class="sec">Créditos</div><div class="credits">`+a.credits.map(c=>`<div class="c"><div class="role">${esc(clabel(c))}</div>${c.artists.map(esc).join(', ')}</div>`).join('')+`</div>`:'';
  app.innerHTML=`
    <div class="hero">
      <div class="cov">${cover(a.id)}</div>
      <div style="flex:1;min-width:240px">
        <div style="color:var(--text-2);font-size:13px">${esc(a.primary_type||'álbum')} · ${a.year||'—'}</div>
        <h1>${esc(a.title)}</h1>
        <div style="font-size:15px">${artistLink}</div>
        ${(a.tracks||[]).length?`<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn-accent" id="playalbum" style="display:inline-flex;align-items:center;gap:6px">${window.icon('play',15)}Reproducir</button><button id="addalbum" style="cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px">${window.icon('plus',15)}Añadir a lista</button></div>`:''}
        <div class="meta">
          <span><span class="k">Tier</span> ${tier}</span>
          <span><span class="k">Valoración</span> ${stars}</span>
          <span><span class="k">Favorito</span> ${favEd}</span>
          <span>${llEd}</span>
          ${a.format?`<span><span class="k">Formato</span> ${esc(a.format)}</span>`:''}
          ${editions?`<span><span class="k">Ediciones</span> ${editions}</span>`:''}
        </div>
        <div>${genres}</div>
        ${a.spotify_enabled?`<div style="margin-top:9px;font-size:13px">${a.spotify_saved?`<span style="color:#1DB954;font-weight:600">● En tu biblioteca de Spotify</span>${a.spotify_url?` · <a href="${esc(a.spotify_url)}" target="_blank" rel="noopener" style="color:var(--text-2)">abrir</a>`:''}`:'<span style="color:var(--text-2)">○ No está en tu biblioteca de Spotify</span>'}</div>`:''}
        <div id="tagbox" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div>
      </div>
    </div>
    ${about}
    ${tracks}
    ${credits}`;
  renderTags(a.tags||[]);
}
function load(){fetch('/api/album?id='+id).then(r=>r.json()).then(renderAlbum).catch(e=>app.innerHTML='error: '+e.message);}
load();
document.addEventListener('escucharrr:changed',load);   // biblioteca en vivo

// ── tags de usuario (etiquetas libres, estilo Roon) ──
function renderTags(tags){
  const box=document.getElementById('tagbox'); if(!box) return;
  box.innerHTML=(tags||[]).map(t=>`<span class="gchip" style="display:inline-flex;align-items:center;gap:5px"><a href="tag.html?name=${encodeURIComponent(t)}" style="color:inherit">${esc(t)}</a><span class="txtag" data-tag="${esc(t)}" title="Quitar etiqueta" style="cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center">${window.icon('close',13)}</span></span>`).join('')
    +`<span class="chip" id="addtag" style="cursor:pointer">${window.icon('plus',13)} etiqueta</span>`;
}
async function tagPost(path,name){ try{ const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({album_id:id,name})}).then(x=>x.json()); if(r&&r.ok) renderTags(r.tags||[]); }catch(e){} }
document.addEventListener('click',e=>{
  const add=e.target.closest('#addtag'); if(add){ const n=prompt('Etiqueta (p. ej. «domingo», «lluvia», «para el coche»):'); if(n&&n.trim()) tagPost('/api/tag/add', n.trim()); return; }
  const rm=e.target.closest('.txtag'); if(rm){ tagPost('/api/tag/remove', rm.dataset.tag); return; }
});

// ── edición/corrección de metadatos ("tus datos mandan": tu valor gana al externo) ──
function editField(field,value){ return fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_type:'release_group',subject_id:id,field,value})}).then(r=>r.json()); }
document.addEventListener('click',e=>{
  const tc=e.target.closest('#app .tchip'); if(tc){ editField('tier',tc.dataset.tier).then(r=>{ if(r.ok){toast(tc.dataset.tier?'Tier actualizado':'Tier quitado');load();}else toast(r.error||'error'); }); return; }
  const sc=e.target.closest('#app .st'); if(sc){ const v=+sc.dataset.stars; editField('stars',v).then(r=>{ if(r.ok){toast(v?'Valoración guardada':'Valoración quitada');load();}else toast(r.error||'error'); }); return; }
  const fc=e.target.closest('#app .faved'); if(fc){ const on=fc.dataset.fav==='1'; editField('favorite',on).then(r=>{ if(r.ok){toast(on?'Añadido a favoritos':'Quitado de favoritos');load();}else toast(r.error||'error'); }); return; }
  const ll=e.target.closest('#app .llater'); if(ll){ const on=ll.dataset.ll==='1'; editField('listen_later',on).then(r=>{ if(r.ok){toast(on?'En «escuchar más tarde»':'Quitado de «más tarde»');load();}else toast(r.error||'error'); }); return; }
  const ae=e.target.closest('#app .aboutedit'); if(ae){ openAboutEditor(); return; }
});
function openAboutEditor(){
  const box=document.getElementById('aboutbox'); if(!box||box.querySelector('textarea'))return;
  const curEl=box.querySelector('.abouttext'); const cur=curEl?curEl.textContent:''; const existing=/Sin reseña/.test(cur)?'':cur;
  const tx=document.createElement('div'); tx.style.marginTop='8px';
  tx.innerHTML=`<textarea id="aboutta" style="width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);box-sizing:border-box"></textarea><div style="margin-top:6px;display:flex;gap:8px"><button id="aboutsave" class="btn-accent" style="padding:6px 14px">Guardar</button><button id="aboutcancel" style="padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer">Cancelar</button></div>`;
  box.appendChild(tx);
  const ta=document.getElementById('aboutta'); ta.value=existing; ta.focus();
  document.getElementById('aboutcancel').onclick=()=>tx.remove();
  document.getElementById('aboutsave').onclick=()=>{ const v=ta.value; editField('about',v).then(r=>{ if(r.ok){toast(v.trim()?'Reseña guardada':'Reseña quitada');load();}else toast(r.error||'error'); }); };
}

// Reproducir: encola el álbum y arranca (el player registra la escucha)
document.addEventListener('click',e=>{
  const b=e.target.closest('.play'); if(b){player.playAlbum(id, +b.dataset.idx); return;}
  if(e.target.closest('#playalbum')){player.playAlbum(id, 0);return;}
  const aa=e.target.closest('#addalbum'); if(aa){pickPlaylist(aa,plid=>addTo(plid,{album_id:id},'Álbum añadido'));return;}
  const at=e.target.closest('.addtrk'); if(at){pickPlaylist(at,plid=>addTo(plid,{track_ids:[+at.dataset.tid]},'Pista añadida'));return;}
});

// ── añadir a lista: popover de selección + toast ──
function addTo(plid,payload,okMsg){fetch('/api/playlist/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:plid,...payload})}).then(r=>r.json()).then(j=>toast(j.ok?okMsg:(j.error||'error'))).catch(()=>toast('error'));}
let pop=null;
function closePop(){if(pop){pop.remove();pop=null;document.removeEventListener('click',onDoc,true);}}
function onDoc(e){if(pop&&!e.target.closest('#plpop')&&!e.target.closest('.addtrk')&&!e.target.closest('#addalbum'))closePop();}
function pickPlaylist(anchor,onPick){
  closePop();
  fetch('/api/playlists').then(r=>r.json()).then(j=>{
    const pls=j.items||[];
    pop=document.createElement('div');pop.id='plpop';
    pop.setAttribute('style','position:absolute;z-index:70;min-width:200px;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;font-size:13px');
    pop.innerHTML=`<div style="padding:6px 8px;color:var(--text-2);font-size:11px">Añadir a…</div>`+
      pls.map(p=>`<div class="plopt" data-id="${p.id}" style="padding:7px 10px;border-radius:7px;cursor:pointer">${esc(p.name)} <span style="color:var(--text-2)">· ${p.n}</span></div>`).join('')+
      `<div class="plnew" style="padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--accent);border-top:1px solid var(--border);margin-top:4px;display:inline-flex;align-items:center;gap:5px">${window.icon('plus',13)}Nueva lista…</div>`;
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect();
    pop.style.top=(window.scrollY+r.bottom+6)+'px';
    pop.style.left=(window.scrollX+Math.min(r.left,window.innerWidth-300))+'px';
    pop.querySelectorAll('.plopt').forEach(o=>o.addEventListener('click',()=>{const pid=+o.dataset.id;closePop();onPick(pid);}));
    pop.querySelector('.plnew').addEventListener('click',()=>{const n=prompt('Nombre de la nueva lista:');if(n&&n.trim()){fetch('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})}).then(x=>x.json()).then(j=>{closePop();if(j.ok)onPick(j.id);});}else closePop();});
    setTimeout(()=>document.addEventListener('click',onDoc,true),0);
    pop.querySelectorAll('.plopt,.plnew').forEach(o=>{o.addEventListener('mouseenter',()=>o.style.background='var(--surface-2)');o.addEventListener('mouseleave',()=>o.style.background='');});
  });
}
let toastT=null;
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('style','position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .15s');document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1800);}
</script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script src="player.js" defer></script>
</body>
</html>
