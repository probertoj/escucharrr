<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — biblioteca</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="search"><input id="q" type="search" placeholder="Buscar artistas, álbumes, pistas…" autocomplete="off"><div id="sdrop" class="sdrop" hidden></div></div>
  <h1>Mi biblioteca</h1>
  <div class="count" id="count">cargando…</div>

  <div class="toolbar">
    <button class="btn-accent" style="display:inline-flex;align-items:center;gap:6px"><span data-icon="play" data-s="15"></span>Reproducir</button>
    <button id="focusbtn">▸ Focus</button>
    <button id="savefocus" title="Guardar el Focus actual como marcador" style="display:inline-flex;align-items:center;gap:6px"><span data-icon="star" data-s="15"></span>Guardar Focus</button>
    <div class="spacer"></div>
    <label style="color:var(--text-2);font-size:13px">Ordenar</label>
    <select id="sort">
      <option value="title">Por título</option>
      <option value="year">Por año</option>
      <option value="artist">Por artista</option>
      <option value="added">Añadido recientemente</option>
      <option value="tier">Por tier</option>
      <option value="rating">Por valoración</option>
      <option value="plays">Más reproducido</option>
      <option value="random">Aleatorio</option>
    </select>
    <input id="filter" type="search" placeholder="Filtrar">
  </div>

  <div class="chips" id="bmbar" style="margin:4px 0"></div>
  <div class="focus" id="focus" hidden><div class="facets" id="facets"></div></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const TC={excel:['#0F6E56','#E1F5EE'],si:['#639922','#EAF3DE'],ok:['#BA7517','#FAEEDA'],meh:['#5F5E5A','#F1EFE8'],no:['#A32D2D','#FCEBEB']};
const TN={excel:'Excel',si:'Sí',ok:'Ok',meh:'Meh',no:'No'}, TR={excel:5,si:4,ok:3,meh:2,no:1};
const PAIRS=[['#0F6E56','#1D9E75'],['#534AB7','#7F77DD'],['#185FA5','#378ADD'],['#854F0B','#BA7517'],['#72243E','#D4537E'],['#5F5E5A','#888780'],['#3B6D11','#639922'],['#993C1D','#D85A30']];
function cover(id){return `<img src="/api/cover?rg=${id}" alt="" loading="lazy" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block">`;}
function stars(s){return s?`<span class="stars">★</span> ${(+s).toFixed(1)}`:'<span style="color:var(--muted)">—</span>';}

const esc0=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let ALBUMS=[];
// Facetas estilo "Focus" de Roon. Booleanas (favorito/más tarde/audio/reproducido) como valores sí/no.
const BOOLK={favorite:'is_favorite',later:'listen_later',audio:'has_audio',played:'played',identified:'identified',versions:'has_versions',hidden:'hidden'};
const facetDefs=[['tier','Tier'],['genre','Género'],['format','Formato'],['bitdepth','Profundidad'],['samplerate','Frecuencia'],['channels','Canales'],['decade','Década'],['added','Añadido'],['lastplayed','Último play'],['plays','Reproducciones'],['type','Tipo'],['tag','Etiqueta'],['favorite','Favoritos'],['later','Escuchar más tarde'],['audio','Audio local'],['played','Reproducido'],['identified','Identificado'],['hasgenre','Con género'],['versions','Con versiones'],['multidisc','Multidisco'],['hidden','Oculto']];
const sel={}; facetDefs.forEach(([k])=>sel[k]={});   // sel[clave][valor] = 'inc' | 'exc'
let minR=null, txt='', yearMin=null, yearMax=null;
// cubo de "añadido" (como el Focus de Roon por fecha de alta): un álbum cae en el tramo más reciente que cumple
const ADDED_BUCKETS=[[30,'Últimos 30 días'],[90,'Últimos 3 meses'],[180,'Últimos 6 meses'],[365,'Último año']];
const ADDED_ORDER=['Últimos 30 días','Últimos 3 meses','Últimos 6 meses','Último año','Hace más de un año'];
function addedBucket(iso){ if(!iso)return null; const d=Date.parse(iso.replace(' ','T')+(/[zZ]|[+-]\d\d:?\d\d$/.test(iso)?'':'Z')); if(isNaN(d))return null; const days=(Date.now()-d)/864e5; for(const[lim,lbl]of ADDED_BUCKETS)if(days<=lim)return lbl; return 'Hace más de un año'; }
function chLabel(n){ return n===1?'Mono':n===2?'Estéreo':n>2?(n+' canales'):null; }
function srLabel(hz){ if(!hz)return null; const k=hz/1000; return (Number.isInteger(k)?k:k.toFixed(1).replace('.',','))+' kHz'; }
function daysAgo(iso){ if(!iso)return null; const d=Date.parse(iso.replace(' ','T')+(/[zZ]|[+-]\d\d:?\d\d$/.test(iso)?'':'Z')); return isNaN(d)?null:(Date.now()-d)/864e5; }
const LASTPLAYED_ORDER=['Hoy','Esta semana','Este mes','Últimos 3 meses','Últimos 6 meses','Este año','Hace más de un año'];
function lastPlayedBucket(iso){ const d=daysAgo(iso); if(d==null)return null; return d<=1?'Hoy':d<=7?'Esta semana':d<=30?'Este mes':d<=90?'Últimos 3 meses':d<=180?'Últimos 6 meses':d<=365?'Este año':'Hace más de un año'; }
const PLAYS_ORDER=['Una vez','Pocas (2–5)','Varias (6–10)','Muchas (11+)'];
function playBucket(n){ return !n?null:n===1?'Una vez':n<=5?'Pocas (2–5)':n<=10?'Varias (6–10)':'Muchas (11+)'; }
function avals(a,key){
  if(key==='tier')return a.tier_key?[a.tier_key]:[];
  if(key==='genre')return a.genres||[];
  if(key==='tag')return a.tags||[];
  if(key==='decade'){const y=parseInt(a.year,10);return (y>=1000&&y<=9999)?[String(Math.floor(y/10)*10)+'s']:[];}
  if(key==='type')return a.primary_type?[a.primary_type.toLowerCase()]:[];
  if(key==='format')return a.format?[a.format]:[];
  if(key==='bitdepth')return a.bit_depth?[a.bit_depth+' bits']:[];
  if(key==='samplerate'){const l=srLabel(a.sample_rate);return l?[l]:[];}
  if(key==='channels'){const l=chLabel(a.channels);return l?[l]:[];}
  if(key==='added'){const b=addedBucket(a.added);return b?[b]:[];}
  if(key==='lastplayed'){const b=lastPlayedBucket(a.last_played);return b?[b]:[];}
  if(key==='plays'){const b=playBucket(a.play_count);return b?[b]:[];}
  if(key==='hasgenre')return [(a.genres&&a.genres.length)?'sí':'no'];
  if(key==='multidisc')return [(a.media_count>1)?'sí':'no'];
  if(BOOLK[key])return [a[BOOLK[key]]?'sí':'no'];
  return [];}
function vlabel(key,v){ if(key==='tier')return TN[v]; if(BOOLK[key]||key==='hasgenre'||key==='multidisc')return v==='sí'?'Sí':'No'; return v; }
function valsOf(key){const m={};ALBUMS.forEach(a=>avals(a,key).forEach(v=>m[v]=(m[v]||0)+1));return m;}
function matchFacet(a,key){
  const s=sel[key],inc=[],exc=[]; for(const v in s){(s[v]==='exc'?exc:inc).push(v);}
  if(!inc.length&&!exc.length)return true;
  const vs=avals(a,key);
  if(inc.length&&!vs.some(v=>inc.includes(v)))return false;   // incluir: debe tener alguno (OR)
  if(exc.length&&vs.some(v=>exc.includes(v)))return false;    // excluir: no debe tener ninguno
  return true;}
function passes(a){
  if(a.hidden && (sel.hidden||{})['sí']!=='inc')return false;   // los ocultos no aparecen salvo que incluyas "Oculto=Sí"
  for(const[k]of facetDefs)if(!matchFacet(a,k))return false;
  if(minR!=null&&!(a.album_stars>=minR))return false;
  if(yearMin!=null||yearMax!=null){const y=parseInt(a.year,10);if(!(y>=1000&&y<=9999))return false;if(yearMin!=null&&y<yearMin)return false;if(yearMax!=null&&y>yearMax)return false;}
  if(txt&&!((a.title+' '+a.artist).toLowerCase().includes(txt)))return false;
  return true;}

const ffilters={};   // texto de filtro por faceta (clave -> texto), se conserva al repintar
function renderFacets(){
  const box=document.getElementById('facets'); if(!box)return;
  let h=facetDefs.map(([k,label])=>{const m=valsOf(k);const keys=Object.keys(m);if(!keys.length)return '';
    const vs=keys.sort((x,y)=>k==='tier'?TR[y]-TR[x]:k==='decade'?y.localeCompare(x):k==='added'?(ADDED_ORDER.indexOf(x)-ADDED_ORDER.indexOf(y)):k==='lastplayed'?(LASTPLAYED_ORDER.indexOf(x)-LASTPLAYED_ORDER.indexOf(y)):k==='plays'?(PLAYS_ORDER.indexOf(x)-PLAYS_ORDER.indexOf(y)):k==='bitdepth'?(parseInt(y)-parseInt(x)):k==='samplerate'?(parseFloat(String(y).replace(',','.'))-parseFloat(String(x).replace(',','.'))):m[y]-m[x]);
    const search=keys.length>8?`<input class="ffilter" data-k="${k}" placeholder="filtrar…" autocomplete="off">`:'';
    return `<div class="fcol"><h4><span>${label}</span><span class="fcount">${keys.length}</span></h4>${search}<div class="fvals">`+vs.map(v=>{const st=sel[k][v]||'';
      return `<div class="fv ${st==='inc'?'on':st==='exc'?'exc':''}" data-k="${k}" data-v="${esc0(v)}" data-lbl="${esc0(String(vlabel(k,v)).toLowerCase())}" title="Clic: incluir → excluir → quitar">${st==='exc'?'<span class="fvsign">−</span>':''}<span>${esc0(vlabel(k,v))}</span><span class="n">${m[v]}</span></div>`;}).join('')+`</div></div>`;}).join('');
  const rm=[[5,'5★'],[4,'4★ o más'],[3,'3★ o más'],[2,'2★ o más'],[1,'1★ o más']];
  h+=`<div class="fcol"><h4><span>Valoración</span></h4><div class="fvals">`+rm.map(([v,l])=>{const n=ALBUMS.filter(a=>a.album_stars>=v).length;const on=minR===v;
    return `<div class="fv ${on?'on':''}" data-rat="${v}"><span>${l}</span><span class="n">${n}</span></div>`;}).join('')+`</div></div>`;
  // Año: rango exacto desde/hasta (como el "Released" de Roon, no solo década). Placeholders = min/máx reales.
  let yLo='', yHi=''; for(const a of ALBUMS){const y=parseInt(a.year,10);if(y>=1000&&y<=9999){if(yLo===''||y<yLo)yLo=y;if(yHi===''||y>yHi)yHi=y;}}
  h+=`<div class="fcol"><h4><span>Año</span></h4><div class="fvals yearbox">
    <label class="yrow"><span>Desde</span><input type="number" class="yinput" id="ymin" value="${yearMin!=null?yearMin:''}" placeholder="${yLo}" min="0" max="9999" inputmode="numeric"></label>
    <label class="yrow"><span>Hasta</span><input type="number" class="yinput" id="ymax" value="${yearMax!=null?yearMax:''}" placeholder="${yHi}" min="0" max="9999" inputmode="numeric"></label>
  </div></div>`;
  box.innerHTML=h;
  applyFfilters();}
function readYearInputs(){const g=id=>{const v=parseInt((document.getElementById(id)||{}).value,10);return (v>=0&&v<=9999)?v:null;};yearMin=g('ymin');yearMax=g('ymax');if(yearMin!=null&&yearMax!=null&&yearMin>yearMax){const t=yearMin;yearMin=yearMax;yearMax=t;}}
function applyFfilters(){document.querySelectorAll('#facets .ffilter').forEach(f=>{const q=ffilters[f.dataset.k]||'';f.value=q;filterCol(f.closest('.fcol'),q);});}
function filterCol(col,q){q=q.toLowerCase();col.querySelectorAll('.fv').forEach(fv=>{fv.style.display=(!q||(fv.dataset.lbl||'').includes(q))?'':'none';});}
document.getElementById('facets').addEventListener('input',e=>{const f=e.target.closest('.ffilter');if(!f)return;ffilters[f.dataset.k]=f.value;filterCol(f.closest('.fcol'),f.value);});
// rango de año: se aplica al confirmar (blur/Enter), no en cada tecla
document.getElementById('facets').addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('yinput')){readYearInputs();render();}});
document.getElementById('facets').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('yinput')){e.preventDefault();readYearInputs();render();}});
function renderChips(){
  const box=document.getElementById('chips'); const c=[];
  facetDefs.forEach(([k])=>{const s=sel[k];for(const v in s)c.push([k,v,(s[v]==='exc'?'≠ ':'')+vlabel(k,v),s[v]]);});
  if(minR!=null)c.push(['rat',String(minR),minR+'★ o más','inc']);
  if(yearMin!=null||yearMax!=null)c.push(['year','',(yearMin!=null?yearMin:'…')+'–'+(yearMax!=null?yearMax:'…'),'inc']);
  box.innerHTML=c.length?c.map(x=>`<span class="chip ${x[3]==='exc'?'excchip':''}" data-ck="${x[0]}" data-cv="${esc0(x[1])}">${esc0(x[2])} ${window.icon('close',12)}</span>`).join('')+`<span class="chip" data-clear="1" style="background:var(--surface-2);color:var(--text-2)">Limpiar</span>`:'';}
// ── rejilla virtualizada ──────────────────────────────────────────────
// Con 25k+ álbumes no se puede pintar todo el grid: dibujamos solo las filas
// visibles (+ buffer) dentro de una ventana absoluta, sobre un contenedor
// dimensionado a la altura total para que el scroll y la barra sean reales.
let VIS=[];   // lista filtrada + ordenada actual
const VG={cols:0,colW:0,cardH:0,rowH:0,gx:18,gy:26,min:158,buf:3,raf:0,refined:false};
function cardHTML(a){return `<a class="card" href="album.html?id=${a.id}">
    <div class="cov">${cover(a.id)}
      ${a.tier_key?`<span class="badge" style="background:${TC[a.tier_key][0]};color:${TC[a.tier_key][1]}">${TN[a.tier_key]}</span>`:''}
      ${a.is_favorite?'<span class="fav">♥</span>':''}</div>
    <div class="t">${esc0(a.title)}</div><div class="s">${esc0(a.artist)} · ${a.year||'—'}</div></a>`;}
function vMeasure(){
  const grid=document.getElementById('grid');
  const w=grid.clientWidth||grid.getBoundingClientRect().width||1;
  VG.cols=Math.max(1,Math.floor((w+VG.gx)/(VG.min+VG.gx)));
  VG.colW=(w-(VG.cols-1)*VG.gx)/VG.cols;
  if(!VG.refined)VG.cardH=VG.colW+64;   // estimación; se afina midiendo una tarjeta real tras pintar
  VG.rowH=VG.cardH+VG.gy;}
function vPaint(){
  const grid=document.getElementById('grid'),win=document.getElementById('gridwin'); if(!win)return;
  const n=VIS.length,rows=Math.ceil(n/VG.cols);
  grid.style.height=(rows*VG.rowH)+'px';
  const docTop=grid.getBoundingClientRect().top+window.scrollY, rel=window.scrollY-docTop;
  let firstRow=Math.max(0,Math.floor(rel/VG.rowH)-VG.buf);
  const visRows=Math.ceil(window.innerHeight/VG.rowH)+VG.buf*2;
  const lastRow=Math.min(rows,firstRow+visRows);
  const start=firstRow*VG.cols, end=Math.min(n,lastRow*VG.cols);
  win.style.gridTemplateColumns='repeat('+VG.cols+',minmax(0,1fr))';
  win.style.top=(firstRow*VG.rowH)+'px';   // posicionar por 'top' (no transform): evita una capa de compositor gigante que el navegador deja de pintar en scrolls muy largos
  win.innerHTML=VIS.slice(start,end).map(cardHTML).join('');
  if(!VG.refined&&win.firstElementChild){   // afinar altura de fila con una tarjeta ya renderizada
    const h=win.firstElementChild.getBoundingClientRect().height;
    if(h>0){VG.cardH=h;VG.rowH=h+VG.gy;VG.refined=true;vPaint();}}}
function vSchedule(){if(VG.raf)return;VG.raf=requestAnimationFrame(()=>{VG.raf=0;vPaint();});}
window.addEventListener('scroll',vSchedule,{passive:true});
window.addEventListener('resize',()=>{VG.refined=false;vMeasure();vPaint();});
function render(){
  let l=ALBUMS.filter(passes);const s=document.getElementById('sort').value;
  l.sort((a,b)=>s==='year'?(b.year||0)-(a.year||0):s==='artist'?a.artist.localeCompare(b.artist):s==='tier'?(TR[b.tier_key]||0)-(TR[a.tier_key]||0):s==='rating'?(b.album_stars||0)-(a.album_stars||0):s==='added'?String(b.added||'').localeCompare(String(a.added||'')):s==='plays'?((b.play_count||0)-(a.play_count||0)):s==='random'?(a._rnd-b._rnd):a.title.localeCompare(b.title));
  VIS=l;
  document.getElementById('count').textContent=l.length===ALBUMS.length?`${ALBUMS.length} álbumes`:`${l.length} de ${ALBUMS.length} álbumes`;
  const grid=document.getElementById('grid');
  if(!document.getElementById('gridwin'))grid.innerHTML='<div class="gridwin" id="gridwin"></div>';
  window.scrollTo(0,0);   // al cambiar filtro/orden/Focus volvemos arriba
  vMeasure();vPaint();
  renderFacets();renderChips();}
function cycle(key,v){const s=sel[key];const cur=s[v];if(!cur)s[v]='inc';else if(cur==='inc')s[v]='exc';else delete s[v];}

document.addEventListener('click',e=>{
  const fv=e.target.closest('.fv');
  if(fv){if(fv.dataset.rat!==undefined){const v=+fv.dataset.rat;minR=minR===v?null:v;}else cycle(fv.dataset.k,fv.dataset.v);render();return;}
  const ch=e.target.closest('#chips .chip');
  if(ch){if(ch.dataset.clear){facetDefs.forEach(([k])=>sel[k]={});minR=null;yearMin=null;yearMax=null;}else if(ch.dataset.ck==='rat')minR=null;else if(ch.dataset.ck==='year'){yearMin=null;yearMax=null;}else if(sel[ch.dataset.ck])delete sel[ch.dataset.ck][ch.dataset.cv];render();return;}
});
const focusbtn=document.getElementById('focusbtn');
focusbtn.onclick=()=>{const fp=document.getElementById('focus');fp.hidden=!fp.hidden;focusbtn.textContent=(fp.hidden?'▸':'▾')+' Focus';};
document.getElementById('sort').onchange=render;
document.getElementById('filter').oninput=(e)=>{txt=e.target.value.toLowerCase().trim();render();};

function load(){fetch('/api/library').then(r=>r.json()).then(d=>{d.forEach(a=>a._rnd=Math.random());ALBUMS=d;render();}).catch(e=>document.getElementById('count').textContent='error: '+e.message);}
load();
document.addEventListener('escucharrr:changed',load);   // biblioteca en vivo

// ── marcadores: guardar/aplicar un Focus (estilo Roon) ──
function currentFocus(){const o={};for(const k in sel)if(Object.keys(sel[k]).length)o[k]={...sel[k]};return{sel:o,minR,yearMin,yearMax,sort:document.getElementById('sort').value};}
function applyFocus(st){
  facetDefs.forEach(([k])=>sel[k]={});minR=null;yearMin=null;yearMax=null;
  if(st){const src=st.sel||st.active;   // compat: marcadores viejos usaban {active:{clave:[valores]}}
    if(src)for(const k in src){if(sel[k]){const v=src[k];if(Array.isArray(v))v.forEach(x=>sel[k][x]='inc');else Object.assign(sel[k],v);}}
    minR=st.minR!=null?st.minR:null;yearMin=st.yearMin!=null?st.yearMin:null;yearMax=st.yearMax!=null?st.yearMax:null; if(st.sort)document.getElementById('sort').value=st.sort;}
  txt='';document.getElementById('filter').value='';render();
  const fp=document.getElementById('focus'); if(fp.hidden)focusbtn.click();}
function loadBookmarks(){fetch('/api/bookmarks').then(r=>r.json()).then(j=>{const bms=j.items||[];const bar=document.getElementById('bmbar');bar._bms=bms;bar.innerHTML=bms.length?'<span style="color:var(--text-2);font-size:12px;margin-right:4px">Marcadores:</span>'+bms.map(b=>`<span class="chip bm" data-id="${b.id}" style="cursor:pointer">${window.icon('star',13)} ${esc0(b.name)} <span class="bmx" data-del="${b.id}" title="Borrar" style="color:var(--text-2);display:inline-flex">${window.icon('close',12)}</span></span>`).join(''):'';}).catch(()=>{});}
document.getElementById('savefocus').addEventListener('click',()=>{const n=prompt('Nombre del marcador (guarda el Focus actual):');if(n&&n.trim())fetch('/api/bookmarks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim(),state:currentFocus()})}).then(r=>r.json()).then(()=>loadBookmarks());});
document.getElementById('bmbar').addEventListener('click',e=>{const del=e.target.closest('.bmx');if(del){e.stopPropagation();fetch('/api/bookmark/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+del.dataset.del})}).then(()=>loadBookmarks());return;}const bm=e.target.closest('.bm');if(bm){const bar=document.getElementById('bmbar');const b=(bar._bms||[]).find(x=>x.id===+bm.dataset.id);if(b)applyFocus(b.state);}});
loadBookmarks();

// Buscador instantáneo (FTS5 por prefijo)
(function(){
  const q=document.getElementById('q'), drop=document.getElementById('sdrop');
  const KINDS=[['artist','Artistas'],['album','Álbumes'],['track','Pistas']];
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function avatar(r){
    if(r.kind==='artist'){const c=['#534AB7','#0F6E56','#993C1D','#185FA5'][r.subject_id%4];return `<div class="savatar" style="border-radius:50%;background:${c}">${esc((r.name||'?').slice(0,2).toUpperCase())}</div>`;}
    const p=PAIRS[((r.album_id||r.subject_id))%PAIRS.length];return `<div class="savatar"><svg viewBox="0 0 34 34" width="34" height="34"><rect width="34" height="34" fill="${p[0]}"/><circle cx="24" cy="12" r="7" fill="#FAC775"/></svg></div>`;
  }
  const href=r=>r.kind==='artist'?`artist.html?id=${r.subject_id}`:(r.album_id?`album.html?id=${r.album_id}`:null);
  let t; const run=()=>{
    const v=q.value.trim(); if(!v){drop.hidden=true;return;}
    fetch('/api/search?q='+encodeURIComponent(v)+'&n=15').then(r=>r.json()).then(res=>{
      if(!res.length){drop.innerHTML='<div class="shdr">Sin resultados para «'+esc(v)+'»</div>';drop.hidden=false;return;}
      let h='<div class="shdr">INSTANTÁNEA · índice por prefijo</div>';
      KINDS.forEach(([k,label])=>{const g=res.filter(r=>r.kind===k).slice(0,4);if(!g.length)return;
        h+='<div class="skind">'+label+'</div>'+g.map(r=>{const u=href(r);const inner=avatar(r)+'<div><div class="nm">'+esc(r.name)+'</div><div class="sub">'+label.slice(0,-1)+'</div></div>';
          return u?`<a class="sr" href="${u}">${inner}</a>`:`<div class="sr">${inner}</div>`;}).join('');});
      h+='<div class="seeall" data-q="'+esc(v)+'">Ver todos los resultados</div>';
      drop.innerHTML=h;drop.hidden=false;
    });
  };
  q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(run,120);});
  q.addEventListener('focus',()=>{if(q.value.trim())run();});
  drop.addEventListener('click',e=>{const s=e.target.closest('.seeall');if(s)location.href='search.html?q='+encodeURIComponent(s.dataset.q);});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))drop.hidden=true;});
})();
</script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script src="player.js" defer></script>
</body>
