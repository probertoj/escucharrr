<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — lanzamientos</title>
<link rel="stylesheet" href="styles.css">
<style>
.tabs{display:flex;gap:8px;margin:4px 0 14px}
.tabs button{font-size:13px;padding:6px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.dayhdr{font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.rel{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.rel .cov{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;background:var(--surface-2)}
.rel .cov img{width:100%;height:100%;object-fit:cover;display:block}
.rel .ti{flex:1;min-width:0}
.rel .ti .a{font-size:14px;font-weight:500}
.rel .ti .b{font-size:12.5px;color:var(--text-2)}
.rel .act{display:flex;gap:8px;align-items:center}
.pill{font-size:11px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--text-2)}
.pill.own{background:var(--accent-bg);color:var(--accent)}
.btn-want{cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.note{background:var(--surface-2);border-radius:12px;padding:16px 18px;color:var(--text-2);font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:28px;margin-bottom:2px">Lanzamientos</h1>
  <div style="color:var(--text-2);font-size:14px;margin-bottom:12px">Novedades de los artistas que sigues en <b>Liderarrr</b> y por afinidad. Lo que no tienes, márcalo <b>«Quiero»</b> y Liderarrr lo buscará.</div>
  <div class="tabs" id="tabs"><button data-t="tracked" class="on">De tus artistas</button><button data-t="radar">Por afinidad</button></div>
  <div id="app">cargando…</div>
</div>

<script src="player.js" defer></script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');
const api = (p, opt) => fetch('/api/liderarrr/'+p, opt).then(r=>r.json());
// matchKey de Liderarrr (compacto) para marcar lo ya deseado
const normName = s => String(s||'').normalize('NFD').toLowerCase().replace(/[^a-z0-9]+/g,'');
const EDIT=/(deluxe|expanded|remaster|anniversary|edition|reissue|re-?master|mono|stereo|bonus|special|version|explicit|flac|mp3|vinyl|\d{2,3}\s*bit|\d{2,3}(\.\d)?\s*khz|hi-?res|24-?96|16-?44)/i;
function cleanTitle(t){ t=String(t||'').trim(); for(;;){ const m=t.match(/[\[(]([^\])]*)[)\]]\s*$/); if(!m||(!/\d{4}/.test(m[1])&&!EDIT.test(m[1]))) break; t=t.slice(0,m.index).trim(); } return normName(t.replace(/\s+[-–—]\s*\d{4}\s*$/,'')); }
const matchKey=(a,t)=>normName(a)+'::'+cleanTitle(t);
const fmtDate = d => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||''); if(!m) return ''; return m[3]+'/'+m[2]+'/'+m[1]; };

let TAB='tracked', WANT={};
async function loadWant(){ try{ WANT = await api('wanted/keys'); if(WANT&&WANT.ok===false) WANT={}; }catch(e){ WANT={}; } }

function relRow(r){
  const owned = r.owned;
  const mk = matchKey(r.artist, r.title);
  const wanted = WANT[mk];
  const cover = r.cover ? `<img src="${esc(r.cover)}" alt="" loading="lazy">` : '';
  const meta = [r.record_type&&r.record_type!=='album'?esc(r.record_type):'', r.reason?esc(r.reason):(r.affinity?('afinidad '+r.affinity):'' )].filter(Boolean).join(' · ');
  let act;
  if (owned) act = '<span class="pill own">en tu biblioteca</span>';
  else if (wanted) act = `<span class="pill" style="background:var(--accent-bg);color:var(--accent)">${wanted.status==='owned'?'conseguido':wanted.status==='grabbed'?'pedido':'vigilando'}</span>`;
  else act = `<span class="btn-want" data-artist="${esc(r.artist)}" data-title="${esc(r.title)}" data-date="${esc(r.release_date||'')}" data-cover="${esc(r.cover||'')}">${window.icon('want',15)}Quiero</span>`;
  const link = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--text-2);display:inline-flex" title="Abrir en Deezer">${window.icon('chevron-right',16)}</a>` : '';
  return `<div class="rel"><div class="cov">${cover}</div><div class="ti"><div class="a">${esc(r.title)}</div><div class="b">${esc(r.artist)}${meta?' · '+meta:''}</div></div><div class="act">${act}${link}</div></div>`;
}

function render(list){
  if (!Array.isArray(list)){ app.innerHTML = `<div class="note">No hay Liderarrr conectado. Ve a <a href="settings.html">Ajustes → Servicios</a> y pon su URL.</div>`; return; }
  if (!list.length){ app.innerHTML = '<div class="note">Nada por ahora. En Liderarrr, sigue artistas y pulsa «refrescar novedades».</div>'; return; }
  const today = new Date().toISOString().slice(0,10);
  const up = list.filter(r=>(r.release_date||'')>today).sort((a,b)=>(a.release_date||'').localeCompare(b.release_date||''));
  const past = list.filter(r=>!((r.release_date||'')>today)).sort((a,b)=>(b.release_date||'').localeCompare(a.release_date||''));
  let h='';
  if (up.length){ h += `<div class="dayhdr">Próximamente</div>` + up.map(relRow).join(''); }
  if (past.length){ h += `<div class="dayhdr">Recientes</div>` + past.map(relRow).join(''); }
  app.innerHTML = h;
  app.querySelectorAll('.btn-want').forEach(el => el.onclick = async () => {
    el.style.pointerEvents='none'; el.textContent='…';
    try { const r = await api('wanted',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artist:el.dataset.artist,title:el.dataset.title,release_date:el.dataset.date||null,cover:el.dataset.cover||null,origin:'calendario'})});
      if (r && (r.ok||r.match_key)) el.outerHTML = '<span class="pill" style="background:var(--accent-bg);color:var(--accent)">vigilando</span>';
      else { el.style.pointerEvents='auto'; el.innerHTML = window.icon('want',15)+'Quiero'; }
    } catch(e){ el.style.pointerEvents='auto'; el.innerHTML = window.icon('want',15)+'Quiero'; }
  });
}

async function load(){
  app.innerHTML='cargando…';
  await loadWant();
  let list;
  try { list = await api(TAB==='tracked' ? 'newreleases?limit=200' : 'globalreleases?days=30'); } catch(e){ list=null; }
  render(list);
}
document.getElementById('tabs').addEventListener('click', e => { const b=e.target.closest('[data-t]'); if(!b) return; TAB=b.dataset.t; [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b)); load(); });
load();
</script>
</body>
</html>
