<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>escucharrr — artista</title>
<link rel="stylesheet" href="styles.css">
<style>
.ahero{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.ahero .ava{width:132px;height:132px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:600;font-family:var(--serif);box-shadow:var(--shadow-lg)}
.ahero h1{font-size:36px;margin:3px 0 2px}
.appears{list-style:none;padding:0;margin:0}
.appears li{display:flex;gap:12px;align-items:baseline;padding:11px 10px;margin:0 -10px;border-radius:9px;border-bottom:1px solid var(--border);transition:background .1s}
.appears li:hover{background:var(--surface-2)}
.appears .yr{color:var(--muted);width:46px;flex:none;font-variant-numeric:tabular-nums}
.appears .roles{color:var(--text-2);font-size:13px}
.toptracks{list-style:none;padding:0;margin:0}
.toptracks li{display:flex;gap:12px;align-items:center;padding:9px 10px;margin:0 -10px;border-radius:9px;border-bottom:1px solid var(--border);transition:background .1s}
.toptracks li:hover{background:var(--surface-2)}
.toptracks .tp-n{color:var(--muted);width:22px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.toptracks .tp-play{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:50%;cursor:pointer}
.toptracks .tp-play:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.toptracks .tp-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toptracks .tp-ti{font-weight:600}
.toptracks .tp-pc{color:var(--muted);flex:none;font-size:12.5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:14px"><a href="/" style="color:var(--accent);display:inline-flex;align-items:center;gap:5px"><span data-icon="arrow-left" data-s="15"></span>Biblioteca</a></div>
  <div id="app">cargando…</div>
</div>

<script>
const TC={excel:['#0F6E56','#E1F5EE'],si:['#639922','#EAF3DE'],ok:['#BA7517','#FAEEDA'],meh:['#5F5E5A','#F1EFE8'],no:['#A32D2D','#FCEBEB']},TN={excel:'Excel',si:'Sí',ok:'Ok',meh:'Meh',no:'No'};
const PAIRS=[['#0F6E56','#1D9E75'],['#534AB7','#7F77DD'],['#185FA5','#378ADD'],['#854F0B','#BA7517'],['#72243E','#D4537E'],['#5F5E5A','#888780'],['#3B6D11','#639922'],['#993C1D','#D85A30']];
const AVA=['#534AB7','#0F6E56','#993C1D','#185FA5','#72243E','#3B6D11'];
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function cover(id){return `<img src="/api/cover?rg=${id}" alt="" loading="lazy" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block">`;}
function albumCard(a){return `<a class="card" href="album.html?id=${a.id}">
  <div class="cov">${cover(a.id)}
    ${a.tier_key?`<span class="badge" style="background:${TC[a.tier_key][0]};color:${TC[a.tier_key][1]}">${TN[a.tier_key]}</span>`:''}
    ${a.is_favorite?'<span class="fav">♥</span>':''}</div>
  <div class="t">${esc(a.title)}</div><div class="s">${esc(a.primary_type||'álbum')} · ${a.year||'—'}</div></a>`;}

const id=+new URLSearchParams(location.search).get('id');
const TORD=['excel','si','ok','meh','no'];
let rawBio='';   // markdown crudo de TU bio (para el editor; el mostrado va renderizado)
let bios=[], bioIdx=0;   // fuentes de biografía (tuya + Wikipedia) y la seleccionada
const mdRender=s=>window.mdToHtml?window.mdToHtml(s):esc(s);
const _refUrl=r=>!r?'':(/^https?:/.test(r)?' · <a href="'+esc(r)+'" target="_blank" rel="noopener" style="color:var(--text-2)">'+esc(r.replace(/^https?:\/\/(www\.)?/,''))+'</a>':' · '+esc(r));
// cambia la fuente de bio mostrada (como el selector de reseñas del álbum)
function showBio(i){ const b=bios[i]; if(!b)return; bioIdx=i;
  const bt=document.querySelector('#app .biotext'); if(bt)bt.innerHTML=mdRender(b.text);
  const pv=document.getElementById('bioprov'); if(pv)pv.innerHTML='desde '+esc(b.source)+_refUrl(b.ref);
  document.querySelectorAll('#app .biosrc').forEach(el=>{ const on=+el.dataset.i===i; el.classList.toggle('on',on); el.style.background=on?'var(--accent-bg)':'var(--surface-2)'; el.style.color=on?'var(--accent)':'var(--text-2)'; });
  applyBioCollapse(); }
// si el artista no tiene bio editorial, la trae de Wikipedia (inglés) bajo demanda y recarga
let _edTried=false;
async function ensureEditorial(a){ if(_edTried||!a||a.has_editorial) return; _edTried=true;
  try{ const r=await fetch('/api/artist/editorial?id='+id).then(x=>x.json()); if(r&&r.ok&&r.bio){ load(); } else { const w=document.getElementById('biowait'); if(w)w.textContent='Sin biografía en Wikipedia. Puedes escribir la tuya.'; } }
  catch(e){ const w=document.getElementById('biowait'); if(w)w.textContent='No se pudo cargar la biografía.'; } }
function renderArtist(a){
  if(!a||!a.id){app.innerHTML='No encontrado';return;}
  window.__artist=a; idealLoaded=false;
  document.title='escucharrr — '+a.name;
  const ava=AVA[a.id%AVA.length];
  const sub=[a.type,a.country,a.founded&&('desde '+a.founded)].filter(Boolean).join(' · ');
  const genres=(a.genres||[]).map(g=>`<a class="gchip" href="genre.html?name=${encodeURIComponent(g.name)}">${esc(g.name)}</a>`).join(' ');
  const provRef=s=>!s||!s.source_ref?'':(/^https?:/.test(s.source_ref)?` · <a href="${esc(s.source_ref)}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(s.source_ref.replace(/^https?:\/\/(www\.)?/,''))}</a>`:' · '+esc(s.source_ref));
  const tier=`<span class="tiered" style="display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center">${TORD.map(k=>`<span class="tchip" data-tier="${k}" title="${TN[k]}" style="cursor:pointer;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${a.tier_key===k?TC[k][0]:'var(--surface-2)'};color:${a.tier_key===k?TC[k][1]:'var(--text-2)'}">${TN[k]}</span>`).join('')}${a.tier_key?`<span class="tchip" data-tier="" title="Quitar tier" style="cursor:pointer;color:var(--text-2);padding:2px 6px">${window.icon('close',13)}</span>`:''}</span>`;
  // Biografía con selector de FUENTE: tu bio (editable; manda) + Wikipedia (editorial, inglés por defecto).
  bios=a.bios||[]; bioIdx=0; rawBio=a.rawUserBio||'';   // el editor edita SIEMPRE la tuya
  const refUrl=r=>!r?'':(/^https?:/.test(r)?` · <a href="${esc(r)}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(r.replace(/^https?:\/\/(www\.)?/,''))}</a>`:' · '+esc(r));
  const bsrcSel=bios.length>1?`<span class="biosrcs" style="display:inline-flex;gap:6px;flex-wrap:wrap">${bios.map((b,i)=>`<span class="biosrc${i===0?' on':''}" data-i="${i}" style="cursor:pointer;font-size:11px;padding:2px 9px;border-radius:999px;background:${i===0?'var(--accent-bg)':'var(--surface-2)'};color:${i===0?'var(--accent)':'var(--text-2)'}">${esc(b.label)}</span>`).join('')}</span>`:'';
  const b0=bios[0];
  const bprov0=b0?('desde '+esc(b0.source)+refUrl(b0.ref)):'';
  const bioInner=b0?mdRender(b0.text):(a.has_editorial?'<span style="color:var(--text-2)">Sin biografía.</span>':'<span style="color:var(--text-2)" id="biowait">Buscando biografía en Wikipedia…</span>');
  const bio=`<div class="about" id="biobox"><div class="prov" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${bsrcSel}<span id="bioprov" style="color:var(--text-2)">${bprov0}</span></span><span class="bioedit" style="cursor:pointer;color:var(--accent);font-size:12px;white-space:nowrap">${rawBio?'editar tu bio':'añadir tu bio'}</span></div><div class="biotext">${bioInner}</div><div class="revtoggle" hidden></div></div>`;
  // Pestañas estilo Roon: discografía (artista principal) / apariciones (interpreta en otros) /
  // producción (produce, mezcla, arregla…) / obras (compositor). Solo se muestran las que tienen contenido.
  const appearsList=list=>`<ul class="appears">`+list.map(x=>`<li><span class="yr">${x.year||'—'}</span><span style="flex:1"><a href="album.html?id=${x.id}" style="color:var(--accent)">${esc(x.title)}</a> <span style="color:var(--text-2)">· ${esc(x.artist||'')}</span>${x.roles&&x.roles.length?`<div class="roles">${x.roles.map(esc).join(' · ')}</div>`:''}</span></li>`).join('')+`</ul>`;
  const PROD_RE=/produc|ingenier|engineer|mezcl|mix|master|arregl|arrang|grab|record/i;
  const appAll=a.appears||[];
  const appProd=appAll.filter(x=>(x.roles||[]).some(r=>PROD_RE.test(r)));
  const appPerf=appAll.filter(x=>!(x.roles||[]).some(r=>PROD_RE.test(r)));
  const tabs=[];
  if((a.albums||[]).length) tabs.push(['disco','Discografía',a.albums.length,`<div class="grid">${a.albums.map(albumCard).join('')}</div>`]);
  // Más escuchadas (Roon: artist top tracks): grabaciones del artista por nº de reproducciones.
  const top=a.topTracks||[]; window.TOP=top;
  const topList=list=>`<ol class="toptracks">`+list.map((x,i)=>`<li><span class="tp-n">${i+1}</span><button class="tp-play" data-ti="${i}" title="Reproducir">${window.icon('play',14)}</button><span class="tp-t"><span class="tp-ti">${esc(x.title)}</span> <a href="album.html?id=${x.rgid}" style="color:var(--text-2)">${esc(x.album)}</a></span><span class="tp-pc">${x.pc} ${x.pc===1?'escucha':'escuchas'}</span></li>`).join('')+`</ol>`;
  if(top.length) tabs.push(['top','Más escuchadas',top.length,topList(top)]);
  if(appPerf.length) tabs.push(['apar','Apariciones',appPerf.length,appearsList(appPerf)]);
  if(appProd.length) tabs.push(['prod','Producción',appProd.length,appearsList(appProd)]);
  // Colaboraciones a nivel de PISTA (Roon: view_all_collaboration_tracks): pistas suyas en álbumes de otro.
  const collab=a.collabTracks||[];
  const collabList=list=>`<ul class="appears">`+list.map(x=>`<li><span class="yr">${x.disc&&x.disc>1?('D'+x.disc+'·'):''}${x.pos||''}</span><span style="flex:1"><a href="album.html?id=${x.rgid}" style="color:var(--accent)">${esc(x.title)}</a> <span style="color:var(--text-2)">· ${esc(x.album)}${x.album_artist?(' — '+esc(x.album_artist)):''}</span></span></li>`).join('')+`</ul>`;
  if(collab.length) tabs.push(['colab','Colaboraciones',collab.length,collabList(collab)]);
  if((a.composed||[]).length) tabs.push(['obras','Obras',a.composed.length,`<div class="chips">${a.composed.map(w=>`<a class="chip" href="work.html?id=${w.id}">${esc(w.title)}</a>`).join('')}</div>`]);
  const tabsHtml=tabs.length
    ? `<div class="atabs">${tabs.map((t,i)=>`<button class="atab${i===0?' on':''}" data-tab="${t[0]}">${t[1]} <span class="atabn">${t[2]}</span></button>`).join('')}</div>`
      +tabs.map((t,i)=>`<div class="atabpanel" data-tab="${t[0]}"${i===0?'':' hidden'}>${t[3]}</div>`).join('')
    : '<div class="count">Sin álbumes en tu biblioteca todavía.</div>';
  app.innerHTML=`
    <div class="ahero">
      <div class="ava" style="background:${ava};position:relative;overflow:hidden"><span>${esc((a.name||'?').slice(0,2).toUpperCase())}</span><img src="/api/artist/image?id=${a.id}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s" onload="this.style.opacity=1" onerror="this.remove()"></div>
      <div style="flex:1;min-width:220px">
        <div style="color:var(--text-2);font-size:13px">${esc(sub||'artista')}</div>
        <h1>${esc(a.name)}</h1>
        ${a.disambiguation?`<div style="color:var(--text-2);font-size:14px">${esc(a.disambiguation)}</div>`:''}
        <div style="margin-top:8px">${genres}</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Tier</span> ${tier}</div>
        ${(a.mbid||a.name)?`<div style="margin-top:9px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Enlaces</span>${a.mbid?`<a href="https://musicbrainz.org/artist/${a.mbid}" target="_blank" rel="noopener" style="color:var(--accent)">MusicBrainz</a>`:''}${a.name?`<a href="https://www.last.fm/music/${encodeURIComponent(a.name)}" target="_blank" rel="noopener" style="color:var(--accent)">Last.fm</a>`:''}${a.name?`<a href="https://rateyourmusic.com/search?searchterm=${encodeURIComponent(a.name)}&searchtype=a" target="_blank" rel="noopener" style="color:var(--accent)">RateYourMusic</a>`:''}</div>`:''}
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button id="mixartist" title="Mezcla afín a este artista" style="cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px">${window.icon('music',15)}Mezcla</button><button id="idealdisco" title="Discografía completa de MusicBrainz, con lo que te falta" style="cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px">${window.icon('library',15)}Discografía completa</button><button id="editartist" title="Editar el nombre o unir artistas duplicados" style="cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px">${window.icon('edit',15)}Editar${a.dupes&&a.dupes.length?` · ${a.dupes.length} dup.`:''}</button></div>
      </div>
    </div>
    ${bio}
    <div id="idealsec" style="margin-top:4px"></div>
    ${tabsHtml}
    <div id="afinessec" style="margin-top:22px"></div>`;
  applyBioCollapse();
  ensureEditorial(a);   // trae la bio de Wikipedia (inglés) si no la hay
  loadAfines(a);        // artistas afines (Last.fm), perezoso
}
// ── Artistas afines (Roon: related_artists). Los que tienes enlazan a su ficha; el resto, a Last.fm. ──
async function loadAfines(a){
  const sec=document.getElementById('afinessec'); if(!sec) return;
  let d; try{ d=await fetch('/api/artist/similar?id='+a.id).then(r=>r.json()); }catch(e){ return; }
  if(!d||!d.ok||!d.configured){ return; }               // sin Last.fm configurado: no mostrar nada
  const arts=d.artists||[]; if(!arts.length) return;
  const SHOW=12, more=arts.length>SHOW;
  const chip=x=> x.owned
    ? `<a class="chip" href="artist.html?id=${x.id}" title="En tu biblioteca">${esc(x.name)}</a>`
    : `<a class="chip" href="https://www.last.fm/music/${encodeURIComponent(x.name)}" target="_blank" rel="noopener" style="opacity:.75" title="No está en tu biblioteca">${esc(x.name)}</a>`;
  sec.innerHTML=`<div class="sec">Afines</div><div class="chips" id="afineschips">${arts.slice(0,SHOW).map(chip).join('')}</div>`
    +(more?`<button id="afinesmore" style="margin-top:8px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 12px;font-size:13px">Ver todos (${arts.length})</button>`:'');
  if(more) document.getElementById('afinesmore').addEventListener('click',function(){ document.getElementById('afineschips').innerHTML=arts.map(chip).join(''); this.remove(); });
}
// ── discografía ideal (MusicBrainz): poseídos + HUECOS con «Quiero» (como Roon) ──
const _nnA=s=>String(s||'').normalize('NFD').toLowerCase().replace(/[^a-z0-9]+/g,'');
const _EDA=/(deluxe|expanded|remaster|anniversary|edition|reissue|re-?master|mono|stereo|bonus|special|version|explicit|flac|mp3|vinyl|\d{2,3}\s*bit|\d{2,3}(\.\d)?\s*khz|hi-?res|24-?96|16-?44)/i;
function _ctA(t){t=String(t||'').trim();for(;;){const m=t.match(/[\[(]([^\])]*)[)\]]\s*$/);if(!m||(!/\d{4}/.test(m[1])&&!_EDA.test(m[1])))break;t=t.slice(0,m.index).trim();}return _nnA(t.replace(/\s+[-–—]\s*\d{4}\s*$/,''));}
const _mkA=(a,t)=>_nnA(a)+'::'+_ctA(t);
let idealLoaded=false;
async function loadIdeal(aName){
  const sec=document.getElementById('idealsec'); if(!sec) return; idealLoaded=true;
  sec.innerHTML='<div class="sec" style="margin-top:22px">Discografía completa</div><div style="color:var(--text-2);font-size:13px">Consultando MusicBrainz…</div>';
  let d; try{ d=await fetch('/api/artist/discography?id='+id).then(r=>r.json()); }catch(e){ d={ok:false,error:'red'}; }
  if(!d.ok){ sec.innerHTML='<div class="sec" style="margin-top:22px">Discografía completa</div><div class="note" style="background:var(--surface-2);border-radius:12px;padding:14px;color:var(--text-2);font-size:14px">'+esc(d.needsMbid?'Este artista no está identificado en MusicBrainz, así que no hay discografía completa.':(d.error||'No se pudo cargar.'))+'</div>'; return; }
  // estado de deseos (si hay Liderarrr)
  let keys={}, lider=false; try{ const s=await fetch('/api/config/services').then(r=>r.json()); lider=!!(s.liderarrr&&s.liderarrr.connected); if(lider){ keys=await fetch('/api/liderarrr/wanted/keys').then(r=>r.json()); if(keys&&keys.ok===false)keys={}; } }catch(e){}
  const own=d.items.filter(x=>x.owned), miss=d.items.filter(x=>!x.owned);
  const card=x=>{ const sc=(x.secondary||[]).length?' · '+esc(x.secondary.join(', ')):'';
    if(x.owned) return `<a class="idalb" href="album.html?id=${x.rg_id}" style="display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit"><div style="width:44px;height:44px;border-radius:7px;overflow:hidden;flex:none"><img src="/api/cover?rg=${x.rg_id}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div><div style="flex:1"><div style="font-size:14px">${esc(x.title)}</div><div style="font-size:12.5px;color:var(--text-2)">${x.year||'—'}${sc}</div></div><span class="badge" style="background:var(--accent-bg);color:var(--accent)">la tienes</span></a>`;
    const mk=_mkA(aName,x.title), w=keys[mk];
    const act = w?`<span class="badge" style="background:var(--accent-bg);color:var(--accent)">${w.status==='owned'?'conseguido':w.status==='grabbed'?'pedido':'vigilando'}</span>` : (lider?`<span class="idwant" data-title="${esc(x.title)}" data-year="${x.year||''}" data-mbid="${esc(x.mbid)}" title="Quiero — Liderarrr lo buscará" style="cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:5px">${window.icon('want',15)}Quiero</span>`:'');
    return `<div class="idalb" style="display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);opacity:.62"><div style="width:44px;height:44px;border-radius:7px;background:var(--surface-2);flex:none"></div><div style="flex:1"><div style="font-size:14px">${esc(x.title)}</div><div style="font-size:12.5px;color:var(--text-2)">${x.year||'—'}${sc} · no la tienes</div></div>${act}</div>`;
  };
  sec.innerHTML=`<div class="sec" style="margin-top:22px">Discografía completa <span style="font-size:12px;color:var(--muted);font-weight:400">· ${own.length}/${d.items.length} en tu biblioteca</span></div>`
    + d.items.map(card).join('');
  sec.querySelectorAll('.idwant').forEach(el=>el.onclick=async()=>{ el.style.pointerEvents='none';
    try{ const r=await fetch('/api/liderarrr/wanted',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artist:aName,title:el.dataset.title,year:el.dataset.year||null,rg_mbid:el.dataset.mbid||null,origin:'artista'})}).then(x=>x.json());
      if(r&&(r.ok||r.match_key)) el.outerHTML='<span class="badge" style="background:var(--accent-bg);color:var(--accent)">vigilando</span>'; else el.style.pointerEvents='auto';
    }catch(e){ el.style.pointerEvents='auto'; } });
}
document.addEventListener('click',e=>{ if(e.target.closest('#idealdisco')){ const a=window.__artist; loadIdeal(a?a.name:''); } });
// plega las bios largas (estilo Roon toggle_review)
function applyBioCollapse(){const box=document.getElementById('biobox');if(!box)return;const bt=box.querySelector('.biotext'),tog=box.querySelector('.revtoggle');if(!bt||!tog)return;box.classList.remove('collapsed');tog.hidden=true;if(bt.scrollHeight>280){box.classList.add('collapsed');tog.hidden=false;tog.textContent='Ver más';}}
document.addEventListener('click',e=>{const rt=e.target.closest('#app .revtoggle');if(!rt)return;const box=document.getElementById('biobox');const col=box.classList.toggle('collapsed');rt.textContent=col?'Ver más':'Ver menos';});
// Instant Mix del artista
document.addEventListener('click',e=>{if(e.target.closest('#mixartist')){player.playMix('artist',id);}});
// ── Editar / unir artistas (Roon merge): renombra, une duplicados exactos, o busca otro para unir ──
document.addEventListener('click',e=>{ if(e.target.closest('#editartist')){ openArtistEdit(); } });
function openArtistEdit(){
  const a=window.__artist; if(!a) return;
  let wrap=document.getElementById('aedit'); if(wrap) wrap.remove();
  wrap=document.createElement('div'); wrap.id='aedit';
  wrap.setAttribute('style','position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto');
  const dupes=a.dupes||[];
  const dupRows=dupes.map(d=>`<label class="aduprow" style="display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" class="adupchk" data-id="${d.id}" checked><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}${d.disambiguation?` <span style="color:var(--muted);font-size:11px">(${esc(d.disambiguation)})</span>`:''}</span><span style="color:var(--text-2);font-size:12px">${d.album_count} álb.</span></label>`).join('');
  wrap.innerHTML=`<div style="width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)"><span style="font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:7px">${window.icon('edit',16)}Editar artista</span><span id="aedx" title="Cerrar" style="cursor:pointer;color:var(--text-2);display:inline-flex">${window.icon('close',17)}</span></div>
    <div style="padding:16px">
      <label style="display:block;font-size:11px;color:var(--text-2);margin-bottom:4px">Nombre</label>
      <div style="display:flex;gap:8px"><input id="aename" value="${esc(a.name)}" style="flex:1"><button id="aesave" class="btn-accent" style="padding:7px 14px">Guardar</button></div>
      <div style="font-size:11px;color:var(--text-2);margin-top:4px">${a.album_count} álbum(es) en tu biblioteca. Renombrar también actualiza el nombre en sus álbumes.</div>
      ${dupes.length?`<div style="border-top:1px solid var(--border);margin:14px -16px 0;padding:14px 16px 0"><div style="font-weight:600;margin-bottom:4px">Duplicados con este nombre <span style="color:var(--muted);font-weight:400;font-size:12px">· ${dupes.length}</span></div>
        <div style="font-size:12px;color:var(--text-2);margin-bottom:8px">Únelos en este artista: sus álbumes y créditos pasan aquí y los duplicados se borran.</div>
        ${dupRows}
        <div style="display:flex;justify-content:flex-end;margin-top:10px"><button id="aemerge" class="btn-accent" style="padding:7px 14px">Unir los seleccionados</button></div></div>`:''}
      <div style="border-top:1px solid var(--border);margin:14px -16px 0;padding:14px 16px 0"><div style="font-weight:600;margin-bottom:6px">Unir otro artista</div>
        <input id="aesearch" placeholder="Busca un artista para unirlo aquí…" style="width:100%"><div id="aeresults" style="margin-top:6px"></div></div>
      <div id="aemsg" style="font-size:12.5px;margin-top:10px;display:none"></div>
    </div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.addEventListener('click',ev=>{ if(ev.target===wrap||ev.target.closest('#aedx')) close(); });
  const msg=(t,ok)=>{ const m=document.getElementById('aemsg'); m.style.display='block'; m.style.color=ok?'var(--accent)':'#c0392b'; m.textContent=t; };
  document.getElementById('aesave').onclick=async()=>{ const name=(document.getElementById('aename').value||'').trim(); if(!name) return msg('El nombre no puede estar vacío',false);
    try{ const r=await fetch('/api/artist/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name})}).then(x=>x.json());
      if(r.ok){ close(); toast('Artista renombrado'); load(); } else msg(r.error||'No se pudo guardar',false); }catch(e){ msg('Error de red',false); } };
  const doMerge=async(fromIds)=>{ if(!fromIds.length) return msg('Nada seleccionado',false);
    try{ const r=await fetch('/api/artist/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({into:id,from:fromIds})}).then(x=>x.json());
      if(r.ok){ close(); load(); undoToast('Unido: '+r.merged+' artista(s)', r.undoId); } else msg(r.error||'No se pudo unir',false); }catch(e){ msg('Error de red',false); } };
  const am=document.getElementById('aemerge'); if(am) am.onclick=()=>doMerge([...wrap.querySelectorAll('.adupchk:checked')].map(c=>+c.dataset.id));
  const sb=document.getElementById('aesearch'); let st=null;
  sb.addEventListener('input',()=>{ clearTimeout(st); const q=sb.value.trim(); const box=document.getElementById('aeresults'); if(q.length<2){ box.innerHTML=''; return; }
    st=setTimeout(async()=>{ let items=[]; try{ const r=await fetch('/api/artist/search?id='+id+'&q='+encodeURIComponent(q)).then(x=>x.json()); items=r.items||[]; }catch(e){}
      box.innerHTML=items.length?items.map(it=>`<div class="aeres" data-id="${it.id}" style="display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid var(--border);cursor:pointer"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}${it.disambiguation?` <span style="color:var(--muted);font-size:11px">(${esc(it.disambiguation)})</span>`:''}</span><span style="color:var(--text-2);font-size:12px">${it.album_count} álb.</span><span style="color:var(--accent);font-size:12px">unir →</span></div>`).join(''):'<div style="color:var(--text-2);font-size:12.5px;padding:6px">Sin resultados.</div>';
      box.querySelectorAll('.aeres').forEach(el=>el.onclick=()=>doMerge([+el.dataset.id]));
    },250);
  });
}
// cambiar de pestaña (discografía/apariciones/producción/obras)
document.addEventListener('click',e=>{const pt=e.target.closest('.tp-play');if(pt){const top=(window.TOP||[]).filter(x=>x.tid);const files=top.map(x=>({trackId:x.tid,title:x.title}));const idx=+pt.dataset.ti||0; if(window.player&&files.length)player.playTracks(files,Math.min(idx,files.length-1));return;}});
document.addEventListener('click',e=>{const t=e.target.closest('#app .atab');if(!t)return;const k=t.dataset.tab;
  document.querySelectorAll('#app .atab').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));
  document.querySelectorAll('#app .atabpanel').forEach(p=>p.hidden=(p.dataset.tab!==k));});
function load(){fetch('/api/artist?id='+id).then(r=>r.json()).then(renderArtist).catch(e=>app.innerHTML='error: '+e.message);}
load();
document.addEventListener('escucharrr:changed',load);
// ── edición de metadatos del artista ("tus datos mandan") ──
let toastT=null;
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('style','position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .15s');document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1800);}
function undoToast(msg, undoId){ if(!undoId){ toast(msg); return; }
  let t=document.getElementById('undotoast'); if(t)t.remove(); t=document.createElement('div'); t.id='undotoast';
  t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:130;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center';
  t.innerHTML='<span>'+msg+'</span><a href="#" id="undolink" style="color:#9ecbff;font-weight:600;text-decoration:none">Deshacer</a>'; document.body.appendChild(t);
  const close=()=>t.remove(); const to=setTimeout(close,9000);
  t.querySelector('#undolink').onclick=async(e)=>{ e.preventDefault(); clearTimeout(to); try{ const r=await fetch('/api/merge/undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:undoId})}).then(x=>x.json()); close(); toast(r.ok?'Deshecho':(r.error||'error')); load(); }catch(err){ toast('error'); } }; }
function editField(field,value){return fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_type:'artist',subject_id:id,field,value})}).then(r=>r.json());}
document.addEventListener('click',e=>{
  const tc=e.target.closest('#app .tchip'); if(tc){ editField('tier',tc.dataset.tier).then(r=>{ if(r.ok){toast(tc.dataset.tier?'Tier actualizado':'Tier quitado');load();}else toast(r.error||'error'); }); return; }
  const bs=e.target.closest('#app .biosrc'); if(bs){ showBio(+bs.dataset.i); return; }
  const be=e.target.closest('#app .bioedit'); if(be){ openBioEditor(); return; }
});
function openBioEditor(){
  const box=document.getElementById('biobox'); if(!box||box.querySelector('textarea'))return;
  const existing=rawBio;   // el markdown original, no el texto ya renderizado
  const tx=document.createElement('div'); tx.style.marginTop='8px';
  tx.innerHTML=`<textarea id="biota" style="width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);box-sizing:border-box"></textarea><div style="margin-top:6px;display:flex;gap:8px"><button id="biosave" class="btn-accent" style="padding:6px 14px">Guardar</button><button id="biocancel" style="padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer">Cancelar</button></div>`;
  box.appendChild(tx);
  const ta=document.getElementById('biota'); ta.value=existing; ta.focus();
  document.getElementById('biocancel').onclick=()=>tx.remove();
  document.getElementById('biosave').onclick=()=>{ const v=ta.value; editField('bio',v).then(r=>{ if(r.ok){toast(v.trim()?'Bio guardada':'Bio quitada');load();}else toast(r.error||'error'); }); };
}
</script>
