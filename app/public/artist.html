<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — artista</title>
<link rel="stylesheet" href="styles.css">
<style>
.ahero{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.ahero .ava{width:132px;height:132px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:600;font-family:var(--serif);box-shadow:var(--shadow-lg)}
.ahero h1{font-size:36px;margin:3px 0 2px}
.appears{list-style:none;padding:0;margin:0}
.appears li{display:flex;gap:12px;align-items:baseline;padding:11px 10px;margin:0 -10px;border-radius:9px;border-bottom:1px solid var(--border);transition:background .1s}
.appears li:hover{background:var(--surface-2)}
.appears .yr{color:var(--muted);width:46px;flex:none;font-variant-numeric:tabular-nums}
.appears .roles{color:var(--text-2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:14px"><a href="/" style="color:var(--accent);display:inline-flex;align-items:center;gap:5px"><span data-icon="arrow-left" data-s="15"></span>Biblioteca</a></div>
  <div id="app">cargando…</div>
</div>

<script>
const TC={excel:['#0F6E56','#E1F5EE'],si:['#639922','#EAF3DE'],ok:['#BA7517','#FAEEDA'],meh:['#5F5E5A','#F1EFE8'],no:['#A32D2D','#FCEBEB']},TN={excel:'Excel',si:'Sí',ok:'Ok',meh:'Meh',no:'No'};
const PAIRS=[['#0F6E56','#1D9E75'],['#534AB7','#7F77DD'],['#185FA5','#378ADD'],['#854F0B','#BA7517'],['#72243E','#D4537E'],['#5F5E5A','#888780'],['#3B6D11','#639922'],['#993C1D','#D85A30']];
const AVA=['#534AB7','#0F6E56','#993C1D','#185FA5','#72243E','#3B6D11'];
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function cover(id){return `<img src="/api/cover?rg=${id}" alt="" loading="lazy" draggable="false" style="width:100%;height:100%;object-fit:cover;display:block">`;}
function albumCard(a){return `<a class="card" href="album.html?id=${a.id}">
  <div class="cov">${cover(a.id)}
    ${a.tier_key?`<span class="badge" style="background:${TC[a.tier_key][0]};color:${TC[a.tier_key][1]}">${TN[a.tier_key]}</span>`:''}
    ${a.is_favorite?'<span class="fav">♥</span>':''}</div>
  <div class="t">${esc(a.title)}</div><div class="s">${esc(a.primary_type||'álbum')} · ${a.year||'—'}</div></a>`;}

const id=+new URLSearchParams(location.search).get('id');
const TORD=['excel','si','ok','meh','no'];
let rawBio='';   // markdown crudo de la bio (para el editor; el mostrado va renderizado)
const mdRender=s=>window.mdToHtml?window.mdToHtml(s):esc(s);
function renderArtist(a){
  if(!a||!a.id){app.innerHTML='No encontrado';return;}
  document.title='escucharrr — '+a.name;
  const ava=AVA[a.id%AVA.length];
  const sub=[a.type,a.country,a.founded&&('desde '+a.founded)].filter(Boolean).join(' · ');
  const genres=(a.genres||[]).map(g=>`<a class="gchip" href="genre.html?name=${encodeURIComponent(g.name)}">${esc(g.name)}</a>`).join(' ');
  const provRef=s=>!s||!s.source_ref?'':(/^https?:/.test(s.source_ref)?` · <a href="${esc(s.source_ref)}" target="_blank" rel="noopener" style="color:var(--text-2)">${esc(s.source_ref.replace(/^https?:\/\/(www\.)?/,''))}</a>`:' · '+esc(s.source_ref));
  const tier=`<span class="tiered" style="display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center">${TORD.map(k=>`<span class="tchip" data-tier="${k}" title="${TN[k]}" style="cursor:pointer;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${a.tier_key===k?TC[k][0]:'var(--surface-2)'};color:${a.tier_key===k?TC[k][1]:'var(--text-2)'}">${TN[k]}</span>`).join('')}${a.tier_key?`<span class="tchip" data-tier="" title="Quitar tier" style="cursor:pointer;color:var(--text-2);padding:2px 6px">${window.icon('close',13)}</span>`:''}</span>`;
  const bprov=a.bio&&a.bio_source?('desde '+esc(a.bio_source.source)+provRef(a.bio_source)):'';
  rawBio=a.bio||'';
  const bio=`<div class="about" id="biobox"><div class="prov" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${bprov}</span><span class="bioedit" style="cursor:pointer;color:var(--accent);font-size:12px;white-space:nowrap">${a.bio?'editar bio':'añadir bio'}</span></div><div class="biotext">${a.bio?mdRender(a.bio):'<span style="color:var(--text-2)">Sin biografía. Escribe la tuya — tus datos mandan.</span>'}</div><div class="revtoggle" hidden></div></div>`;
  // Pestañas estilo Roon: discografía (artista principal) / apariciones (interpreta en otros) /
  // producción (produce, mezcla, arregla…) / obras (compositor). Solo se muestran las que tienen contenido.
  const appearsList=list=>`<ul class="appears">`+list.map(x=>`<li><span class="yr">${x.year||'—'}</span><span style="flex:1"><a href="album.html?id=${x.id}" style="color:var(--accent)">${esc(x.title)}</a> <span style="color:var(--text-2)">· ${esc(x.artist||'')}</span>${x.roles&&x.roles.length?`<div class="roles">${x.roles.map(esc).join(' · ')}</div>`:''}</span></li>`).join('')+`</ul>`;
  const PROD_RE=/produc|ingenier|engineer|mezcl|mix|master|arregl|arrang|grab|record/i;
  const appAll=a.appears||[];
  const appProd=appAll.filter(x=>(x.roles||[]).some(r=>PROD_RE.test(r)));
  const appPerf=appAll.filter(x=>!(x.roles||[]).some(r=>PROD_RE.test(r)));
  const tabs=[];
  if((a.albums||[]).length) tabs.push(['disco','Discografía',a.albums.length,`<div class="grid">${a.albums.map(albumCard).join('')}</div>`]);
  if(appPerf.length) tabs.push(['apar','Apariciones',appPerf.length,appearsList(appPerf)]);
  if(appProd.length) tabs.push(['prod','Producción',appProd.length,appearsList(appProd)]);
  if((a.composed||[]).length) tabs.push(['obras','Obras',a.composed.length,`<div class="chips">${a.composed.map(w=>`<a class="chip" href="work.html?id=${w.id}">${esc(w.title)}</a>`).join('')}</div>`]);
  const tabsHtml=tabs.length
    ? `<div class="atabs">${tabs.map((t,i)=>`<button class="atab${i===0?' on':''}" data-tab="${t[0]}">${t[1]} <span class="atabn">${t[2]}</span></button>`).join('')}</div>`
      +tabs.map((t,i)=>`<div class="atabpanel" data-tab="${t[0]}"${i===0?'':' hidden'}>${t[3]}</div>`).join('')
    : '<div class="count">Sin álbumes en tu biblioteca todavía.</div>';
  app.innerHTML=`
    <div class="ahero">
      <div class="ava" style="background:${ava}">${esc((a.name||'?').slice(0,2).toUpperCase())}</div>
      <div style="flex:1;min-width:220px">
        <div style="color:var(--text-2);font-size:13px">${esc(sub||'artista')}</div>
        <h1>${esc(a.name)}</h1>
        ${a.disambiguation?`<div style="color:var(--text-2);font-size:14px">${esc(a.disambiguation)}</div>`:''}
        <div style="margin-top:8px">${genres}</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Tier</span> ${tier}</div>
      </div>
    </div>
    ${bio}
    ${tabsHtml}`;
  applyBioCollapse();
}
// plega las bios largas (estilo Roon toggle_review)
function applyBioCollapse(){const box=document.getElementById('biobox');if(!box)return;const bt=box.querySelector('.biotext'),tog=box.querySelector('.revtoggle');if(!bt||!tog)return;box.classList.remove('collapsed');tog.hidden=true;if(bt.scrollHeight>280){box.classList.add('collapsed');tog.hidden=false;tog.textContent='Ver más';}}
document.addEventListener('click',e=>{const rt=e.target.closest('#app .revtoggle');if(!rt)return;const box=document.getElementById('biobox');const col=box.classList.toggle('collapsed');rt.textContent=col?'Ver más':'Ver menos';});
// cambiar de pestaña (discografía/apariciones/producción/obras)
document.addEventListener('click',e=>{const t=e.target.closest('#app .atab');if(!t)return;const k=t.dataset.tab;
  document.querySelectorAll('#app .atab').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));
  document.querySelectorAll('#app .atabpanel').forEach(p=>p.hidden=(p.dataset.tab!==k));});
function load(){fetch('/api/artist?id='+id).then(r=>r.json()).then(renderArtist).catch(e=>app.innerHTML='error: '+e.message);}
load();
document.addEventListener('escucharrr:changed',load);
// ── edición de metadatos del artista ("tus datos mandan") ──
let toastT=null;
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('style','position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .15s');document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1800);}
function editField(field,value){return fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_type:'artist',subject_id:id,field,value})}).then(r=>r.json());}
document.addEventListener('click',e=>{
  const tc=e.target.closest('#app .tchip'); if(tc){ editField('tier',tc.dataset.tier).then(r=>{ if(r.ok){toast(tc.dataset.tier?'Tier actualizado':'Tier quitado');load();}else toast(r.error||'error'); }); return; }
  const be=e.target.closest('#app .bioedit'); if(be){ openBioEditor(); return; }
});
function openBioEditor(){
  const box=document.getElementById('biobox'); if(!box||box.querySelector('textarea'))return;
  const existing=rawBio;   // el markdown original, no el texto ya renderizado
  const tx=document.createElement('div'); tx.style.marginTop='8px';
  tx.innerHTML=`<textarea id="biota" style="width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);box-sizing:border-box"></textarea><div style="margin-top:6px;display:flex;gap:8px"><button id="biosave" class="btn-accent" style="padding:6px 14px">Guardar</button><button id="biocancel" style="padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer">Cancelar</button></div>`;
  box.appendChild(tx);
  const ta=document.getElementById('biota'); ta.value=existing; ta.focus();
  document.getElementById('biocancel').onclick=()=>tx.remove();
  document.getElementById('biosave').onclick=()=>{ const v=ta.value; editField('bio',v).then(r=>{ if(r.ok){toast(v.trim()?'Bio guardada':'Bio quitada');load();}else toast(r.error||'error'); }); };
}
</script>
<script src="md.js" defer></script>
<script src="icons.js" defer></script>
<script src="nav.js" defer></script>
<script src="player.js" defer></script>
</body>
</html>
