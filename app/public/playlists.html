<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escucharrr — listas</title>
<link rel="stylesheet" href="styles.css">
<style>
nav.top{display:flex;gap:16px;font-size:14px;margin-bottom:16px;flex-wrap:wrap}
nav.top a{color:var(--text-2)} nav.top a.on{color:var(--text);font-weight:600}
.newpl{display:flex;gap:8px;margin:14px 0 20px}
.newpl input{flex:1;max-width:320px}
.pllist{display:flex;flex-direction:column;gap:2px}
.plrow{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:9px;text-decoration:none;color:var(--text)}
.plrow:hover{background:var(--surface-2)}
.plicon{width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:18px}
.plrow .n{color:var(--text-2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="top"><a href="home.html">Inicio</a><a href="/">Biblioteca</a><a href="discover.html">Descubrir</a><a href="genres.html">Géneros</a><a href="playlists.html" class="on">Listas</a><a href="search.html">Buscar</a></nav>
  <h1>Listas de reproducción</h1>
  <div class="newpl">
    <input id="name" placeholder="Nueva lista…" maxlength="80">
    <button class="btn-accent" id="create">Crear</button>
  </div>
  <div class="count" id="count"></div>
  <div class="pllist" id="list"></div>
</div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function load(){fetch('/api/playlists').then(r=>r.json()).then(j=>{
  const pls=j.items||[];
  count.textContent=pls.length?(pls.length+' lista'+(pls.length>1?'s':'')):'';
  list.innerHTML=pls.length?pls.map(p=>
    `<a class="plrow" href="playlist.html?id=${p.id}"><span class="plicon">♫</span><span style="flex:1"><div style="font-weight:600">${esc(p.name)}</div><div class="n">${p.n} pista${p.n===1?'':'s'}</div></span><span style="color:var(--text-2)">›</span></a>`
  ).join(''):'<div style="color:var(--text-2)">Aún no tienes listas. Crea una arriba, o añade álbumes desde su página.</div>';
}).catch(e=>list.textContent='error: '+e.message);}
function create(){const name=name_.value.trim();if(!name)return;
  fetch('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}).then(r=>r.json()).then(j=>{if(j.ok)location.href='playlist.html?id='+j.id;});}
const name_=document.getElementById('name');
document.getElementById('create').addEventListener('click',create);
name_.addEventListener('keydown',e=>{if(e.key==='Enter')create();});
load();
document.addEventListener('escucharrr:changed',load);
</script>
<script src="player.js" defer></script>
</body>
</html>
